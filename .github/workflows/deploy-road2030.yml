name: Deploy Road to 2030

on:
  push:
    branches:
      - main
    paths:
      - 'RoadTo2030.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy to www-road2030
        run: cp RoadTo2030.html www-road2030/index.html

      - name: Deploy to Firebase Hosting (service account)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: traininglogskeleton
          channelId: live
          target: road2030
