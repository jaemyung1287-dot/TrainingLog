name: Deploy Road to 2030

on:
  push:
    branches:
      - main
    paths:
      - 'RoadTo2030.html'
  workflow_dispatch:

concurrency:
  group: deploy-road2030
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy to www-road2030
        run: cp RoadTo2030.html www-road2030/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI (pinned)
        run: npm install -g firebase-tools@15.22.1

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only hosting:road2030 --project traininglogskeleton --non-interactive
