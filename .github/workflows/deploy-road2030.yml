name: Deploy Road to 2030

on:
  push:
    branches:
      - main
    paths:
      - 'RoadTo2030.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy to www-road2030
        run: cp RoadTo2030.html www-road2030/index.html

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:road2030 --token "${{ secrets.FIREBASE_TOKEN }}" --project traininglogskeleton
