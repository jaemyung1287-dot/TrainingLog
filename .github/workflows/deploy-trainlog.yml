name: Deploy TrainLog

on:
  push:
    branches:
      - main
    paths:
      - 'TrainLog.html'
      - 'TrainingLog/www-trainlog/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync TrainLog.html → www-trainlog/index.html
        run: cp TrainLog.html TrainingLog/www-trainlog/index.html

      - name: Deploy to Firebase Hosting (service account)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: traininglogskeleton
          channelId: live
          target: trainlog
