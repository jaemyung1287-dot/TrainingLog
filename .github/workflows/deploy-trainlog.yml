name: Deploy TrainLog

on:
  push:
    branches:
      - main
    paths:
      - 'TrainLog.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy to www-trainlog
        run: |
          mkdir -p www-trainlog
          cp TrainLog.html www-trainlog/index.html

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:trainlog --token "${{ secrets.FIREBASE_TOKEN }}" --project traininglogskeleton
