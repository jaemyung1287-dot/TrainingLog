name: Deploy TrainLog

on:
  push:
    branches:
      - main
    paths:
      - 'TrainLog.html'
      - 'TrainingLog/www-trainlog/**'
  workflow_dispatch:

# 같은 사이트로의 배포가 겹쳐 실패하는 것 방지(직전 배포가 끝날 때까지 대기)
concurrency:
  group: deploy-trainlog
  cancel-in-progress: false

jobs:
  # 배포 전 퇴행 검사. 오래된 로컬 사본을 밀어 원격 변경분을 덮는 사고를 막는다.
  # 실패하면 deploy 잡이 아예 돌지 않으므로 잘못된 파일이 선수 링크에 올라가지 않는다.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # HEAD~1 과 비교해야 하므로

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 퇴행 가드
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node tools/guard-regression.mjs

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync TrainLog.html → www-trainlog/index.html
        run: cp TrainLog.html TrainingLog/www-trainlog/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 버전 고정: 매번 latest 받아오며 생기던 간헐 실패 제거
      - name: Install Firebase CLI (pinned)
        run: npm install -g firebase-tools@15.22.1

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only hosting:trainlog --project traininglogskeleton --non-interactive
