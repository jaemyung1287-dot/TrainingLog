name: Deploy Coach Dashboard

on:
  push:
    branches:
      - main
    paths:
      - 'www-coach-dashboard/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:coach-dashboard --token "${{ secrets.FIREBASE_TOKEN }}" --project traininglogskeleton
