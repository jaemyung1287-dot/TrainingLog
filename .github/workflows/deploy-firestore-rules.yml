name: Deploy Firestore Rules

# 보안 규칙만 배포한다. 규칙은 데이터가 지워지는 걸 막는 유일한 자물쇠라
# 호스팅 배포와 섞지 않고 따로 둔다 — 언제 무엇이 적용됐는지 이력이 분명해야 한다.
on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account
        run: |
          cat > "$RUNNER_TEMP/sa.json" <<'SAEOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SAEOF
          node -e "const j=require(process.env.RUNNER_TEMP+'/sa.json');console.log('service account ok:',j.client_email||'(client_email 없음)')"

      - name: Deploy rules
        id: deploy
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          firebase deploy --only firestore:rules \
            --project traininglogskeleton --non-interactive --debug 2>&1 | tee "$RUNNER_TEMP/out.log"

      # 로그를 저장소에 남긴다 — Actions UI에서 로그를 못 읽는 환경이라
      # 실패 사유를 파일로 확인할 수 있어야 다음 시도를 제대로 고친다.
      - name: Record log
        if: always()
        run: |
          mkdir -p .deploy-logs
          {
            echo "run: ${{ github.run_id }}  |  $(date -u +%FT%TZ)  |  결과: ${{ steps.deploy.outcome }}"
            echo "── firebase 출력 ──"
            grep -viE 'private_key|BEGIN .*PRIVATE KEY|refresh_token' "$RUNNER_TEMP/out.log" | tail -120
          } > .deploy-logs/firestore-rules.log
          git config user.email "actions@github.com"
          git config user.name "rules-bot"
          git add .deploy-logs/firestore-rules.log
          git diff --cached --quiet || { git commit -m "chore: 규칙 배포 로그 (${{ steps.deploy.outcome }})"; git pull --rebase -q; git push; }

      - name: Fail if deploy failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
