name: Deploy Firestore Rules

# 보안 규칙만 배포한다. 규칙은 데이터가 지워지는 걸 막는 유일한 자물쇠라
# 호스팅 배포와 섞지 않고 따로 둔다 — 언제 무엇이 적용됐는지 이력이 분명해야 한다.
on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
  workflow_dispatch:

concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only firestore:rules --project traininglogskeleton --non-interactive
