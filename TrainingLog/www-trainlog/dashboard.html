function renderCondition(){
  const wrap=document.getElementById('tab-condition');
  const athletes=coachData.athletes||[];
  if(!athletes.length){wrap.innerHTML='<div class="empty">No athletes</div>';return;}
  const who=_scopeName();
  const pOpts=[7,14,30,60].map(n=>`<button class="seg-btn ${loadPeriod===n?'on':''}" onclick="loadPeriod=${n};renderCondition()">${n} Days</button>`).join('');

  // 전체/그룹: 선수별 컨디션 평균 테이블 (이름 클릭 → 상세 차트)
  if(!who){
    const dts=getLast(loadPeriod);
    document.getElementById('tb-sub').textContent=(selScope==='all'?'All athletes':'Group '+selScope)+' · '+loadPeriod+' days';
    let gh=_scopeBar()+`<div class="sel-bar">${pOpts}</div><div class="card"><div class="card-hd">컨디션 평균 · 최근 ${loadPeriod}일 <span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">선수 클릭 → 상세</span></div><div class="heatmap-wrap"><table class="data-table"><tr><th>Athlete</th><th>Fatigue</th><th>Mood</th><th>Sleep Q</th><th>Sleep h</th><th>Readiness</th></tr>`;
    _scopeAthletes().forEach(a=>{
      const lg=getLogsByName(a.name), cl=lg.filter(l=>l.type==='condition'&&dts.includes(l.date));
      const av=k=>cl.length?(cl.reduce((s,l)=>s+(l[k]||0),0)/cl.length):null;
      const cell=(v,hg)=>v==null?'<td style="color:var(--hint)">—</td>':`<td style="color:${iCol(v,hg)};font-weight:700">${v.toFixed(1)}</td>`;
      const rd=_readiness(lg,a.name,todayStr());
      const gc=a.group==='A'?'#58a6ff':'#3ecf8e';
      gh+=`<tr style="cursor:pointer" onclick="setScope('${a.name.replace(/'/g,"\\'")}')"><td style="white-space:nowrap"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${gc};margin-right:6px"></span>${_esc(a.name)}</td>${cell(av('fatigue'),false)}${cell(av('mood'),true)}${cell(av('sleepQuality'),true)}${cell(av('sleepHours'),true)}<td>${rd&&rd.ok?`<span style="color:${rd.color};font-weight:700">${rd.score}</span>`:'<span style="color:var(--hint)">—</span>'}</td></tr>`;
    });
    gh+=`</table></div></div>`; wrap.innerHTML=gh; return;
  }
  condAth=who;

  wrap.innerHTML=`
    ${_scopeBar()}
    <div class="sel-bar">${pOpts}</div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-hd">⚡ Readiness Trend &nbsp;<span style="font-weight:400;color:var(--muted);font-size:10px">🟢 양호 · 🟡 주의 · 🔴 회복 — 개인 21일 기준선 대비</span></div>
      <div class="chart-h"><canvas id="ch-readiness"></canvas></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="card-hd">Fatigue · Mood · Sleep Quality</div>
      <div class="chart-h"><canvas id="ch-cond-main"></canvas></div>
    </div>
    <div class="g2">
      <div class="card"><div class="card-hd">Sleep Duration (hours)</div><div class="chart-sm"><canvas id="ch-sleep-h"></canvas></div></div>
      <div class="card"><div class="card-hd" id="cond-stats-title">Average (${loadPeriod} Days)</div><div id="cond-stats" style="margin-top:8px"></div></div>
    </div>`;

  document.getElementById('tb-sub').textContent=condAth+' · '+loadPeriod+' days';
  const logs=getLogsByName(condAth);
  const dates=getLast(loadPeriod).reverse();
  const get=(d,k)=>{const l=logs.find(l=>l.date===d&&l.type==='condition');return l?l[k]:null;};
  const cLogs=logs.filter(l=>l.type==='condition'&&dates.includes(l.date));
  const avg=k=>cLogs.length?(cLogs.reduce((s,l)=>s+(l[k]||0),0)/cLogs.length).toFixed(1):null;

  document.getElementById('cond-stats').innerHTML=`<div style="display:flex;flex-direction:column;gap:6px">
    ${cBar2('Ø Fatigue',avg('fatigue'),10,false)}
    ${cBar2('Ø Mood',avg('mood'),10,true)}
    ${cBar2('Ø Sleep Q',avg('sleepQuality'),10,true)}
    ${cBar2('Ø Sleep h',avg('sleepHours'),12,true)}
  </div>`;

  setTimeout(()=>{
    // Readiness trend (daily score over the period; points colored by traffic light)
    killChart('readiness');
    const cRd=document.getElementById('ch-readiness');
    if(cRd){
      const rd=dates.map(d=>_readiness(logs,condAth,d));
      const rdScores=rd.map(r=>r.ok?r.score:null);
      const rdColors=rd.map(r=>r.ok?r.color:'rgba(255,255,255,.2)');
      charts['readiness']=new Chart(cRd,{type:'line',data:{labels:dates.map(d=>fmt(d)),datasets:[{
        label:'Readiness',data:rdScores,borderColor:'#f7a94f',backgroundColor:'rgba(247,169,79,.07)',fill:true,
        pointBackgroundColor:rdColors,pointBorderColor:rdColors,pointRadius:4,pointHoverRadius:6,spanGaps:true,tension:.35
      }]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>{const r=rd[c.dataIndex];return 'Readiness '+c.parsed.y+(r&&r.mode==='abs'?' (baseline building)':'');}}}},scales:{x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#8b949e',font:{size:9},maxTicksLimit:14}},y:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#8b949e',font:{size:9}},min:0,max:100}}}});
    }
    killChart('cond-main');
    const cMain=document.getElementById('ch-cond-main');
    if(cMain)charts['cond-main']=new Chart(cMain,{type:'line',data:{labels:dates.map(d=>fmt(d)),datasets:[
      {label:'Fatigue',data:dates.map(d=>get(d,'fatigue')),borderColor:'#f85149',backgroundColor:'rgba(248,81,73,.06)',fill:true,pointRadius:3,spanGaps:true,tension:.35},
      {label:'Mood',data:dates.map(d=>get(d,'mood')),borderColor:'#3ecf8e',backgroundColor:'rgba(62,207,142,.06)',fill:true,pointRadius:3,spanGaps:true,tension:.35},
      {label:'Sleep Q',data:dates.map(d=>get(d,'sleepQuality')),borderColor:'#bc8cff',pointRadius:3,spanGaps:true,tension:.35},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:'#c9d1d9',font:{size:11},boxWidth:10}}},scales:{x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#8b949e',font:{size:9},maxTicksLimit:14}},y:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#8b949e',font:{size:9}},min:0,max:10}}}});
    killChart('sleep-h');
    const cSH=document.getElementById('ch-sleep-h');
    if(cSH)charts['sleep-h']=new Chart(cSH,{type:'bar',data:{labels:dates.map(d=>fmt(d)),datasets:[{data:dates.map(d=>get(d,'sleepHours')),backgroundColor:'rgba(188,140,255,.35)',borderColor:'#bc8cff',borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#8b949e',font:{size:9},maxTicksLimit:14}},y:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#8b949e',font:{size:9}},beginAtZero:false,min:4,max:12}}}});
  },50);
}

function cBar2(label,val,max,hg){
  if(val==null)return`<div class="cb-row"><span class="cb-lbl">${label}</span><span style="color:var(--hint)">—</span></div>`;
  const pct=Math.min(100,Math.round((parseFloat(val)/max)*100));
  const c=iCol(parseFloat(val),hg);
  return`<div class="cb-row"><span class="cb-lbl">${label}</span><div class="cb-track"><div class="cb-fill" style="width:${pct}%;background:${c}"></div></div><span class="cb-val" style="color:${c}">${val}</span></div>`;
}

function setAthletesFilter(f){athletesFilter=athletesFilter===f?null:f;renderAthletes();} // 같은 버튼 재클릭 = 해제
function toggleCompare(name){
  if(compareSet.has(name))compareSet.delete(name);else compareSet.add(name);
  renderAthletes();
}

function _athStats(ath,days=7){
  const logs=getLogsByName(ath.name);
  const dateSet=new Set(getLast(days));
  const my=logs.filter(l=>dateSet.has(l.date));
  const wVol=vol(my.filter(l=>l.type==='weight'||l.type==='plyo'));
  const sDist=my.filter(l=>l.type==='sprint').reduce((s,l)=>s+(l.totalDistance||0),0);
  const cL=my.filter(l=>l.type==='condition');
  const avgF=cL.length?(cL.reduce((s,l)=>s+(l.fatigue||0),0)/cL.length):null;
  const avgM=cL.length?(cL.reduce((s,l)=>s+(l.mood||0),0)/cL.length):null;
  const avgSQ=cL.length?(cL.reduce((s,l)=>s+(l.sleepQuality||0),0)/cL.length):null;
  const avgSH=cL.length?(cL.reduce((s,l)=>s+(l.sleepHours||0),0)/cL.length):null;
  const sess=my.filter(l=>l.type!=='condition').length;
  return {wVol,sDist,avgF,avgM,avgSQ,avgSH,sess};
}

function renderAthletes(){
  const wrap=document.getElementById('tab-athletes');
  const allAthletes=coachData.athletes||[];
  if(!allAthletes.length){wrap.innerHTML='<div class="empty">No athletes</div>';return;}

  const groups=[...new Set(allAthletes.map(a=>a.group))].sort();
  const isGrp=f=>groups.includes(f);

  // ── Filter bar ──
  let fb=`<div class="filter-bar">
    <div class="filter-group">
      <button class="flt-btn ${athletesFilter==='all'?'on':''}" onclick="setAthletesFilter('all')">All Athletes</button>`;
  groups.forEach(g=>{
    fb+=`<button class="flt-btn ${athletesFilter===g?'on':''}" onclick="setAthletesFilter('${g}')">Group ${g}</button>`;
  });
  fb+=`</div><div class="flt-sep"></div><div class="filter-group">`;
  allAthletes.forEach(a=>{
    const c=a.group==='A'?'#58a6ff':'#3ecf8e';
    const short=a.name.split(' ').map((p,i)=>i===0?p:p[0]+'.').join(' ');
    fb+=`<button class="flt-btn ath-btn ${athletesFilter===a.name?'on':''}" onclick="setAthletesFilter('${a.name.replace(/'/g,"\\'")}')">
      <span class="flt-dot" style="background:${c}"></span>${short}
    </button>`;
  });
  fb+=`</div></div>`;

  // ── Nothing selected → 안내만 표시 ──
  if(!athletesFilter){
    document.getElementById('tb-sub').textContent='Select a group or athlete';
    wrap.innerHTML=fb+`<div class="empty" style="padding:48px 0">위에서 그룹 또는 선수를 선택하면 훈련 데이터가 표시됩니다<br><span style="font-size:11px;color:var(--hint)">같은 버튼을 다시 누르면 닫힙니다</span></div>`;
    return;
  }

  // ── Filtered list ──
  let athletes = athletesFilter==='all' ? allAthletes
    : isGrp(athletesFilter) ? allAthletes.filter(a=>a.group===athletesFilter)
    : allAthletes.filter(a=>a.name===athletesFilter);

  document.getElementById('tb-sub').textContent=
    compareSet.size>=2?`${compareSet.size} athletes selected · Click cards to compare`:'Last 7 days';

  // ── Compare panel ──
  let comparePanelHtml='';
  if(compareSet.size>=2){
    const cAthletes=allAthletes.filter(a=>compareSet.has(a.name));
    const stats=cAthletes.map(a=>({ath:a,..._athStats(a,7)}));

    // Helper: highlight best/worst value in a row
    const highlight=(vals,hgIdx,higher=true)=>{
      const nums=vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
      if(!nums.length)return vals.map(v=>`<td class="compare-table-td">${v||'—'}</td>`);
      const best=higher?Math.max(...nums):Math.min(...nums);
      const worst=higher?Math.min(...nums):Math.max(...nums);
      return vals.map((v,i)=>{
        const n=parseFloat(v);
        const cls=isNaN(n)?'':(n===best&&nums.filter(x=>x===best).length<nums.length)?'compare-best':(n===worst&&nums.filter(x=>x===worst).length<nums.length)?'compare-worst':'';
        return`<td class="compare-table-td" style="text-align:right;padding:8px 12px;border-bottom:1px solid var(--border2);font-weight:600" ${cls?`class="${cls}"`:''}>${v||'—'}</td>`;
      });
    };

    const fmtV=v=>v>0?_fmtKg(v):'—';
    const fmtD=v=>v>0?v.toLocaleString()+'m':'—';
    const fmtN=(v,d=1)=>v!=null?parseFloat(v).toFixed(d):'—';

    const rows=[
      ['Sessions (7d)', stats.map(s=>s.sess), true],
      ['Volume (7d)', stats.map(s=>s.wVol>0?s.wVol:null), true, s=>fmtV(s.wVol)],
      ['Sprint (7d)', stats.map(s=>s.sDist>0?s.sDist:null), true, s=>fmtD(s.sDist)],
      ['Ø Fatigue', stats.map(s=>s.avgF), false, s=>fmtN(s.avgF)],
      ['Ø Mood', stats.map(s=>s.avgM), true, s=>fmtN(s.avgM)],
      ['Ø Sleep Q', stats.map(s=>s.avgSQ), true, s=>fmtN(s.avgSQ)],
      ['Ø Sleep h', stats.map(s=>s.avgSH), true, s=>fmtN(s.avgSH)],
    ];

    comparePanelHtml=`<div class="compare-panel">
      <div class="compare-panel-title">Comparison · Last 7 Days</div>
      <table class="compare-table">
        <thead><tr>
          <th class="metric-col">Metric</th>
          ${cAthletes.map(a=>{const gc=a.group==='A'?'#58a6ff':'#3ecf8e';return`<th style="text-align:right"><span style="color:${gc}">${a.name.split(' ')[0]}</span></th>`;}).join('')}
        </tr></thead>
        <tbody>`;

    rows.forEach(([label, rawVals, higher, fmtFn])=>{
      const displayVals=fmtFn?stats.map(fmtFn):rawVals.map(v=>v!=null?String(v):'—');
      const nums=rawVals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
      const best=higher?Math.max(...nums):Math.min(...nums);
      const worst=higher?Math.min(...nums):Math.max(...nums);
      comparePanelHtml+=`<tr>
        <td class="metric-col" style="padding:8px 12px;border-bottom:1px solid var(--border2);color:var(--muted)">${label}</td>
        ${displayVals.map((dv,i)=>{
          const n=parseFloat(rawVals[i]);
          const cls=isNaN(n)||nums.length<2?'':(n===best&&nums.filter(x=>x===best).length<nums.length)?'compare-best':(n===worst&&nums.filter(x=>x===worst).length<nums.length)?'compare-worst':'';
          return`<td style="text-align:right;padding:8px 12px;border-bottom:1px solid var(--border2);font-weight:600" ${cls?`class="${cls}"`:''}>${dv}</td>`;
        }).join('')}
      </tr>`;
    });
    comparePanelHtml+=`</tbody></table>
      <div style="margin-top:10px;font-size:11px;color:var(--muted)">
        <span style="color:var(--green)">●</span> Best &nbsp;
        <span style="color:var(--red)">●</span> Worst &nbsp;(Fatigue: lower = better, others: higher = better)
      </div>
    </div>`;
  }

  // ── Athlete cards ──
  const gridCols=athletes.length===1?'1fr':athletes.length===2?'1fr 1fr':'1fr 1fr';
  let cardsHtml=`<div class="g2">`;
  athletes.forEach(ath=>{
    const athId=ath.id;
    const logs=getLogsByName(ath.name);
    const {wVol,sDist,sess}=_athStats(ath,7);
    const trainLogs=logs.filter(l=>l.type!=='condition');
    const recent=trainLogs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
    const keyLifts=_exProgression(trainLogs).slice(0,5);
    const sprintBests=_sprintProgression(trainLogs);
    const grpColor=ath.group==='A'?'#58a6ff':'#3ecf8e';
    const grpBg=ath.group==='A'?'rgba(88,166,255,.12)':'rgba(62,207,142,.12)';
    const isSel=compareSet.has(ath.name);
    // Readiness traffic-light (today, vs. athlete's own 21-day baseline)
    const rd=_readiness(logs,ath.name,todayStr());
    const rdChip=rd.ok
      ? `<span title="Readiness ${rd.score}/100${rd.mode==='abs'?' · baseline building':' · vs 21d baseline'}" style="display:inline-flex;align-items:center;gap:5px;margin-left:auto;padding:3px 9px;border-radius:20px;background:${rd.color}1f;border:1px solid ${rd.color}66"><span style="width:8px;height:8px;border-radius:50%;background:${rd.color};box-shadow:0 0 6px ${rd.color}aa"></span><span style="font-size:12px;font-weight:700;color:${rd.color}">${rd.score}</span></span>`
      : `<span title="No morning check today" style="display:inline-flex;align-items:center;gap:5px;margin-left:auto;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--border2)"><span style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18)"></span><span style="font-size:11px;color:var(--muted)">—</span></span>`;
    // brief per-log exercise summary (top weights / sprint sets)
    const _logBrief=(l)=>{
      if(l.type==='weight'||l.type==='plyo'){
        return (l.exercises||[]).map(e=>{
          let kg=0;
          if(e.setRows&&e.setRows.length)kg=Math.max(...e.setRows.map(r=>parseFloat(r.kg)||0));
          else if(!e.isBodyweight)kg=parseFloat(e.weight)||0;
          return {n:e.name,kg};
        }).filter(x=>x.n).sort((a,b)=>b.kg-a.kg).slice(0,3)
          .map(t=>`${t.n}${t.kg>0?' <b style="color:var(--gold)">'+t.kg+'</b>':''}`).join(' · ');
      }
      if(l.type==='sprint')return (l.sets||[]).slice(0,3).map(s=>`${s.distance||'?'}m×${s.sets||1}×${s.reps||1}${s.actualTime?' <b style="color:var(--green)">'+s.actualTime+'s</b>':''}`).join(' · ');
      return '';
    };

    cardsHtml+=`<div class="ath-card ${isSel?'selected':''}">
      <button class="cmp-toggle" onclick="toggleCompare('${ath.name.replace(/'/g,"\\'")}')" title="Compare">✓</button>
      <div style="padding:14px 34px 14px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:10px">
        <div style="width:38px;height:38px;border-radius:8px;background:${grpBg};color:${grpColor};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0">${ath.name[0]}</div>
        <div>
          <div style="font-size:13px;font-weight:700">${ath.name}</div>
          <div style="margin-top:2px">
            <span class="type-pill" style="background:${grpBg};color:${grpColor}">Group ${ath.group}</span>
            ${ath.dob?`<span style="font-size:10px;color:var(--muted);margin-left:6px">${ath.dob}</span>`:''}
          </div>
        </div>
        ${rdChip}
      </div>
      <div style="padding:14px 16px">
        <div class="g3" style="margin-bottom:12px">
          <div class="stat-chip"><div class="sv" style="color:var(--gold)">${sess}</div><div class="sl">Sessions</div></div>
          <div class="stat-chip"><div class="sv" style="color:var(--gold)">${wVol>0?_fmtKg(wVol):'—'}</div><div class="sl">Volume</div></div>
          <div class="stat-chip"><div class="sv" style="color:var(--green)">${sDist>0?sDist.toLocaleString()+'m':'—'}</div><div class="sl">Sprint</div></div>
        </div>
        ${keyLifts.length?`<div class="sec"><span class="sec-title">🏋️ Key Lifts · 현재 기록</span><div class="sec-line"></div></div>
        <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px">
        ${keyLifts.map(s=>{
          const first=s.series[0].v,last=s.series[s.series.length-1].v;
          const delta=Math.round((last-first)*100)/100;
          return `<tr>
            <td style="padding:3px 0;color:#c9d1d9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px">${_esc(s.name)}</td>
            <td style="padding:3px 4px;text-align:right;font-weight:700;color:var(--gold);white-space:nowrap">${last}kg</td>
            <td style="padding:3px 0;text-align:right;font-weight:700;white-space:nowrap;width:52px;color:${delta>0?'#3ecf8e':delta<0?'#f85149':'var(--hint)'}">${delta>0?'+':''}${delta||'—'}</td>
            <td style="padding:3px 0;text-align:right;color:var(--hint);white-space:nowrap;width:42px">${s.series[s.series.length-1].d.slice(5).replace('-','.')}</td>
          </tr>`;
        }).join('')}</table>`:''}
        ${sprintBests.length?`<div class="sec"><span class="sec-title">⚡ Sprint Bests</span><div class="sec-line"></div></div>
        <table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px">
        ${sprintBests.map(s=>{
          const best=Math.min(...s.series.map(p=>p.v));
          const last=s.series[s.series.length-1];
          return `<tr>
            <td style="padding:3px 0;color:#c9d1d9">${_esc(s.name)}</td>
            <td style="padding:3px 4px;text-align:right;font-weight:700;color:var(--green)">best ${best}s</td>
            <td style="padding:3px 0;text-align:right;color:var(--muted);white-space:nowrap">last ${last.v}s</td>
            <td style="padding:3px 0;text-align:right;color:var(--hint);white-space:nowrap;width:42px">${last.d.slice(5).replace('-','.')}</td>
          </tr>`;
        }).join('')}</table>`:''}
        <div class="sec"><span class="sec-title">Training Logs</span><div class="sec-line"></div></div>
        ${recent.length?recent.map(l=>{
          const c=tc(l.type);
          const v=l.type==='weight'?`${_fmtKg(vol([l]))}`:l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()} m`:l.type==='plyo'?`${l.totalReps||0} reps`:'—';
          const brief=_logBrief(l);
          return`<div class="lr" style="flex-wrap:wrap">
            <span class="ld">${fmt(l.date)}</span>
            <span class="lt" style="color:${c}">${l.type}</span>
            <span class="lv">${v}</span>
            ${l.rpe?`<span class="lrpe">RPE ${l.rpe}</span>`:''}
            <button class="ldel" onclick="openLogEditor('${l.id}','${athId}');event.stopPropagation()" style="opacity:1;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:var(--muted)">✎</button>
            <button class="ldel" onclick="delLog('${l.id}','${athId}',event)">🗑</button>
            ${brief?`<div style="width:100%;font-size:10px;color:var(--muted);padding:2px 0 0 50px">${brief}</div>`:''}
          </div>`;
        }).join(''):'<div style="color:var(--muted);font-size:11px;padding:8px 0">No training logs</div>'}
      </div>
    </div>`;
  });
  cardsHtml+='</div>';

  // 개별 선수 선택 시 → Insights 패널 추가
  let insightsHtml='';
  if(athletes.length===1) insightsHtml=_renderInsights(athletes[0]);

  wrap.innerHTML=fb+comparePanelHtml+cardsHtml+insightsHtml;
}

function genWeeklyReport(){
  const athletes=coachData?.athletes||[];
  const wk=getWeekDates(weekOffset);
  const today=todayStr();
  const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let rows='';
  athletes.forEach(ath=>{
    const logs=getLogsByName(ath.name);
    let weekVol=0,weekDist=0,sessCount=0;
    const cells=wk.map(({ds,d},i)=>{
      const dayLogs=logs.filter(l=>l.date===ds);
      const trains=dayLogs.filter(l=>l.type!=='condition');
      const cond=dayLogs.find(l=>l.type==='condition');
      const isT=ds===today;
      let cell=`<td style="padding:8px;border:1px solid #e5e7eb;vertical-align:top;min-width:80px;${isT?'background:#fefce8':''}">`;
      if(!trains.length&&!cond){cell+='<span style="color:#9ca3af;font-size:10px">Rest</span>';}
      trains.forEach(l=>{
        const c={weight:'#d97706',sprint:'#059669',plyo:'#7c3aed',tabata:'#dc2626'}[l.type]||'#64748b';
        const val=l.type==='weight'?`${_fmtKg(vol([l]))}`:l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()}m`:'—';
        if(l.type==='weight'||l.type==='plyo')weekVol+=vol([l]);
        if(l.type==='sprint')weekDist+=(l.totalDistance||0);
        sessCount++;
        cell+=`<div style="font-size:10px;font-weight:700;color:${c};margin-bottom:1px">${l.type==='weight'?'Weight':l.type==='sprint'?'Sprint':l.type==='plyo'?'Plyo':'Tabata'} ${val}</div>`;
        if(l.rpe)cell+=`<div style="font-size:9px;color:#9ca3af">RPE ${l.rpe}</div>`;
      });
      if(cond){
        const fc=cond.fatigue>=7?'#dc2626':cond.fatigue>=4?'#d97706':'#059669';
        const mc=cond.mood>=7?'#059669':cond.mood>=4?'#d97706':'#dc2626';
        cell+=`<div style="font-size:9px;margin-top:3px;border-top:1px solid #f3f4f6;padding-top:2px">
          <span style="color:${fc}">⚡${cond.fatigue||'—'}</span>
          <span style="color:${mc};margin-left:3px">😊${cond.mood||'—'}</span>
          <span style="color:#9ca3af;margin-left:3px">😴${cond.sleepHours||'—'}h</span>
        </div>`;
        if((cond.soreness||[]).length)cell+=`<div style="font-size:8px;color:#dc2626;margin-top:2px">${cond.soreness.map(s=>s.part+'('+s.intensity+')').join(', ')}</div>`;
      }
      return cell+'</td>';
    }).join('');
    const gc=ath.group==='A'?'#1d4ed8':'#065f46';
    const gb=ath.group==='A'?'#eff6ff':'#f0fdf4';
    rows+=`<tr style="background:${gb}"><td colspan="8" style="padding:10px 12px;border:1px solid #e5e7eb;font-weight:700;font-size:13px">
      ${ath.name} <span style="font-size:10px;font-weight:400;color:#64748b">Group ${ath.group}${ath.dob?' · '+ath.dob:''}</span>
      <span style="font-size:11px;color:#94a3b8;margin-left:8px">${sessCount} sessions · ${weekVol>0?(_fmtKg(weekVol)):'—'} · ${weekDist>0?weekDist.toLocaleString()+'m':'—'}</span>
    </td></tr><tr>${cells}</tr>`;
  });
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<title>TrainLog Weekly · ${fmtFull(wk[0].ds||wk[0].d&&dsFromDate(wk[0].d))}</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;padding:24px 28px;color:#1e293b;font-size:12px}
h1{font-size:18px;font-weight:800;margin-bottom:3px}
.sub{font-size:11px;color:#64748b;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{padding:8px;background:#1e293b;color:#fff;font-size:10px;font-weight:600;border:1px solid #334155;text-align:center}
.footer{margin-top:16px;font-size:10px;color:#94a3b8;text-align:right}
@media print{@page{size:A4 landscape;margin:10mm}}</style></head><body>
<h1>🏋️ Bayern Skeleton TrainLog — Weekly Report</h1>
<div class="sub">${fmtFull(dsFromDate(wk[0].d))} – ${fmtFull(dsFromDate(wk[6].d))} · 출력: ${fmtFull(today)}</div>
<table><thead><tr>${wk.map(({d},i)=>`<th>${DN[i]}<br><span style="font-weight:400;opacity:.7">${d.getDate()}.${d.getMonth()+1}.</span></th>`).join('')}</tr></thead>
<tbody>${rows}</tbody></table>
<div class="footer">TrainLog Coach Dashboard · ${new Date().toLocaleString('ko-KR')}</div>

function genFullReport(){
  const athletes=coachData?.athletes||[];
  const today=todayStr();
  let body='';
  athletes.forEach(ath=>{
    const logs=getLogsByName(ath.name).slice().sort((a,b)=>b.date.localeCompare(a.date));
    const tLogs=logs.filter(l=>l.type!=='condition');
    const cLogs=logs.filter(l=>l.type==='condition');
    const tVol=vol(tLogs);const tDist=tLogs.filter(l=>l.type==='sprint').reduce((s,l)=>s+(l.totalDistance||0),0);
    const avgF=cLogs.length?(cLogs.reduce((s,l)=>s+(l.fatigue||0),0)/cLogs.length).toFixed(1):null;
    const avgM=cLogs.length?(cLogs.reduce((s,l)=>s+(l.mood||0),0)/cLogs.length).toFixed(1):null;
    const rows=tLogs.slice(0,20).map(l=>{
      const c={weight:'#d97706',sprint:'#059669',plyo:'#7c3aed',tabata:'#dc2626'}[l.type]||'#64748b';
      const v=l.type==='weight'?`${_fmtKg(vol([l]))}`:l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()} m`:l.type==='plyo'?`${l.totalReps||0} reps`:'—';
      return`<tr><td style="padding:5px 8px;border:1px solid #e5e7eb">${fmtFull(l.date)}</td><td style="padding:5px 8px;border:1px solid #e5e7eb;font-weight:700;color:${c}">${l.type}</td><td style="padding:5px 8px;border:1px solid #e5e7eb">${v}</td><td style="padding:5px 8px;border:1px solid #e5e7eb;color:#64748b">${l.rpe||'—'}</td><td style="padding:5px 8px;border:1px solid #e5e7eb;font-size:10px;color:#64748b">${l.notes||''}</td></tr>`;
    }).join('');
    const gc=ath.group==='A'?'#1d4ed8':'#065f46';
    body+=`<div style="margin-bottom:28px;page-break-inside:avoid">
      <div style="background:${gc};color:#fff;padding:12px 16px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:15px;font-weight:800">${ath.name}</div><div style="font-size:10px;opacity:.75">Group ${ath.group}${ath.dob?' · '+ath.dob:''}</div></div>
        <div style="font-size:11px;opacity:.8">${tLogs.length} sessions · ${cLogs.length} condition logs</div>
      </div>
      <div style="border:1px solid #e5e7eb;border-top:none;border-radius:0 0 6px 6px;padding:14px 16px">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
          ${[['Volume',tVol>0?_fmtKg(tVol):'—','#d97706'],['Sprint',tDist>=1000?(tDist/1000).toFixed(1)+'km':tDist.toLocaleString()+'m','#059669'],['Ø Fatigue',avgF||'—','#dc2626'],['Ø Mood',avgM||'—','#059669']].map(([l,v,c])=>`<div style="text-align:center;padding:8px;background:#f8fafc;border-radius:6px"><div style="font-size:17px;font-weight:800;color:${c}">${v}</div><div style="font-size:10px;color:#94a3b8">${l}</div></div>`).join('')}
        </div>
        ${rows?`<table style="width:100%;border-collapse:collapse;font-size:11px"><tr>${['Date','Type','Value','RPE','Notes'].map(h=>`<th style="padding:5px 8px;background:#f1f5f9;text-align:left;border:1px solid #e5e7eb;font-size:10px">${h}</th>`).join('')}</tr>${rows}</table>`:'<div style="color:#94a3b8;font-size:11px">No training data</div>'}
      </div>
    </div>`;
  });

<div class="sub">출력일: ${fmtFull(today)} · ${athletes.length} athletes</div>
${body}<div class="footer">TrainLog Coach Dashboard · ${new Date().toLocaleString('ko-KR')}</div>
</body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);

function downloadCSV(type='all'){
  const athletes=coachData?.athletes||[];
  let rows=[],filename='';
  if(type==='condition'){
    filename=`trainlog_condition_${todayStr()}.csv`;
    rows.push(['날짜','선수','그룹','수면시간','수면질','피로도','기분','근육통']);
    athletes.forEach(ath=>{
      getLogsByName(ath.name).filter(l=>l.type==='condition').sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
        rows.push([l.date,ath.name,ath.group,l.sleepHours||'',l.sleepQuality||'',l.fatigue||'',l.mood||'',(l.soreness||[]).map(s=>s.part+'('+s.intensity+')').join(' / ')]);
      });
    });
  }else{
    filename=`trainlog_training_${todayStr()}.csv`;
    rows.push(['날짜','선수','그룹','종류','볼륨(kg)','거리(m)','총렙','RPE','Phase','Week','메모']);
    athletes.forEach(ath=>{
      getLogsByName(ath.name).filter(l=>l.type!=='condition').sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
        rows.push([l.date,ath.name,ath.group,l.type,l.type==='weight'?vol([l]):0,l.type==='sprint'?(l.totalDistance||0):0,l.type==='plyo'?(l.totalReps||0):0,l.rpe||'',l.phase||'',l.week||'',l.notes||'']);
      });
    });
  }
  const blob=new Blob(['﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}

function downloadJSON(){
  const data={exportedAt:new Date().toISOString(),athletes:(coachData?.athletes||[]).map(ath=>({...ath,logs:getLogsByName(ath.name)}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`trainlog_backup_${todayStr()}.json`;a.click();URL.revokeObjectURL(url);
}

// ══ TOOLTIP ══
const _td={};
const ICON={weight:'🏋️',sprint:'⚡',tabata:'🔥',plyo:'🦘',circuit:'🔄'};
const LABEL={weight:'Weight',sprint:'Sprint',tabata:'Tabata',plyo:'Plyo',circuit:'Circuit'};

function _prevDate(ds){
  const d=new Date(ds);d.setDate(d.getDate()-1);return dsFromDate(d);
}
function _trainBlock(trains,dayLabel){
  if(!trains||!trains.length)return'';
  let html=`<div style="font-size:9px;font-weight:700;color:#484f58;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 3px">${dayLabel}</div>`;
  trains.forEach(tr=>{
    const c=tc(tr.type);
    const v=tr.type==='weight'?`${vol([tr]).toLocaleString()} kg`
      :tr.type==='sprint'?`${(tr.totalDistance||0).toLocaleString()} m`
      :tr.type==='tabata'?'8 rounds'
      :tr.type==='plyo'?`${tr.totalReps||0} reps`:'';
    html+=`<div class="tip-row">
      <span>${ICON[tr.type]||'•'}</span>
      <span style="color:${c};font-weight:700">${LABEL[tr.type]||tr.type} ${v}</span>
      ${tr.rpe?`<span style="color:#8b949e;font-size:10px">RPE ${tr.rpe}</span>`:''}
    </div>`;
    // 운동 종목 목록 (weight는 최대 4개)
    if(tr.type==='weight'&&(tr.exercises||[]).length){
      const exs=tr.exercises.filter(e=>!e.isBodyweight).slice(0,4);
      const bwExs=tr.exercises.filter(e=>e.isBodyweight).slice(0,2);
      const all=[...exs,...bwExs].slice(0,4);
      if(all.length){
        html+=`<div style="margin:3px 0 3px 20px;display:flex;flex-direction:column;gap:1px">`;
        all.forEach(ex=>{
          const w=ex.isBodyweight?'BW':(ex.weight>0?ex.weight+'kg':'BW');
          html+=`<div style="font-size:10px;color:#8b949e">${ex.name||''} <span style="color:#c9d1d9">${w}</span></div>`;
        });
        if(tr.exercises.length>4)html+=`<div style="font-size:9px;color:#484f58">+${tr.exercises.length-4} more</div>`;
        html+=`</div>`;
      }
    }
    // sprint sets
    if(tr.type==='sprint'&&(tr.sets||[]).length){
      const sets=tr.sets.slice(0,3);
      html+=`<div style="margin:3px 0 3px 20px;display:flex;flex-direction:column;gap:1px">`;
      sets.forEach(s=>{
        html+=`<div style="font-size:10px;color:#8b949e">${s.distance||'?'}m × ${s.reps||1}r${s.intensity?' @ '+s.intensity+'%':''}</div>`;
      });
      html+=`</div>`;
    }
  });
  return html;
}

function showTip(e,dateKey){
  const t=document.getElementById('g-tip');
  const d=_td[dateKey];if(!d)return;
  const prevKey=_prevDate(dateKey);
  const prevD=_td[prevKey];

  let html=`<div class="tip-date">${fmtFull(dateKey)}</div>`;

  const prevTrains=prevD?.trains||[];
  const sameTrains=d.trains||[];

  if(!prevTrains.length&&!sameTrains.length){
    html+=`<div class="tip-rest">운동 기록 없음</div>`;
  } else {
    if(prevTrains.length)html+=_trainBlock(prevTrains,`📅 전날 (${fmtFull(prevKey)})`);
    if(sameTrains.length)html+=_trainBlock(sameTrains,`📅 당일 (${fmtFull(dateKey)})`);
  }
  if(d.soreLabel){
    html+=`<div class="tip-sore">🔴 ${d.soreLabel}</div>`;
  }
  t.innerHTML=html;
  t.style.display='block';
  _moveTip(e);
}
function hideTip(){document.getElementById('g-tip').style.display='none';}
function _moveTip(e){
  const t=document.getElementById('g-tip');
  if(!t||t.style.display==='none')return;
  const x=e.clientX+14,y=e.clientY-8;
  const tw=t.offsetWidth||260,th=t.offsetHeight||200;
  t.style.left=(x+tw>window.innerWidth?e.clientX-tw-10:x)+'px';
  t.style.top=(y+th>window.innerHeight?e.clientY-th-8:y)+'px';
}
document.addEventListener('mousemove',_moveTip);

// ══ DELETE ══
// Removes the log AND records a cloud tombstone (deletedIds) so athlete phones
// don't resurrect it from their local copy on next sync.
async function delLog(logId,athId,event){
  event?.stopPropagation();
  if(!confirm('Delete this log?'))return;
  try{
    const ref=db.collection('trainlog').doc('athlete_'+athId);
    const snap=await ref.get();if(!snap.exists)return;
    await ref.update({
      logs:(snap.data().logs||[]).filter(l=>l.id!==logId),
      deletedIds:firebase.firestore.FieldValue.arrayUnion(logId),
      _lastUpdated:Date.now()
    });
    athLogs[athId]=(athLogs[athId]||[]).filter(l=>l.id!==logId);
    renderCurrent();
  }catch(e){alert('Error: '+e.message);}
}

// Custom exercise names already used in any plan (so they autocomplete next time)
function _customExNames(){
  const out=new Set();
  Object.values(coachData?.sessionPlans||{}).forEach(plan=>{
    if(!plan)return;
    Object.entries(plan).forEach(([k,g])=>{
      if(k==='phase'||k==='week'||!g||typeof g!=='object')return;
      ['am','pm'].forEach(ss=>{
        ((g[ss]&&g[ss].exercises)||[]).forEach(e=>{ if(e.name&&!EX2SUB[e.name])out.add(e.name); });
      });
      (Array.isArray(g.exercises)?g.exercises:[]).forEach(e=>{ if(e.name&&!EX2SUB[e.name])out.add(e.name); });
    });
  });
  return [...out];
}

let _modalGuard=null; // returns true when there are unsaved changes
function _rmModal(){const m=document.getElementById('x-modal');if(m)m.remove();_modalGuard=null;}
function _tryCloseModal(){
  if(_modalGuard&&_modalGuard()){
    if(!confirm('⚠️ 저장하지 않은 내용이 있습니다. 닫으면 사라집니다.\nClose without saving?'))return;
  }
  _rmModal();

function _mkModal(inner,wide){
  // Preserve scroll position of the modal body across re-renders
  const prevBd=document.querySelector('#x-modal .modal-bd');
  const prevScroll=prevBd?prevBd.scrollTop:0;
  const m=document.getElementById('x-modal');if(m)m.remove(); // re-render keeps guard
  const ov=document.createElement('div');ov.className='modal-ov';ov.id='x-modal';
  ov.innerHTML=`<div class="modal-card" style="${wide?'max-width:940px':''}">${inner}</div>`;
  ov.onclick=e=>{if(e.target===ov)_tryCloseModal();};
  document.body.appendChild(ov);
  const bd=ov.querySelector('.modal-bd');
  if(bd&&prevScroll)bd.scrollTop=prevScroll;
  return ov;
}

// Recompute totals using the SAME rules as the phone app (맨몸 운동 제외 — 횟수로만 추적, SL/SA ×2)
function _recompTotals(l){
  if(l.type==='weight'||l.type==='plyo'){
    l.totalVolume=(l.exercises||[]).reduce((s,e)=>{
      if(e.isBodyweight) return s; // 맨몸 운동은 kg 볼륨 제외 — 횟수로만 추적
      const slMult=(e.isSL||e.isSA)?2:1;
      if(e.setRows&&e.setRows.length){
        return s+e.setRows.reduce((ss,r)=>ss+(parseFloat(r.kg)||0)*(parseFloat(r.reps)||0)*slMult,0);
      }
      return s+(parseFloat(e.weight)||0)*(parseFloat(e.sets)||0)*(parseFloat(e.reps)||0)*slMult;
    },0);
  } else if(l.type==='sprint'){
    l.totalDistance=(l.sets||[]).reduce((s,st)=>s+(parseFloat(st.distance)||0)*(parseInt(st.sets)||1)*(parseInt(st.reps)||1),0);
  }
  return l;
}
async function saveLogEditor(){
  if(!_eLog||!_eAthId)return;
  _recompTotals(_eLog);
  try{
    const ref=db.collection('trainlog').doc('athlete_'+_eAthId);
    const snap=await ref.get();if(!snap.exists){alert('Athlete doc missing');return;}
    const logs=(snap.data().logs||[]).map(l=>l.id===_eLog.id?_eLog:l);
    await ref.update({logs,_lastUpdated:Date.now()});
    athLogs[_eAthId]=logs;
    _rmModal();renderCurrent();
  }catch(e){alert('Save error: '+e.message);}
}
async function deleteLogFromEditor(){
  if(!_eLog||!_eAthId)return;
  const id=_eLog.id,aid=_eAthId;
  _rmModal();
  await delLog(id,aid,null);
}

}
function _planSessOf(day,key,sess){
  const plan=coachData?.sessionPlans?.[day];if(!plan||!plan[key])return null;
  let s=plan[key][sess];
  if(!s&&sess==='am'&&Array.isArray(plan[key].exercises))s=plan[key];
  return (s&&((s.exercises||[]).length||((s.warmup||'').trim())))?s:null;
}

  visKeys.forEach(k=>{
    html+=`<tr><td class="td-ath"><div class="td-ath-inner">
      <div class="td-av" style="background:${k.color}22;color:${k.color}">${k.ath?k.label[0]:k.key==='all'?'∗':k.key}</div>
      <div><div class="td-ath-name">${_esc(k.label)}</div>${k.ath?`<div class="td-ath-meta"><span class="td-ath-badge" style="background:${k.color}22;color:${k.color}">Group ${k.grp}</span></div>`:''}</div>

    wk.forEach(({ds})=>{
      const am=_planSessOf(ds,k.key,'am'),pm=_planSessOf(ds,k.key,'pm');

  wrap.innerHTML=html;
}

// ══ WEEKLY SCHEDULE — completed plans, readable sheet + coach notes ══
function renderSchedule(){
  const wrap=document.getElementById('tab-schedule');
  // Don't re-render while the coach is typing in a comment/lap field (live-sync would wipe it)
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('#tab-schedule')&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;

  const labelOf=k=>keys.find(x=>x.key===k)?.label||k;
  const colorOf=k=>keys.find(x=>x.key===k)?.color||'#a78bfa';

  const wkTag=weekOffset===0?' · This week':weekOffset===1?' · Next week':weekOffset===-1?' · Last week':'';

    <button class="m-btn" style="width:42px;font-size:16px" onclick="shiftWeek(1)">›</button>

  </div>`;

  // ── 1st priority: DAY strip (Mon–Sun) — pick a day to see only that day's sessions ──
  const DN2=['Mo · Mon','Di · Tue','Mi · Wed','Do · Thu','Fr · Fri','Sa · Sat','So · Sun'];
  html+=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
    <button class="flt-btn ${schedDayIdx===null?'on':''}" onclick="schedDayIdx=null;renderSchedule()">Week 전체</button>`;
  wk.forEach(({ds,d},i)=>{
    const on=schedDayIdx===i;
    const isT=ds===today;
    html+=`<button class="flt-btn ${on?'on':''}" style="${isT&&!on?'border-color:rgba(88,166,255,.45)':''}"
      onclick="schedDayIdx=${on?'null':i};renderSchedule()">${DN2[i]}<span style="margin-left:4px;opacity:.6">${d.getDate()}.</span>${isT?' <span style="font-size:8px;color:var(--blue);font-weight:800">●</span>':''}</button>`;
  });
  html+=`</div>`;

  // ── 2nd/3rd priority: Group / athlete filter (same pattern as Overview) ──
  const allAths=coachData?.athletes||[];
  const sBtn=(val,label,dot)=>{
    const on=schedFilter===val;
    return `<button class="flt-btn ${on?'on':''}" onclick="schedFilter='${val.replace(/'/g,"\\'")}';renderSchedule()">${dot?`<span class="flt-dot" style="background:${dot}"></span>`:''}${label}</button>`;
  };
  html+=`<div class="filter-bar"><div class="filter-group">
    ${sBtn('all','All Athletes')}${sBtn('A','Group A')}${sBtn('B','Group B')}
  </div><div class="flt-sep"></div><div class="filter-group">`;
  allAths.forEach(a=>{
    const short=a.name.split(' ').map((p,i)=>i===0?p:p[0]+'.').join(' ');
    html+=sBtn(a.name,short,a.group==='A'?'#58a6ff':'#3ecf8e');
  });
  html+=`</div></div>`;

  // Relevance helpers for the current filter
  const _athRel=(a)=>schedFilter==='all'||a.group===schedFilter||a.name===schedFilter;
  const _keyRel=(key)=>{
    if(key==='all')return true;
    if(key==='A'||key==='B')return schedFilter==='all'||schedFilter===key||allAths.some(a=>a.name===schedFilter&&a.group===key);
    if(key.startsWith('ath_')){const a=allAths.find(x=>'ath_'+x.id===key);return a?_athRel(a):false;}
    return true;
  };

  let anyBlock=false;
  wk.forEach(({ds,d},di)=>{
    if(schedDayIdx!==null&&di!==schedDayIdx)return; // day filter
    const plan=coachData?.sessionPlans?.[ds];
    // ── 1. Logged sessions (detailed, per athlete; respects filter) ──
    const loggedBlocks=[];
    (coachData?.athletes||[]).forEach(a=>{
      if(!_athRel(a))return;
      const dayLogs=(athLogs[a.id]||[]).filter(l=>l.date===ds&&l.type!=='condition');
      if(dayLogs.length)loggedBlocks.push({a,logs:dayLogs});
    });
    const loggedIds=new Set(loggedBlocks.map(b=>'ath_'+b.a.id));
    // ── 2. Planned blocks (merged); skip athlete keys that already logged ──
    const blocks=[];const seen={};
    const _fAth=allAths.find(a=>a.name===schedFilter)||null; // individual-athlete filter?
    if(plan)Object.keys(plan).forEach(key=>{
      if(key==='phase'||key==='week')return;
      if(loggedIds.has(key))return;
      if(!_keyRel(key))return;
      ['am','pm'].forEach(sess=>{
        // Individual filter: show ONLY the plan that actually applies to this athlete
        // (same resolution as the phone app: individual > group > all)
        if(_fAth){
          const athKey='ath_'+_fAth.id;
          const applicable=_planSessOf(ds,athKey,sess)?athKey:_planSessOf(ds,_fAth.group,sess)?_fAth.group:'all';
          if(key!==applicable)return;
        }
        const s=_planSessOf(ds,key,sess);
        if(!s||!(s.exercises||[]).length)return;
        const sig=sess+'|'+JSON.stringify((s.exercises||[]).map(e=>[e.name,e.planIntensity,e.planDistance,e.planSets,e.planReps,e.planRestTime,e.isSL]));
        if(seen[sig]){seen[sig].keys.push(key);return;}
        const b={sess,keys:[key],s};seen[sig]=b;blocks.push(b);
      });
    });
    if(!blocks.length&&!loggedBlocks.length)return;
    anyBlock=true;
    blocks.sort((a,b)=>a.sess.localeCompare(b.sess));
    const isToday=ds===today;
    html+=`<div class="card" style="margin-bottom:14px;${isToday?'border-color:rgba(88,166,255,.45)':''}">
      <div style="font-size:13px;font-weight:800;margin-bottom:10px">${DN[di]} · ${d.getDate()}.${d.getMonth()+1}.${isToday?' <span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--blue-dim);color:var(--blue);font-weight:800">TODAY</span>':''}</div>`;
    // ── Logged sessions (detail + per-exercise coach comments + sprint lap times) ──
    if(loggedBlocks.length){
      html+=`<div style="font-size:9px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">✅ Logged</div>`;
      loggedBlocks.forEach(({a,logs})=>{
        logs.sort((x,y)=>(x.session||'zz').localeCompare(y.session||'zz'));
        logs.forEach(l=>html+=_schedLogBlock(a,l));
      });
    }
    if(blocks.length&&loggedBlocks.length)
      html+=`<div style="font-size:9px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin:4px 0 6px">📋 Planned (not logged yet)</div>`;
    blocks.forEach(b=>{
      const tgtChips=b.keys.map(k=>`<span class="pc-chip" style="background:${colorOf(k)}22;color:${colorOf(k)}">${_esc(labelOf(k))}</span>`).join('');
      const sessChip=`<span class="pc-chip" style="background:${b.sess==='am'?'rgba(247,169,79,.12)':'rgba(167,139,250,.12)'};color:${b.sess==='am'?'#f7a94f':'#a78bfa'}">${b.sess.toUpperCase()}</span>`;
      // 이 블록이 적용되는 선수 ID들 (그룹/전체 키는 멤버로 해석)
      const _blockAthIds=[...new Set(b.keys.flatMap(k=>{
        if(k.startsWith('ath_')){const id=k.slice(4);return allAths.some(a=>a.id===id)?[id]:[];}
        if(k==='A'||k==='B')return allAths.filter(a=>a.group===k&&_athRel(a)).map(a=>a.id);
        if(k==='all')return allAths.filter(a=>_athRel(a)).map(a=>a.id);
        return [];
      }))];
      const keysCsv=b.keys.join(',');
      const exRows=(b.s.exercises||[]).map((e,i)=>{
        const det=[];
        if(e.planIntensity)det.push(e.planIntensity+'%');
        if(e.planDistance)det.push(e.planDistance+'m');
        if(e.planSets||e.planReps)det.push((e.planSets||'—')+'×'+(e.planReps||'—'));
        if(e.planRestTime)det.push('rest '+e.planRestTime+(e.planRestUnit||'s'));
        const icon=TRAINING_STRUCTURE[e.trainingType]?.icon||'';
        const _notes=_blockAthIds.map(aid=>{
          const ath=allAths.find(x=>x.id===aid);
          const tag=_blockAthIds.length>1&&ath?ath.name.split(' ')[0]:'';
          return _prevExNoteHtml(aid,e.name,ds,tag);
        }).join('');
        const _pkey='P|'+ds+'|'+b.sess+'|'+keysCsv+'|'+i;
        const _isOpen=openExCmt===_pkey;
        const _exPanel=_isOpen?_exNotePanelHTML(ds,e.name||'',_blockAthIds,{}):'';
        return `<div style="padding:5px 0;border-top:${i===0?'none':'1px solid rgba(255,255,255,.04)'}">
          <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:10px;color:var(--hint);min-width:16px">${i+1}.</span>
          <span style="font-size:12px;font-weight:600;flex:1">${icon} ${_esc(e.name)}${e.isSL?' <span style="font-size:9px;font-weight:700;color:#4f8ef7">SL</span>':''}</span>
          <span style="font-size:11px;color:rgba(198,168,90,.85);font-weight:600">${det.join(' · ')}</span>
          ${e.ytUrl?`<a href="${_esc(e.ytUrl)}" target="_blank" style="flex-shrink:0;padding:2px 8px;border-radius:6px;background:rgba(255,0,0,.15);border:1px solid rgba(255,0,0,.3);color:#ff4444;font-size:10px;font-weight:800;text-decoration:none">▶</a>`:''}
          <button class="m-btn ghost" style="flex-shrink:0;padding:2px 7px;font-size:11px;${_isOpen?'background:rgba(88,166,255,.2);border-color:rgba(88,166,255,.4)':''}" title="대상 선택 코멘트" onclick="_openExCmt('${_pkey}')">💬</button>
          </div>${_notes}${_exPanel}
        </div>`;
      }).join('');
      const note=b.s.coachNote||'';
      html+=`<div style="border:1px solid var(--border);border-radius:10px;padding:10px 13px;margin-bottom:9px">
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:7px">${sessChip}${tgtChips}
          <span style="flex:1"></span>
          <button class="m-btn ghost" style="font-size:10px;padding:3px 7px" onclick="openPlanEditorKeys('${ds}','${keysCsv}','${b.sess}')">✎ Edit</button>
        </div>
        ${b.s.warmup?`<div style="font-size:11px;color:var(--muted);margin-bottom:6px">🔆 ${_esc(b.s.warmup)}</div>`:''}
        ${exRows}
        <div style="margin-top:9px">
          <span class="m-lbl">📝 Coach note · 데이터/정리</span>
          <textarea class="m-in" style="width:100%;min-height:40px;resize:vertical;font-size:12px"
            placeholder="훈련 관련 데이터, 메모, 정리 내용을 입력하세요… (자동 저장)"
            onblur="_schedSaveNote('${ds}','${b.sess}','${keysCsv}',this.value)">${_esc(note)}</textarea>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  if(!anyBlock)html+=`<div class="empty">No planned sessions this week — Plan 탭에서 작성하세요</div>`;
  wrap.innerHTML=html;
  if(_content)_content.scrollTop=_sc; // keep scroll position across live-sync re-renders
}
// ── 지난 메모: 같은 선수·같은 운동의 가장 최근 coachComment 1개 찾기 ──
function _noteDateShort(ds){const p=(ds||'').split('-');return p.length===3?(+p[1])+'/'+(+p[2]):ds;}
function _prevExNote(athId,exName,beforeDate){
  if(!exName)return null;
  const key=exName.trim().toLowerCase();
  const cands=[];
  // 1) 기록된 세션에 단 운동 코멘트 (이 세션 이전)
  (athLogs[athId]||[]).forEach(l=>{
    if((l.type==='weight'||l.type==='plyo')&&l.date<beforeDate)
      (l.exercises||[]).forEach(e=>{
        if((e.name||'').trim().toLowerCase()===key&&(e.coachComment||'').trim())
          cands.push({date:l.date,comment:e.coachComment.trim()});
      });
  });
  // 2) 대상 선택으로 미리 걸어둔 메모 (이 세션 당일·이전)
  (athNotes[athId]||[]).forEach(n=>{
    if((n.exName||'').trim().toLowerCase()===key&&(n.comment||'').trim()&&(n.date||'')<=beforeDate)
      cands.push({date:n.date,comment:n.comment.trim()});
  });
  if(!cands.length)return null;
  cands.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return cands[0];
}
// 대상 선택 코멘트 패널 (예정·기록 세션 공통): 여러 선수 선택해 한 번에 작성
let openExCmt=null; // 열린 운동 식별 키(문자열)
function _openExCmt(key){openExCmt=(openExCmt===key)?null:key;renderSchedule();}
function _exnToggle(el){el.classList.toggle('on');_exnCount();}
function _exnCount(){const p=document.getElementById('exnote-panel');if(!p)return;const c=p.querySelector('.exn-cnt');if(c)c.textContent=p.querySelectorAll('.exn-chip.on').length;}
function _exnPick(mode){
  const p=document.getElementById('exnote-panel');if(!p)return;
  p.querySelectorAll('.exn-chip').forEach(el=>{
    if(mode==='all')el.classList.add('on');
    else if(mode==='none')el.classList.remove('on');
    else el.classList.toggle('on',el.getAttribute('data-grp')===mode);
  });
  _exnCount();
}
function _exNotePanelHTML(ds,exName,defaultIds,ctx){
  ctx=ctx||{};
  const def=defaultIds||[];
  const all=(coachData?.athletes||[]).slice().sort((x,y)=>(x.group||'').localeCompare(y.group||'')||x.name.localeCompare(y.name));
  const chips=all.map(a=>{
    const short=a.name.split(' ').map((p,k)=>k===0?p:p[0]+'.').join(' ');
    const on=def.includes(a.id);
    return `<div class="exn-chip g${a.group} ${on?'on':''}" data-grp="${a.group}" data-id="${_esc(a.id)}" onclick="_exnToggle(this)"><span class="dot"></span><span class="nm">${_esc(short)}</span><span class="tk">✓</span></div>`;
  }).join('');
  const isRev=ctx.mode==='review';
  return `<div id="exnote-panel" class="exn-panel" data-ds="${ds}" data-ex="${encodeURIComponent(exName)}" data-athid="${_esc(ctx.athId||'')}" data-logid="${_esc(ctx.logId||'')}" data-exidx="${ctx.exIdx==null?'':ctx.exIdx}" data-kind="${ctx.kind||''}" data-mode="${ctx.mode||''}" data-session="${ctx.session||''}">
    <div class="exn-head">
      <span class="exn-title">${isRev?'📝':'💬'} ${_esc(exName)} · 대상 <span class="exn-cnt">${def.length}</span>명</span>
      <span class="exn-quick">
        <button type="button" class="exn-q" onclick="_exnPick('A')">그룹 A</button>
        <button type="button" class="exn-q" onclick="_exnPick('B')">그룹 B</button>
        <button type="button" class="exn-q" onclick="_exnPick('all')">전체</button>
        <button type="button" class="exn-q" onclick="_exnPick('none')">해제</button>
      </span>

function _submitExNote(btn){
  const panel=btn.closest('#exnote-panel');if(!panel)return;
  const ds=panel.getAttribute('data-ds');
  const exName=decodeURIComponent(panel.getAttribute('data-ex'));
  const ids=[...panel.querySelectorAll('.exn-chip.on')].map(c=>c.getAttribute('data-id'));
  const txt=((panel.querySelector('textarea')||{}).value||'').trim();
  if(!ids.length){alert('대상 선수를 1명 이상 선택하세요');return;}
  if(!txt){alert('코멘트를 입력하세요');return;}
  if((panel.getAttribute('data-mode')||'')==='review'){_schedSaveReview(ds,panel.getAttribute('data-session')||'',ids,txt);return;}
  const ctx={athId:panel.getAttribute('data-athid')||'',logId:panel.getAttribute('data-logid')||'',exIdx:panel.getAttribute('data-exidx'),kind:panel.getAttribute('data-kind')||''};
  _schedSaveExNotes(ds,exName,ids,txt,ctx);
}
async function _schedSaveReview(ds,session,athIds,comment){
  let applied=0,skipped=0;
  for(const aid of athIds){
    const logs=athLogs[aid]||[];
    const target=logs.find(l=>l.date===ds&&(session?(l.session||'')===session:true))||logs.find(l=>l.date===ds);
    if(!target){skipped++;continue;}
    await _schedPatchLog(aid,target.id,l=>{l.coachReview=comment;});
    applied++;
  }
  openExCmt=null;
  renderSchedule();
  if(skipped)alert(`${applied}명 적용 · ${skipped}명은 그 날 기록이 없어 건너뜀`);
}
async function _schedSaveExNotes(ds,exName,athIds,comment,ctx){
  ctx=ctx||{};
  const note={id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:ds||todayStr(),exName:exName,comment:comment};
  for(const aid of athIds){
    try{
      if(ctx.logId&&aid===ctx.athId){
        // 현재 기록 세션 본인 → 그 운동/세트의 코멘트로 저장 (이 세션에 그대로 표시)
        const idx=parseInt(ctx.exIdx);
        await _schedPatchLog(aid,ctx.logId,l=>{
          if(ctx.kind==='s'){if(l.sets&&l.sets[idx])l.sets[idx].coachComment=comment;}
          else{if(l.exercises&&l.exercises[idx])l.exercises[idx].coachComment=comment;}
        });
      } else {
        const ref=db.collection('trainlog').doc('athlete_'+aid);
        const snap=await ref.get();
        const arr=snap.exists?(snap.data().exNotes||[]):[];
        arr.push(note);
        await ref.set({exNotes:arr,_lastUpdated:Date.now()},{merge:true});
        athNotes[aid]=arr;
      }
    }catch(e){alert('저장 오류: '+e.message);}
  }
  openExCmt=null;
  renderSchedule();
}

// Patch a single log inside the athlete doc (read-modify-write, keeps everything else)
async function _schedPatchLog(athId,logId,mut){
  try{
    const ref=db.collection('trainlog').doc('athlete_'+athId);
    const snap=await ref.get();if(!snap.exists)return;
    const logs=(snap.data().logs||[]).map(l=>{
      if(l.id!==logId)return l;
      const cp=JSON.parse(JSON.stringify(l));mut(cp);return cp;
    });
    await ref.update({logs,_lastUpdated:Date.now()});
    athLogs[athId]=logs;
  }catch(e){alert('Save error: '+e.message);}
}
function _schedExCmt(athId,logId,i,val){_schedPatchLog(athId,logId,l=>{if(l.exercises&&l.exercises[i])l.exercises[i].coachComment=val;});}
function _schedSetCmt(athId,logId,si,val){_schedPatchLog(athId,logId,l=>{if(l.sets&&l.sets[si])l.sets[si].coachComment=val;});}
function _schedRepTime(athId,logId,si,ri,val){_schedPatchLog(athId,logId,l=>{
  if(l.sets&&l.sets[si]){
    if(!Array.isArray(l.sets[si].repTimes))l.sets[si].repTimes=[];
    l.sets[si].repTimes[ri]=val===''?null:parseFloat(val);
  }
});}

async function _schedSaveNote(day,sess,keysCsv,val){
  try{
    const dayPlan=JSON.parse(JSON.stringify(coachData?.sessionPlans?.[day]||{}));
    let changed=false;
    keysCsv.split(',').forEach(k=>{
      if(dayPlan[k]&&dayPlan[k][sess]&&(dayPlan[k][sess].coachNote||'')!==val){dayPlan[k][sess].coachNote=val;changed=true;}

    if(!coachData.sessionPlans)coachData.sessionPlans={};

}

let _pe=null; // {day,key,keys:Set,sess,warmup,exs:[{name,sub,int,dist,sets,reps,rest,isSL}]}
function _peSig(){
  // strip _-prefixed UI-state props (_orig, _showPrev) — they're not content changes
  return JSON.stringify([_pe.warmup,_pe.sess,[..._pe.keys].sort(),
    _pe.exs.map(e=>{const r={};Object.keys(e).forEach(k=>{if(!k.startsWith('_'))r[k]=e[k];});return r;})]);

function openPlanEditor(day,key,sess){
  _pe={day,key,keys:new Set([key]),sess};
  _loadPlanEditorRows();
  // Group cell clicked but group key itself is empty (e.g. plan was saved per-athlete
  // from the phone app) → adopt the members' INDIVIDUAL plans: load their content and
  // pre-select those athletes as targets so editing/saving goes back to them.
  if(!_pe.exs.length&&!(_pe.warmup||'').trim()&&(key==='A'||key==='B'||key==='all')){
    const members=(coachData?.athletes||[]).filter(a=>key==='all'||a.group===key);
    const withSess=(ss)=>members.filter(a=>_planSessOf(day,'ath_'+a.id,ss));
    let useSess=sess, aths=withSess(sess);
    if(!aths.length){const other=sess==='am'?'pm':'am';const o=withSess(other);if(o.length){useSess=other;aths=o;}}
    if(aths.length){
      _pe.sess=useSess;
      _pe.key='ath_'+aths[0].id;
      _pe.keys=new Set(aths.map(a=>'ath_'+a.id));
      _loadPlanEditorRows();
    }
  }
  _pe._sig0=_peSig();
  _renderPlanEditor();
}

// ── Copy from another session (any day, any group/athlete) ──
function _peCopySources(){
  const out=[];
  const keys=_planKeys();
  const labelOf=k=>keys.find(x=>x.key===k)?.label||k;
  // Same week as the day being edited (Mon–Sun)
  const _d=new Date(_pe.day+'T12:00:00');const _dow=_d.getDay();
  const _mon=new Date(_d);_mon.setDate(_d.getDate()-(_dow===0?6:_dow-1));
  const _sun=new Date(_mon);_sun.setDate(_mon.getDate()+6);
  const _wkMin=dsFromDate(_mon),_wkMax=dsFromDate(_sun);
  Object.entries(coachData?.sessionPlans||{}).forEach(([day,plan])=>{
    if(!plan)return;
    if(day<_wkMin||day>_wkMax)return; // only the same week
    Object.keys(plan).forEach(key=>{
      if(key==='phase'||key==='week')return;
      ['am','pm'].forEach(sess=>{
        if(day===_pe.day&&key===_pe.key&&sess===_pe.sess)return; // self
        const s=_planSessOf(day,key,sess);
        if(!s||!(s.exercises||[]).length)return;
        out.push({day,key,sess,n:s.exercises.length,label:labelOf(key)});
      });
    });
  });
  out.sort((a,b)=>b.day.localeCompare(a.day)||a.label.localeCompare(b.label));
  // dedup identical content rows (same day+sess+content via simple sig)
  const seen=new Set();const dedup=[];
  out.forEach(s=>{
    const sess=_planSessOf(s.day,s.key,s.sess);
    const sig=s.day+'|'+s.sess+'|'+JSON.stringify((sess.exercises||[]).map(e=>[e.name,e.planSets,e.planReps,e.planIntensity]));
    if(seen.has(sig))return;seen.add(sig);dedup.push(s);
  });
  return dedup.slice(0,60);
}

  if(!encoded)return;
  const [day,key,sess]=JSON.parse(encoded);
  const s=_planSessOf(day,key,sess);
  if(!s)return;
  if(_pe.exs.length&&!confirm('Replace current rows with the copied session?'))return;
  _pe.warmup=s.warmup||_pe.warmup;
  _pe.exs=(s.exercises||[]).map(_peRowFrom);
  _renderPlanEditor();
}

    <button class="${unit==='s'?'on':''}" onclick="_pe.exs[${i}].${key}='s';_renderPlanEditor()">s</button>

  const CTYPES=['','Concentric','Eccentric','Isometric','Eccentric-Concentric','Isometric-Concentric'];
  const ESYS=['','ATP-PC (Phosphagen)','Glycolytic (Lactic)','Oxidative (Aerobic)'];
  const rows=_pe.exs.map((e,i)=>{
    const ctypeOpts=CTYPES.map(c=>`<option value="${c}" ${e.ctype===c?'selected':''}>${c||'Contraction'}</option>`).join('');
    let cvalField='';
    if(e.ctype==='Concentric'){
      const tempos=['Ballistic','Fast','Controlled','Slow'];
      cvalField=`<select class="m-in" style="width:100px;padding:5px 6px;font-size:11px" onchange="_pe.exs[${i}].cval=this.value">
        <option value="">Tempo</option>${tempos.map(t=>`<option value="${t}" ${e.cval===t?'selected':''}>${t}</option>`).join('')}</select>`;
    } else if(e.ctype){
      cvalField=`<input class="m-in" type="number" placeholder="sec" style="width:56px;padding:5px 6px" value="${_esc(e.cval)}" oninput="_pe.exs[${i}].cval=this.value">`;
    }
    const esysField=_isSprintRow(e)?`<select class="m-in" style="width:160px;padding:5px 6px;font-size:11px" onchange="_pe.exs[${i}].esys=this.value">
      ${ESYS.map(s=>`<option value="${s}" ${e.esys===s?'selected':''}>${s||'⚡ Energy System'}</option>`).join('')}</select>`:'';
    return `<div class="pe-card">
      <div class="pe-row" style="grid-template-columns:${gridCols};margin-bottom:0">
        <input class="m-in" list="ex-dl" placeholder="Exercise" value="${_esc(e.name)}" onchange="_peName(${i},this.value)">
        <select class="m-in" onchange="_pe.exs[${i}].sub=this.value;_renderPlanEditor()">${subOpts.replace(`value="${e.sub}"`,`value="${e.sub}" selected`)}</select>
        <input class="m-in" type="number" placeholder="%" value="${e.int}" oninput="_pe.exs[${i}].int=this.value">
        ${hasSprint?(_isSprintRow(e)
          ?`<input class="m-in" type="number" placeholder="m" value="${e.dist}" oninput="_pe.exs[${i}].dist=this.value">`
          :`<span style="text-align:center;color:var(--hint);font-size:11px">—</span>`):''}
        <input class="m-in" type="number" placeholder="S" value="${e.sets}" oninput="_pe.exs[${i}].sets=this.value">
        <input class="m-in" type="number" placeholder="R" value="${e.reps}" oninput="_pe.exs[${i}].reps=this.value">
        <span style="display:flex;gap:2px;justify-content:center">
          <button class="pe-ud" ${i===0?'disabled':''} onclick="_peMove(${i},-1)">▲</button>
          <button class="pe-ud" ${i===_pe.exs.length-1?'disabled':''} onclick="_peMove(${i},1)">▼</button>
        </span>
        <button class="m-btn ghost" title="지난 기록 보기/숨기기" style="padding:4px;${e._showPrev?'background:rgba(198,168,90,.15);border:1px solid rgba(198,168,90,.4);border-radius:7px;color:#c6a85a':''}" onclick="_pe.exs[${i}]._showPrev=!_pe.exs[${i}]._showPrev;_renderPlanEditor()">📈</button>
        <button class="m-btn ghost" style="padding:4px" onclick="_pe.exs.splice(${i},1);_renderPlanEditor()">✕</button>
      </div>
      <div class="pe-opts">
        <span class="pe-olbl">훈련 모드</span>
        ${_modeChip(i,'isBW','BW','#3ecf8e')}${_modeChip(i,'isSL','SL','#4f8ef7')}${_modeChip(i,'isSA','SA','#a78bfa')}
        <span class="pe-osep"></span>
        <span class="pe-olbl">Rest</span>
        <span style="font-size:10px;color:var(--muted)">S</span>
        <input class="m-in" type="number" placeholder="—" style="width:50px;padding:5px 6px" value="${_esc(e.restS)}" oninput="_pe.exs[${i}].restS=this.value">${_unitSeg(i,'restSU',e.restSU)}
        <span style="font-size:10px;color:var(--muted)">R</span>
        <input class="m-in" type="number" placeholder="—" style="width:50px;padding:5px 6px" value="${_esc(e.restR)}" oninput="_pe.exs[${i}].restR=this.value">${_unitSeg(i,'restRU',e.restRU)}
        <span class="pe-osep"></span>
        <select class="m-in" style="width:150px;padding:5px 6px;font-size:11px" onchange="_pe.exs[${i}].ctype=this.value;_renderPlanEditor()">${ctypeOpts}</select>
        ${cvalField}
        ${esysField}
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
        <span style="font-size:9px;font-weight:700;color:rgba(255,60,60,.7);letter-spacing:.3px;flex-shrink:0">▶ YT</span>
        <input type="url" class="m-in" placeholder="영상 링크" value="${_esc(e.yt)}"
          style="flex:1;min-width:0;padding:5px 9px;font-size:11px;border-color:rgba(255,60,60,.2)"
          onchange="_pe.exs[${i}].yt=this.value;_renderPlanEditor()">
        ${e.yt?`<a href="${_esc(e.yt)}" target="_blank" style="flex-shrink:0;padding:4px 10px;border-radius:8px;background:rgba(255,0,0,.15);border:1px solid rgba(255,0,0,.3);color:#ff4444;font-size:11px;font-weight:800;text-decoration:none">▶</a>`:''}
        <span style="font-size:9px;font-weight:700;color:rgba(198,168,90,.8);letter-spacing:.3px;flex-shrink:0;margin-left:4px">💬</span>
        <input class="m-in" placeholder="코치 코멘트 (선수 화면에 표시)" value="${_esc(e.cmt)}"
          style="flex:1;min-width:0;padding:5px 9px;font-size:11px;border-color:rgba(198,168,90,.25)"
          oninput="_pe.exs[${i}].cmt=this.value">
      </div>
      ${e._showPrev&&e.name&&e.name.trim()?_pePrevPanel(e.name):''}
    </div>`;
  }).join('');

  _mkModal(`
    <div class="modal-hd">
      <div class="modal-title">📝 Session Plan · ${fmtFull(_pe.day)} (${wd})</div>
      <button class="m-btn ghost" onclick="_tryCloseModal()">✕</button>
    </div>
    <div class="modal-bd">
      ${dl}
      <div style="margin-bottom:12px">
        <span class="m-lbl">Target — 여러 명 선택 가능 (선택된 전원에게 동일 플랜 저장)</span>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px">${grpChips}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">${athChips}</div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <div><span class="m-lbl">Session</span>
          <button class="m-btn" style="${_pe.sess==='am'?'background:rgba(247,169,79,.15);border-color:rgba(247,169,79,.5);color:#f7a94f':''}" onclick="_peSwitch('sess','am')">🌅 AM</button>
          <button class="m-btn" style="${_pe.sess==='pm'?'background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.5);color:#a78bfa':''}" onclick="_peSwitch('sess','pm')">🌇 PM</button>
        </div>
      </div>
      ${(()=>{ const srcs=_peCopySources(); if(!srcs.length) return '';
        const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const opts=srcs.map(s=>{
          const dt=new Date(s.day+'T12:00:00'); const wd=isNaN(dt)?'':dn[dt.getDay()];
          return `<option value='${JSON.stringify([s.day,s.key,s.sess]).replace(/'/g,"&#39;")}'>${s.day.slice(5).replace('-','.')} ${wd} · ${_esc(s.label)} · ${s.sess.toUpperCase()} (${s.n})</option>`;
        }).join('');
        return `<div style="margin-bottom:12px"><span class="m-lbl">📋 Copy from existing session</span>
          <select class="m-in" style="width:100%" onchange="_peCopyFrom(this.value);this.value=''">
            <option value="">— select a session to copy —</option>${opts}
          </select></div>`; })()}
      <div style="margin-bottom:12px"><span class="m-lbl">🔆 Warm-up</span>
        <textarea class="m-in" style="width:100%;min-height:48px;resize:vertical" placeholder="e.g. 10 min dynamic stretching…" oninput="_pe.warmup=this.value">${_esc(_pe.warmup)}</textarea></div>
      <div class="pe-row" style="margin-bottom:6px;grid-template-columns:${gridCols};padding:0 11px">
        <span class="pe-hdr">Exercise</span><span class="pe-hdr">Category</span><span class="pe-hdr">Int%</span>${hasSprint?'<span class="pe-hdr">Dist</span>':''}<span class="pe-hdr">Sets</span><span class="pe-hdr">Reps</span><span class="pe-hdr">Order</span><span></span><span></span>
      </div>
      ${rows||''}
      <button class="m-btn" style="width:100%;margin-top:4px;border-style:dashed" onclick="_pe.exs.push(_peNewRow());_renderPlanEditor()">＋ Add exercise</button>
    </div>
    <div class="modal-ft">
      <button class="m-btn del" onclick="clearPlanSess()">🗑 Clear session</button>
      <span style="flex:1"></span>
      <button class="m-btn" onclick="_tryCloseModal()">Cancel</button>
      <button class="m-btn save" onclick="savePlanEditor()">💾 Save plan${_pe.keys.size>1?` (${_pe.keys.size} targets)`:''}</button>
    </div>`,true);
  _modalGuard=()=>_pe&&_pe._sig0!==undefined&&_peSig()!==_pe._sig0;
}
// ── Previous performance per athlete (플랜 짤 때 지난 기록 참고) ──
function _peTargetAths(){
  const aths=coachData?.athletes||[];
  const out=[];const seen=new Set();
  [..._pe.keys].forEach(k=>{
    let list=[];
    if(k==='all')list=aths;
    else if(k==='A'||k==='B')list=aths.filter(a=>a.group===k);
    else if(k.startsWith('ath_')){const a=aths.find(x=>'ath_'+x.id===k);if(a)list=[a];}
    list.forEach(a=>{if(!seen.has(a.id)){seen.add(a.id);out.push(a);}});
  });
  return out;
}
function _dashPrevPerf(a,exName,beforeDay){
  // weight/plyo: latest log of same exercise
  const wl=(athLogs[a.id]||[])
    .filter(l=>(l.type==='weight'||l.type==='plyo')&&l.date<beforeDay&&(l.exercises||[]).some(e=>e.name===exName))
    .sort((x,y)=>y.date.localeCompare(x.date));
  if(wl.length){
    const e=wl[0].exercises.find(x=>x.name===exName);
    let det;
    if(e.setRows&&e.setRows.length)det=e.setRows.map(r=>`${e.isBodyweight?('BW'+(r.extraKg?'+'+r.extraKg:'')):(r.kg||'—')}×${r.reps||'—'}`).join(' · ');
    else det=`${e.isBodyweight?'BW':(e.weight||'—')+'kg'} ${e.sets||'—'}×${e.reps||'—'}`;
    return {date:wl[0].date,det};
  }
  // sprint: latest set with same name
  const sl=(athLogs[a.id]||[]).filter(l=>l.type==='sprint'&&l.date<beforeDay).sort((x,y)=>y.date.localeCompare(x.date));
  for(const l of sl){
    const st=(l.sets||[]).find(s=>s.name===exName);
    if(st){
      const parts=[];
      if(st.actualTime)parts.push('best '+st.actualTime+'s');
      const laps=(st.repTimes||[]).filter(t=>t!=null);
      if(laps.length)parts.push('laps '+laps.join('/'));
      if(!parts.length&&st.distance)parts.push(st.distance+'m ×'+(st.sets||1)+'×'+(st.reps||1));
      return {date:l.date,det:parts.join(' · ')};
    }
  }
  return null;
}
// Vertical previous-performance panel — opened per exercise via the 📈 toggle
function _pePrevPanel(exName){
  const aths=_peTargetAths();
  const withRec=[],noRec=[];
  aths.forEach(a=>{
    const p=_dashPrevPerf(a,exName.trim(),_pe.day);
    if(p)withRec.push({a,p});else noRec.push(a);
  });
  if(!withRec.length)
    return `<div style="margin-top:7px;padding:8px 12px;background:rgba(198,168,90,.05);border:1px solid rgba(198,168,90,.15);border-radius:8px;font-size:11px;color:var(--muted)">📈 선택된 선수들의 이전 기록 없음</div>`;
  const rows=withRec.map(({a,p})=>`<tr>
    <td style="padding:3px 0;width:92px;font-weight:700;color:${a.group==='A'?'#58a6ff':'#3ecf8e'};white-space:nowrap">${_esc(a.name.split(' ')[0])}</td>
    <td style="padding:3px 6px;color:rgba(198,168,90,.95)">${_esc(p.det)}</td>
    <td style="padding:3px 0;text-align:right;color:var(--hint);white-space:nowrap;width:46px">${p.date.slice(5).replace('-','.')}</td>
  </tr>`).join('');
  const noRow=noRec.length?`<tr><td colspan="3" style="padding:4px 0;color:var(--hint);font-size:10px">${_esc(noRec.map(a=>a.name.split(' ')[0]).join(', '))} — 기록 없음</td></tr>`:'';
  return `<div style="margin-top:7px;padding:8px 12px;background:rgba(198,168,90,.05);border:1px solid rgba(198,168,90,.15);border-radius:8px">
    <table style="width:100%;border-collapse:collapse;font-size:11px">${rows}${noRow}</table>
  </div>`;
}
function _peName(i,val){
  _pe.exs[i].name=val;
  const sub=EX2SUB[val];
  if(sub)_pe.exs[i].sub=sub;
  else if(val&&val.trim()&&!_pe.exs[i].sub)_pe.exs[i].sub='기타'; // 새 운동 → 미분류 (앱과 동일하게 자유 추가)
  _renderPlanEditor();
}
function _peMove(i,dir){
  const j=i+dir;
  if(j<0||j>=_pe.exs.length)return;
  const t=_pe.exs[i];_pe.exs[i]=_pe.exs[j];_pe.exs[j]=t;
  _renderPlanEditor();
}
function _peBuildSession(){
  const exercises=_pe.exs.filter(e=>e.name&&e.name.trim()).map(e=>{
    const sub=e.sub||EX2SUB[e.name]||'기타';
    const tType=SUB2TYPE[sub]||'Resistance Training';
    const base=e._orig?JSON.parse(JSON.stringify(e._orig)):{};
    return Object.assign(base,{
      name:e.name.trim(),trainingType:tType,subCategory:sub,
      planIntensity:e.int||'',planDistance:e.dist||'',planSets:e.sets||'',planReps:e.reps||'',
      isBW:!!e.isBW,isSL:!!e.isSL,isSA:!!e.isSA,
      planRestTime:e.restS||'',planRestUnit:e.restSU||'m',
      planRestTimeReps:e.restR||'',planRestUnitReps:e.restRU||'m',
      planContractionType:e.ctype||'',planContractionValue:e.cval||'',
      planEnergySystem:e.esys||'',ytUrl:(e.yt||'').trim(),coachComment:(e.cmt||'').trim(),
      planLegMode:e.isSL?'SL':e.isSA?'SA':(base.planLegMode==='SL'||base.planLegMode==='SA'?'DL':base.planLegMode||'DL')
    });
  });
  return {warmup:_pe.warmup||'',cooldown:'',exercises};
}
async function savePlanEditor(){
  try{
    const dayPlan=JSON.parse(JSON.stringify(coachData?.sessionPlans?.[_pe.day]||{}));
    const sessObj=_peBuildSession();
    // Write the same session to EVERY selected target
    [..._pe.keys].forEach(key=>{
      if(!dayPlan[key])dayPlan[key]={};
      const copy=JSON.parse(JSON.stringify(sessObj));
      const prev=dayPlan[key][_pe.sess];
      if(prev){copy.cooldown=prev.cooldown||'';if(prev.conditioningText)copy.conditioningText=prev.conditioningText;}
      dayPlan[key][_pe.sess]=copy;
    });
    await db.collection('trainlog').doc('coach').update({['sessionPlans.'+_pe.day]:dayPlan,_lastUpdated:Date.now()});
    if(!coachData.sessionPlans)coachData.sessionPlans={};
    coachData.sessionPlans[_pe.day]=dayPlan;
    _rmModal();renderCurrent();
  }catch(e){alert('Save error: '+e.message);}
}
async function clearPlanSess(){
  const n=_pe.keys.size;
  if(!confirm(`Clear ${_pe.sess.toUpperCase()} plan on ${_pe.day} for ${n} selected target${n>1?'s':''}?`))return;
  try{
    const dayPlan=JSON.parse(JSON.stringify(coachData?.sessionPlans?.[_pe.day]||{}));
    [..._pe.keys].forEach(key=>{
      if(dayPlan[key]){
        delete dayPlan[key][_pe.sess];
        if(_pe.sess==='am'&&Array.isArray(dayPlan[key].exercises))delete dayPlan[key].exercises; // legacy flat
        if(!Object.keys(dayPlan[key]).length)delete dayPlan[key];
      }
    });
    await db.collection('trainlog').doc('coach').update({['sessionPlans.'+_pe.day]:dayPlan,_lastUpdated:Date.now()});
    coachData.sessionPlans[_pe.day]=dayPlan;
    _rmModal();renderCurrent();
  }catch(e){alert('Error: '+e.message);}
}

// ══ COMMENT TRANSLATION (hover → EN, online) ══
(function(){
  if(window.__tlInit)return; window.__tlInit=true;
  const cache={}; let tipEl=null, curTarget=null, seq=0;
  function removeTip(){ if(tipEl){tipEl.remove();tipEl=null;} curTarget=null; }
  async function translate(text){
    if(cache[text])return cache[text];
    try{
      const u="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(text);
      const r=await fetch(u); const j=await r.json();
      const o=j[0].map(s=>s[0]).join(""); cache[text]=o; return o;
    }catch(e){
      try{ const r2=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=de|en"); const j2=await r2.json(); const o2=j2.responseData.translatedText; cache[text]=o2; return o2; }
      catch(e2){ return null; }
    }
  }
  function showTip(target,content){
    removeTip();
    const r=target.getBoundingClientRect();
    tipEl=document.createElement('div'); tipEl.className='tl-tip';
    tipEl.innerHTML='<div class="tl-h">🌐 English</div><div class="tl-b"></div>';
    tipEl.querySelector('.tl-b').textContent=content;
    document.body.appendChild(tipEl);
    tipEl.style.left=Math.max(8,Math.min(r.left,window.innerWidth-310))+'px';
    tipEl.style.top=(r.bottom+6)+'px';
    curTarget=target;
  }
  document.addEventListener('mouseover', async (ev)=>{
    const t=ev.target.closest && ev.target.closest('.cmt-text');
    if(!t || t===curTarget) return;
    const text=(t.textContent||'').trim(); if(!text) return;
    const my=t, mySeq=++seq;
    showTip(t,'translating…');
    const tr=await translate(text);
    if(curTarget===my && tipEl && mySeq===seq){ tipEl.querySelector('.tl-b').textContent = tr||'translation unavailable (offline?)'; }
  });
  document.addEventListener('mouseout', (ev)=>{
    const t=ev.target.closest && ev.target.closest('.cmt-text');
    if(t && !t.contains(ev.relatedTarget)) removeTip();
  });
})();
