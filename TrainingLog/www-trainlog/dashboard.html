<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrainLog · Coach Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root{
  --bg:#0d1117;
  --bg2:#161b22;
  --bg3:#1c2128;
  --card:#1c2128;
  --border:#30363d;
  --border2:#21262d;
  --text:#e6edf3;
  --text2:#c9d1d9;
  --muted:#8b949e;
  --hint:#484f58;
  --gold:#f7a94f;
  --gold-dim:rgba(247,169,79,.15);
  --green:#3ecf8e;
  --green-dim:rgba(62,207,142,.12);
  --red:#f85149;
  --red-dim:rgba(248,81,73,.12);
  --blue:#58a6ff;
  --blue-dim:rgba(88,166,255,.12);
  --purple:#bc8cff;
  --sidebar:220px;
  --radius:8px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.5}

/* ── Login ── */
#login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;gap:16px;background:var(--bg);
}
.lg-logo{font-size:44px;filter:drop-shadow(0 4px 12px rgba(247,169,79,.3))}
.lg-title{font-size:22px;font-weight:700;letter-spacing:-.3px}
.lg-sub{font-size:12px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
#google-btn{
  display:flex;align-items:center;gap:10px;padding:11px 24px;
  border-radius:var(--radius);background:#fff;color:#24292f;font-size:13px;font-weight:600;
  border:none;cursor:pointer;margin-top:8px;transition:opacity .15s
}
#google-btn:hover{opacity:.92}
#google-btn img{width:18px}
#auth-err{color:var(--red);font-size:12px}

/* ── App shell ── */
#app{display:none;height:100vh;flex-direction:row}
#app.show{display:flex}

/* ── Sidebar ── */
#sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column
}
.sb-brand{
  padding:16px 16px 14px;
  border-bottom:1px solid var(--border2);
  display:flex;align-items:center;gap:10px
}
.sb-brand-icon{font-size:18px}
.sb-brand-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.sb-brand-sub{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.2px;margin-top:1px}

nav{padding:8px 8px;flex:1;display:flex;flex-direction:column;gap:1px}
.nb{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 10px;border-radius:6px;
  background:none;border:none;border-left:2px solid transparent;
  color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;
  text-align:left;transition:all .1s;font-family:inherit
}
.nb:hover{background:rgba(255,255,255,.05);color:var(--text2)}
.nb.on{
  background:rgba(247,169,79,.1);color:var(--gold);
  border-left-color:var(--gold);font-weight:600
}
.nb .ni{font-size:13px;width:16px;flex-shrink:0;opacity:.8}

.sb-section-label{
  font-size:10px;font-weight:600;color:var(--hint);
  text-transform:uppercase;letter-spacing:.8px;
  padding:10px 12px 4px
}

/* ── Sidebar bottom ── */
.sb-bottom{border-top:1px solid var(--border2)}
.week-nav{padding:10px 12px}
.week-nav-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.week-nav-row{display:flex;align-items:center;gap:4px}
.wn-btn{
  padding:4px 8px;border-radius:5px;
  background:var(--bg3);border:1px solid var(--border);
  color:var(--text2);font-size:13px;cursor:pointer;line-height:1;
  transition:background .1s
}
.wn-btn:hover{background:var(--border)}
.wn-dates{font-size:11px;font-weight:600;color:var(--text);text-align:center;flex:1}
.wn-today{
  width:100%;margin-top:5px;padding:4px;border-radius:5px;
  background:var(--blue-dim);border:1px solid rgba(88,166,255,.25);
  color:var(--blue);font-size:10px;font-weight:600;cursor:pointer;
  font-family:inherit;display:none;transition:background .1s
}
.wn-today:hover{background:rgba(88,166,255,.2)}

.sb-user{
  padding:10px 12px;display:flex;align-items:center;gap:9px;
  border-top:1px solid var(--border2)
}
.sb-av{width:26px;height:26px;border-radius:50%;background:var(--border);overflow:hidden;flex-shrink:0}
.sb-av img{width:100%;height:100%;object-fit:cover}
.sb-user-info{flex:1;min-width:0}
.sb-name{font-size:11px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-status{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--green)}
.sb-status-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.sb-out{
  width:calc(100% - 24px);margin:0 12px 10px;
  padding:6px;border-radius:6px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;
  font-family:inherit;transition:all .1s
}
.sb-out:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}

/* ── Main panel ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

#topbar{
  padding:0 24px;height:52px;
  border-bottom:1px solid var(--border);background:var(--bg2);
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between
}
.tb-left{display:flex;align-items:baseline;gap:8px}
.tb-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.tb-sub{font-size:12px;color:var(--muted)}
.live-badge{
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;color:var(--green);
  padding:3px 8px;border-radius:20px;
  background:var(--green-dim);border:1px solid rgba(62,207,142,.2)
}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2.5s infinite}

/* ── Content ── */
#content{flex:1;overflow-y:auto;padding:20px 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#content::-webkit-scrollbar{width:5px}
#content::-webkit-scrollbar-track{background:transparent}
#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.tab{display:none}.tab.on{display:block}

/* ── Loading ── */
.page-loading{display:flex;align-items:center;gap:10px;padding:40px;color:var(--muted);font-size:12px}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Filter bar ── */
.filter-bar{
  display:flex;align-items:center;gap:6px;
  margin-bottom:20px;padding-bottom:16px;
  border-bottom:1px solid var(--border2);flex-wrap:wrap
}
.filter-group{display:flex;align-items:center;gap:3px}
.flt-btn{
  padding:4px 12px;border-radius:6px;font-size:11px;font-weight:500;
  background:none;border:1px solid var(--border);color:var(--muted);
  cursor:pointer;font-family:inherit;transition:all .1s;white-space:nowrap
}
.flt-btn:hover{border-color:var(--border2);color:var(--text2);background:rgba(255,255,255,.04)}
.flt-btn.on{
  background:rgba(247,169,79,.1);border-color:rgba(247,169,79,.35);
  color:var(--gold);font-weight:600
}
.flt-btn.ath-btn{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px
}
.flt-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.flt-sep{width:1px;height:14px;background:var(--border);margin:0 4px;flex-shrink:0}

/* ── Schedule table (Overview) ── */
.sched-wrap{overflow-x:auto}
.sched-table{width:100%;border-collapse:collapse;min-width:900px}

.sched-table thead th{
  padding:8px 10px;font-size:10px;font-weight:600;
  color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  border-bottom:2px solid var(--border);text-align:center;
  background:var(--bg2);position:sticky;top:0;z-index:2
}
.sched-table thead th.day-today{
  color:var(--blue);border-bottom-color:var(--blue)
}
.sched-table thead th.ath-col{
  text-align:left;min-width:160px;width:160px
}

.sched-table tbody tr{border-bottom:1px solid var(--border2)}
.sched-table tbody tr:last-child{border-bottom:none}
.sched-table tbody tr:hover td{background:rgba(255,255,255,.015)}

.sched-table td{
  padding:10px;vertical-align:top;border-right:1px solid var(--border2)
}
.sched-table td:last-child{border-right:none}

.td-ath{
  min-width:160px;width:160px;padding:12px 10px;
  vertical-align:middle;position:sticky;left:0;
  background:var(--bg);z-index:1
}
.td-ath-inner{display:flex;align-items:center;gap:9px}
.td-av{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700
}
.td-ath-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
.td-ath-meta{font-size:10px;color:var(--muted);margin-top:1px}
.td-ath-badge{
  display:inline-block;padding:1px 5px;border-radius:3px;
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px
}

.td-day{min-width:120px;vertical-align:top}
.td-day.is-today{background:rgba(88,166,255,.04)}

.day-rest{
  color:var(--hint);font-size:10px;padding-top:2px
}

.session-block{
  padding:5px 7px;border-radius:5px;margin-bottom:4px;
  border-left:2px solid transparent
}
.session-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.session-val{font-size:12px;font-weight:700;line-height:1.2}
.session-rpe{font-size:10px;color:var(--muted);margin-top:1px}

.cond-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 7px;border-radius:5px;margin-bottom:4px;background:rgba(188,140,255,.08);border-left:2px solid rgba(188,140,255,.5)}
.cond-item{font-size:10px;font-weight:600;white-space:nowrap}
.cond-lbl{color:var(--hint);font-weight:500;font-size:9px}

.sore-row{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 4px}
.sore-tag{
  font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;white-space:nowrap
}

.plan-hint{
  font-size:9px;color:var(--blue);
  padding:3px 6px;border-radius:4px;
  background:var(--blue-dim);display:inline-block;margin-bottom:4px
}

.session-block{cursor:pointer}
.session-block:hover{filter:brightness(1.12)}
.session-type{display:flex;align-items:center;gap:3px}
.sb-caret{font-size:8px;opacity:.45;margin-left:auto}
.sess-detail{display:none;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.08)}
.session-block.open .sess-detail{display:block}
.sd-row{font-size:9px;color:#8b949e;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-note{font-size:9px;color:#8b949e;font-style:italic;margin-top:4px;line-height:1.35;white-space:normal}
.cmt-wrap{margin:4px 0 2px;cursor:pointer}
.cmt-chip{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:3px;padding:1px 5px;white-space:nowrap}
.cmt-wrap:hover .cmt-chip,.cmt-wrap.show .cmt-chip{color:var(--text2);background:rgba(255,255,255,.1);border-color:var(--blue)}
.cmt-text{display:none;font-size:9px;font-weight:400;color:#aab2bd;line-height:1.4;margin-top:3px;white-space:normal;background:rgba(255,255,255,.04);border-left:2px solid var(--border2);padding:4px 6px;border-radius:0 4px 4px 0}
.cmt-wrap:hover .cmt-text,.cmt-wrap.show .cmt-text{display:block}
.cmt-text{cursor:help}
.tl-tip{position:fixed;z-index:99999;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:7px 9px;font-size:11px;color:#c9d1d9;line-height:1.45;max-width:300px;box-shadow:0 8px 24px rgba(0,0,0,.55);white-space:normal;pointer-events:none}
.tl-tip .tl-h{font-size:9px;color:#58a6ff;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.cond-note{margin-bottom:4px}
.sess-hd{font-size:8px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.6px;margin:3px 0 2px}
.sess-hd.am{color:#d8a657}
.sess-hd.pm{color:#7aa2f7}
.train-wrap.div-top{margin-top:6px;padding-top:6px;border-top:1px solid var(--border2)}

/* ── Section header ── */
.sec{margin:0 0 16px;display:flex;align-items:center;gap:10px}
.sec-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.sec-line{flex:1;height:1px;background:var(--border2)}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-hd{
  font-size:10px;font-weight:700;color:#c9d1d9;
  text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:12px;display:flex;align-items:center;justify-content:space-between
}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ── Stat chips ── */
.stat-chip{
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:6px;padding:10px 12px;text-align:center
}
.stat-chip .sv{font-size:17px;font-weight:800;line-height:1.2}
.stat-chip .sl{font-size:10px;color:var(--muted);margin-top:2px}

/* ── Load table ── */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{
  padding:8px 10px;text-align:left;font-size:10px;font-weight:600;
  color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2)
}
.data-table td{
  padding:8px 10px;border-bottom:1px solid var(--border2);vertical-align:top
}
.data-table tr:hover td{background:rgba(255,255,255,.02)}
.data-table td:last-child,.data-table th:last-child{text-align:right}

.type-pill{
  display:inline-block;padding:1px 6px;border-radius:3px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px
}

/* ── Heatmap ── */
.heatmap-wrap{overflow-x:auto}
.heatmap{border-collapse:collapse;font-size:11px;width:100%}
.heatmap th{
  padding:6px 8px;font-size:10px;font-weight:600;color:var(--muted);
  text-align:center;white-space:nowrap;border-bottom:1px solid var(--border);background:var(--bg2)
}
.heatmap th.part-col{text-align:left;min-width:120px}
.heatmap td{padding:4px 5px;text-align:center;border:1px solid rgba(255,255,255,.03)}
.heatmap td.part-label{text-align:left;padding-left:8px;white-space:nowrap;font-weight:500}
.hm-cell{
  width:26px;height:22px;border-radius:3px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;width:100%
}

/* ── Charts ── */
.chart-h{position:relative;height:210px}
.chart-sm{position:relative;height:160px}

/* ── Selector bar ── */
.sel-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.seg-btn{
  padding:4px 12px;border-radius:6px;font-size:11px;font-weight:500;
  background:none;border:1px solid var(--border);color:var(--muted);
  cursor:pointer;font-family:inherit;transition:all .1s
}
.seg-btn:hover{color:var(--text2);background:rgba(255,255,255,.04)}
.seg-btn.on{
  background:rgba(247,169,79,.1);border-color:rgba(247,169,79,.35);
  color:var(--gold);font-weight:600
}
.fsel{
  padding:5px 10px;border-radius:6px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text2);font-size:12px;outline:none;cursor:pointer;font-family:inherit
}

/* ── Condition bars ── */
.cb-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cb-lbl{font-size:10px;color:#8b949e;min-width:56px;flex-shrink:0}
.cb-track{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.cb-fill{height:100%;border-radius:2px}
.cb-val{font-size:10px;font-weight:700;min-width:20px;text-align:right;flex-shrink:0}

/* ── Log rows ── */
.lr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border2);font-size:12px}
.lr:last-child{border-bottom:none}
.lr .ld{color:var(--muted);min-width:50px;flex-shrink:0;font-size:11px}
.lr .lt{font-weight:600;min-width:52px;flex-shrink:0}
.lr .lv{flex:1;color:var(--text2)}
.lr .lrpe{color:var(--muted);font-size:10px;flex-shrink:0}
.lr .ldel{
  padding:1px 6px;border-radius:4px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);font-size:10px;cursor:pointer;opacity:0;
  transition:all .1s;flex-shrink:0
}
.lr:hover .ldel{opacity:1}
.lr:hover .ldel:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}

/* ── Export ── */
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.exp-btn{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;border-radius:var(--radius);cursor:pointer;
  font-family:inherit;text-align:left;border:1px solid var(--border);
  background:var(--card);transition:all .12s
}
.exp-btn:hover{border-color:var(--gold);background:rgba(247,169,79,.05)}
.exp-btn.blue:hover{border-color:var(--blue);background:rgba(88,166,255,.05)}
.exp-btn.green:hover{border-color:var(--green);background:rgba(62,207,142,.05)}
.exp-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.exp-label{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px}
.exp-desc{font-size:11px;color:var(--muted);line-height:1.4}

/* ── Compare ── */
.compare-panel{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:16px;overflow-x:auto
}
.compare-panel-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.compare-table{width:100%;border-collapse:collapse;font-size:12px;min-width:400px}
.compare-table th{
  padding:8px 12px;font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;text-align:right;
  border-bottom:1px solid var(--border);background:var(--bg3)
}
.compare-table th.metric-col{text-align:left;min-width:120px}
.compare-table td{
  padding:8px 12px;border-bottom:1px solid var(--border2);text-align:right;
  font-weight:600;font-size:12px
}
.compare-table td.metric-col{text-align:left;font-weight:500;color:var(--muted)}
.compare-table tr:last-child td{border-bottom:none}
.compare-table tr:hover td{background:rgba(255,255,255,.02)}
.compare-best{color:var(--green)}
.compare-worst{color:var(--red)}

.ath-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:border-color .15s;cursor:default;position:relative
}
.ath-card.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(247,169,79,.3)}
.cmp-toggle{
  position:absolute;top:10px;right:10px;
  width:20px;height:20px;border-radius:5px;
  border:1.5px solid var(--border);background:var(--bg3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:10px;transition:all .12s;color:transparent;z-index:2
}
.cmp-toggle:hover{border-color:var(--gold);background:var(--gold-dim)}
.ath-card.selected .cmp-toggle{

let _ltCat=[],_ltAthList=[],_ltMetricList=[],_ltCatNames=[];
const _LT_PAL=['#58a6ff','#bc8cff','#3ecf8e','#f7a94f','#f85149','#56d4dd','#e879c9','#a3e635','#fbbf24','#f472b6'];
// 팀 뷰 선수 전용 고대비 팔레트(색상환 균등 분산 — 9명 구분 용이)
const _ATH_PAL=['#ff5d5d','#ff9e3d','#e6c229','#5ec16a','#2bd0c4','#4e9bff','#7c6bff','#c072f0','#ff6fb5'];
const _LT_MON=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

// ══ AUTH ══
function doLogin(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>showErr(e.message));}
function showErr(m){const el=document.getElementById('auth-err');el.textContent=m;el.style.display='block';}

  if(u){
    if(u.email!==ALLOWED){auth.signOut();showErr('Access denied: '+u.email);return;}

// ══ LISTENERS ══
function startListen(){
  unsubs.forEach(u=>u());unsubs=[];
  showTabLoading();
  unsubs.push(db.collection('trainlog').doc('coach').onSnapshot(snap=>{
    if(!snap.exists){renderCurrent();return;}
    const prev=coachData; coachData=snap.data();
    if(!condAth&&coachData.athletes?.length){condAth=coachData.athletes[0].name;soreAth=condAth;} // loadAth는 클릭 시에만
    const ids=(coachData.athletes||[]).map(a=>a.id).filter(Boolean);
    const prevIds=(prev?.athletes||[]).map(a=>a.id).filter(Boolean);
    if(JSON.stringify(ids)!==JSON.stringify(prevIds)){setupAthListeners(ids);setTimeout(renderCurrent,1500);}
    else renderCurrent();
  }));
}
function showTabLoading(){
  const w=document.getElementById('tab-'+curTab);

  if(!ids.length){renderCurrent();return;}

    athUnsubs.push(db.collection('trainlog').doc('athlete_'+id).onSnapshot(
      snap=>{const _d=snap.exists?snap.data():{};athLogs[id]=_d.logs||[];athNotes[id]=_d.exNotes||[];renderCurrent();},
      err=>{console.warn('[dash] snapshot err:',id,err);renderCurrent();}
    ));

}

// ══ HELPERS ══
function todayStr(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function p2(n){return String(n).padStart(2,'0');}
function dsFromDate(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function getLast(n){const a=[];for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);a.push(dsFromDate(d));}return a;}
function getWeekDates(off=0){
  const now=new Date(),dow=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1)+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return{ds:dsFromDate(d),d};});
}
function fmt(ds){if(!ds)return'—';const p=ds.split('-');return`${p[2]}.${p[1]}.`;}
function fmtFull(ds){if(!ds)return'—';const p=ds.split('-');return`${p[2]}.${p[1]}.${p[0]}`;}
function fmtShort(dt){return`${dt.toLocaleString('de',{month:'short'})} ${dt.getDate()}`;}
function getLogsByName(name){
  const ath=(coachData?.athletes||[]).find(a=>a.name===name);
  if(ath?.id&&athLogs[ath.id])return athLogs[ath.id];
  for(const[,logs]of Object.entries(athLogs)){if(logs.some(l=>l.athleteName===name))return logs;}
  return[];
}
function getAllLogs(){return Object.values(athLogs).flat();}
// ── Readiness (personal-baseline z-score vs. athlete's own last 21 condition logs) ──
// Mirrors the TrainLog app logic. Weights: fatigue30/sore30/sleepQ20/sleepH10/mood10.
function _soreSev(log){const s=log&&log.soreness;if(!s||!s.length)return 0;return Math.max(...s.map(x=>(+x.intensity||0)));}
function _condOn(logs,name,dt){const c=logs.filter(l=>l.type==='condition'&&l.athleteName===name&&l.date===dt);return c.length?c[c.length-1]:null;}
function _mean(a){return a.reduce((s,x)=>s+x,0)/a.length;}
function _sdv(a,m){if(a.length<2)return 0;return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));}
function _lightColor(l){return l==='g'?'#3ecf8e':l==='y'?'#f7a94f':'#e94560';}
function _readiness(allLogs,name,dt){
  const today=_condOn(allLogs,name,dt);
  if(!today)return{ok:false};
  const M=[
    {k:'fatigue',w:.30,bad:true,sdMin:1.0,get:l=>l.fatigue},
    {k:'sore',w:.30,bad:true,sdMin:1.5,get:l=>_soreSev(l)},
    {k:'sleepQuality',w:.20,bad:false,sdMin:1.0,get:l=>l.sleepQuality},
    {k:'sleepHours',w:.10,bad:false,sdMin:0.5,get:l=>l.sleepHours},
    {k:'mood',w:.10,bad:false,sdMin:1.0,get:l=>l.mood}
  ];
  const hist=allLogs.filter(l=>l.type==='condition'&&l.athleteName===name&&l.date<dt)
                    .sort((a,b)=>a.date.localeCompare(b.date)).slice(-21);
  const n=hist.length;
  let zsum=0,wsum=0,absSum=0,absW=0;
  M.forEach(m=>{
    const tv=m.get(today);if(tv==null||isNaN(tv))return;
    let abs;
    if(m.k==='fatigue')abs=(11-tv)/10*100;
    else if(m.k==='sore')abs=(10-Math.min(tv,10))/10*100;
    else if(m.k==='sleepQuality'||m.k==='mood')abs=tv/10*100;
    else abs=tv>=7?(tv>9.5?Math.max(60,100-(tv-9.5)*15):100):Math.max(0,tv/7*100);
    absSum+=abs*m.w;absW+=m.w;
    const vals=hist.map(m.get).filter(v=>v!=null&&!isNaN(v));
    if(vals.length>=4){
      const mn=_mean(vals),sd=Math.max(_sdv(vals,mn),m.sdMin);
      let z=(tv-mn)/sd;if(m.bad)z=-z;z=Math.max(-3,Math.min(3,z));
      zsum+=z*m.w;wsum+=m.w;
    }
  });
  const absScore=absW?Math.round(absSum/absW):50;
  if(n>=4&&wsum>0){
    const z=zsum/wsum;
    const score=Math.max(0,Math.min(100,Math.round(75+z*15)));
    const light=z>=-0.5?'g':z>=-1.5?'y':'r';
    return{ok:true,score,z,light,color:_lightColor(light),n,mode:'z'};
  }
  const light=absScore>=67?'g':absScore>=34?'y':'r';
  return{ok:true,score:absScore,z:null,light,color:_lightColor(light),n,mode:'abs'};
}
function vol(logs){
  return logs.filter(l=>l.type==='weight'||l.type==='plyo').reduce((s,log)=>s+(log.exercises||[]).reduce((ss,e)=>{
    if(e.isBodyweight)return ss;
    const slMult=(e.isSL||e.isSA)?2:1; // 앱 _exVolSplit과 동일: 한쪽 다리/팔 운동은 ×2
    if(e.setRows?.length)return ss+e.setRows.reduce((r,sr)=>r+(parseFloat(sr.kg)||0)*(parseFloat(sr.reps)||0)*slMult,0);
    return ss+(parseFloat(e.weight)||0)*(parseInt(e.sets)||0)*(parseInt(e.reps)||0)*slMult;
  },0),0);
}
function iCol(v,hg){
  if(v==null)return'var(--muted)';
  if(hg)return v>=7?'var(--green)':v>=4?'var(--gold)':'var(--red)';
  return v>=7?'var(--red)':v>=4?'var(--gold)':'var(--green)';
}
function tc(t){return{weight:'#f7a94f',sprint:'#3ecf8e',plyo:'#f7a94f',condition:'#bc8cff',tabata:'#f85149',mobility:'#E07B39'}[t]||'var(--muted)';}
function tcBg(t){return{weight:'rgba(247,169,79,.1)',sprint:'rgba(62,207,142,.1)',plyo:'rgba(247,169,79,.1)',tabata:'rgba(248,81,73,.1)',mobility:'rgba(224,123,57,.1)'}[t]||'rgba(255,255,255,.04)';}
function condVal(l){const e=l.exercises||[];const dv=e.map(x=>_dEffNum(x.difficulty)).filter(v=>v!=null);const a=dv.length?(dv.reduce((s,v)=>s+v,0)/dv.length):null;return `${e.filter(x=>x.done).length}/${e.length} ✓${a!=null?' · Ø D'+a.toFixed(1):''}`;}
function condBrief(l){return (l.exercises||[]).slice(0,4).map(e=>{const d=_dEffNum(e.difficulty);return `${e.done?'✓':'○'} ${e.name}${d!=null?' <b style="color:#E07B39">D'+d+'</b>':''}`;}).join(' · ');}
// Matches the app's _planGrpData resolution: individual athlete key → group → all (legacy .groups last)
function planGrp(plan,ath){if(!plan)return null;return plan['ath_'+ath.id]||plan[ath.group]||plan['all']||plan.groups?.[ath.group]||null;}
function sessExs(gd,s){if(!gd)return[];if(gd[s]?.exercises)return gd[s].exercises;if(s==='am'&&gd.exercises)return gd.exercises;return[];}
function killChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

// ══ WEEK NAV ══
function shiftWeek(delta,reset=false){
  if(reset)weekOffset=0;else weekOffset+=delta;
  updateWeekLabel();renderCurrent();

function updateWeekLabel(){
  const wk=getWeekDates(weekOffset);

function _esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// 웨이트 볼륨 정확 표기 (톤 환산 없이 kg 전체, 독일식 천단위 4.867kg)
function _fmtKg(v){ if(v==null||v==='')return '—'; const n=Math.round((+v)*1000)/1000; return n.toLocaleString('de-DE',{maximumFractionDigits:3})+'kg'; }
// 추이 차트용 외부(HTML) 툴팁 — 캔버스 밖으로 안 잘리고 길어지면 스크롤
function _ltExtTip(context){

  if(!tt||tt.opacity===0){el.style.opacity='0';return;}
  const title=(tt.title||[]).join(' ');
  let body=[]; (tt.body||[]).forEach(b=>{body=body.concat(b.lines||[]);});
  const esc=s=>(s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const _fmtLine=l=>{
    const s=l+'';
    const m=s.match(/^(.*?)(?:\s*·\s*)(RPE\s*\d+(?:\.\d+)?)\s*$/);
    if(m){const _rn=parseFloat((m[2].match(/[\d.]+/)||[])[0]);const _rc=_dEffCol(_rn)||'#e6edf3';return `<div style="display:flex;justify-content:space-between;gap:14px"><span style="white-space:pre-wrap;min-width:0">${esc(m[1])}</span><span style="flex-shrink:0;color:${_rc};font-weight:700">${esc(m[2])}</span></div>`;}
    return `<div style="white-space:pre-wrap">${esc(s)}</div>`;
  };
  el.innerHTML=`<div style="font-weight:700;margin-bottom:5px">${esc(title)}</div>`+body.map(_fmtLine).join('');
  const r=chart.canvas.getBoundingClientRect();
  const tw=el.offsetWidth||320, th=el.offsetHeight||40;
  let x=r.left+tt.caretX+14, y=r.top+tt.caretY-th/2;
  if(x+tw>window.innerWidth-8) x=r.left+tt.caretX-tw-14;
  if(x<8)x=8;
  if(y+th>window.innerHeight-8) y=window.innerHeight-th-8;
  if(y<8)y=8;
  el.style.left=x+'px'; el.style.top=y+'px'; el.style.opacity='1';
}
// 공통 선수 셀렉터 (전체 / 그룹 / 이름 칩) — 모든 탭 공유, 같은 칩 재클릭 시 전체로 해제
let selTouched=false; // Load 탭: 셀렉터를 한 번이라도 누르기 전엔 빈 화면
function setScope(v){

function _scopeBar(){

// Effort 정규화 (0-10 숫자 / 기존 Low·Medium·High 문자 호환)
function _dEffNum(e){ if(e==null||e==='')return null; if(typeof e==='number')return e; const s=String(e).toLowerCase(); if(s==='low')return 3; if(s==='medium')return 6; if(s==='high')return 8; const n=parseFloat(e); return isNaN(n)?null:n; }
function _dEffCol(n){ return n==null?null:(n<=4?'#3ecf8e':n<=7?'#f7a94f':'#e94560'); }
// Effort 점 (낮음=초록, 중간=주황, 높음=빨강) — 운동 이름 앞
function _effDot(eff){
  const n=_dEffNum(eff), c=_dEffCol(n);
  if(!c) return '';
  return `<span title="Effort: ${n}/10" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${c};margin-right:5px;vertical-align:middle"></span>`;
}
function _ovEx(l){
  let lines=[];
  if(l.type==='weight'){
    (l.exercises||[]).forEach(e=>{
      if(!e||!e.name) return;
      const maxKg=e.setRows&&e.setRows.length?Math.max(...e.setRows.map(sr=>parseFloat(sr.kg)||0)):(parseFloat(e.weight)||0);
      const sets=(e.setRows&&e.setRows.length)||e.sets||0;
      const reps=(e.setRows&&e.setRows[0]&&e.setRows[0].reps)||e.reps||0;
      const sl=e.isSL?'SL ':e.isSA?'SA ':'';
      const kg=maxKg>0?' '+maxKg+'kg':'';
      const sr=(sets&&reps)?' '+sets+'x'+reps:'';
      const slMult=(e.isSL||e.isSA)?2:1;
      let exVol=0;
      if(!e.isBodyweight){
        if(e.setRows?.length) exVol=e.setRows.reduce((r,x)=>r+(parseFloat(x.kg)||0)*(parseFloat(x.reps)||0)*slMult,0);
        else exVol=(parseFloat(e.weight)||0)*(parseInt(e.sets)||0)*(parseInt(e.reps)||0)*slMult;
      }
      const en=_dEffNum(e.effort);
      const t=sl+e.name+kg+sr+(e.isBodyweight?' (BW)':'')+(exVol>0?' · '+_fmtKg(exVol):'')+(en!=null?' · E'+en:'');
      const sub=(e.setRows&&e.setRows.length)
        ? [e.setRows.map((x,i)=>'S'+(i+1)+' '+(x.kg?x.kg+'kg':(x.extraKg?'BW+'+x.extraKg+'kg':'BW'))+'×'+(x.reps||'—')).join(' · ')]
        : [];
      lines.push({t, eff:e.effort||'', sub});
    });
  } else if(l.type==='sprint'){
    (l.sets||[]).forEach(s=>{
      if(!s||(!s.distance&&!s.name)) return;
      const reps=s.reps||s.sets||1;
      const inten=s.intensity?' @'+s.intensity+'%':'';
      const t=s.actualTime?' ('+s.actualTime+'s)':'';
      const en=_dEffNum(s.effort);
      const splits=(s.repTimes||[]).map(x=>{const tv=parseFloat(x);return(x==null||isNaN(tv))?null:tv.toFixed(2);}).filter(Boolean);
      lines.push({t:(s.distance||'?')+'m x'+reps+inten+t+(en!=null?' · E'+en:''), eff:s.effort||'',
        sub:splits.length?[splits.join(' · ')+' s']:[]});
    });
  } else if(l.type==='plyo'){
    lines.push({t:(l.totalReps||0)+' reps', eff:''});
  } else if(l.type==='tabata'){
    lines.push({t:'8 rounds 20s/10s', eff:''});
  } else if(l.type==='mobility'){
    (l.exercises||[]).forEach(e=>{
      if(!e||!e.name) return;
      const dv=_dEffNum(e.difficulty);
      lines.push({t:(e.done?'✓ ':'○ ')+e.name+(dv!=null?' · D'+dv:''), eff:dv!=null?dv:''});
    });
  }
  return lines;
}
function _ovBlock(l,athId){
  const c=tc(l.type), bg=tcBg(l.type);
  const typeLabel=l.type==='weight'?'Weight':l.type==='sprint'?'Sprint':l.type==='plyo'?'Plyo':l.type==='tabata'?'Tabata':l.type==='mobility'?'Conditioning':l.type;

    <div class="session-type" style="color:${c}">${typeLabel}${caret}${editBtn}</div>

// ── Weekly breakdown: body region & sprint type (주간 세부 분해) ──
const REGION_ORDER=['Anterior Lower','Posterior Lower','Anterior Upper','Posterior Upper','Core','Power','Other'];
const REGION_COLOR={'Anterior Lower':'#f7a94f','Posterior Lower':'#d85a30','Anterior Upper':'#4f8ef7','Posterior Upper':'#22d3ee',Core:'#a78bfa',Power:'#e2b714','Other':'#6b7280'};
const SPRINT_COLOR={'Acceleration':'#3ecf8e','Maximum Velocity':'#22d3ee','Speed Endurance':'#4f8ef7','Special Endurance 1':'#a78bfa','Special Endurance 2':'#7c5cd6','Resistance Sprinting':'#f7a94f','Sprint':'#6b7280'};
function _exVolOne(e){
  if(e.isBodyweight)return 0;
  const slMult=(e.isSL||e.isSA)?2:1; // vol()·앱 _exVolSplit과 동일: 한쪽 다리/팔 ×2
  if(e.setRows&&e.setRows.length)return e.setRows.reduce((s,r)=>s+(parseFloat(r.kg)||0)*(parseFloat(r.reps)||0),0)*slMult;
  return (parseFloat(e.weight)||0)*(parseInt(e.sets)||0)*(parseInt(e.reps)||0)*slMult;
}
function _regionOf(e){
  if(e.trainingType==='Power Development')return 'Power';
  return _chainOf(e); // Anterior/Posterior × Upper/Lower + Core (앱과 동일한 체인 분류)
}
function _weekBreakdown(aths,wkSet){
  // returns {region, sprint, sprintTypes, detail:{ath:{region:{exName:kg}}}, sdetail:{ath:{type:{distLabel:m}}}}
  const region={},sprint={},detail={},sdetail={},dmeta={},smeta={};const sprintTypes=new Set();
  aths.forEach(a=>{
    region[a.name]={};sprint[a.name]={};detail[a.name]={};sdetail[a.name]={};dmeta[a.name]={};smeta[a.name]={};
    getLogsByName(a.name).filter(l=>wkSet.has(l.date)).forEach(l=>{
      if(l.type==='weight'||l.type==='plyo'){
        (l.exercises||[]).forEach(e=>{
          const v=_exVolOne(e);if(v<=0)return;
          const r=_regionOf(e);
          region[a.name][r]=(region[a.name][r]||0)+v;
          const dm=detail[a.name][r]||(detail[a.name][r]={});
          const nm=(e.isSL?'SL ':e.isSA?'SA ':'')+(e.name||'?');
          dm[nm]=(dm[nm]||0)+v;
          // 호버 상세용 메타: 세트 스펙 + 세션 RPE
          const mm=dmeta[a.name][r]||(dmeta[a.name][r]={});
          const mo=mm[nm]||(mm[nm]={specs:[],rpes:[]});
          let spec='';
          if(e.setRows&&e.setRows.length){
            const kgs=e.setRows.map(sr=>parseFloat(e.isBodyweight?sr.extraKg:sr.kg)||0);
            const top=Math.max(...kgs);
            const reps=e.setRows[0]&&e.setRows[0].reps?e.setRows[0].reps:(e.reps||'?');
            spec=(top>0?top+'kg ':'')+e.setRows.length+'×'+reps;
          }else{
            const kg=parseFloat(e.isBodyweight?e.extraKg:e.weight)||0;
            spec=(kg>0?kg+'kg ':'')+(e.sets||'?')+'×'+(e.reps||'?');
          }
          if(spec&&!mo.specs.includes(spec))mo.specs.push(spec);
          if(l.rpe!=null&&l.rpe!==''&&!mo.rpes.includes(l.rpe))mo.rpes.push(l.rpe);
        });
      } else if(l.type==='sprint'){
        (l.sets||[]).forEach(s=>{
          const m=(parseFloat(s.distance)||0)*(parseInt(s.sets)||1)*(parseInt(s.reps)||1);
          if(m<=0)return;
          const t=s.subCategory||'Sprint';
          sprintTypes.add(t);
          sprint[a.name][t]=(sprint[a.name][t]||0)+m;
          const sm=sdetail[a.name][t]||(sdetail[a.name][t]={});
          const _r=parseInt(s.reps)||parseInt(s.sets)||1;
          const dl=`${_r}×${parseFloat(s.distance)||0}m${s.intensity?' @ '+s.intensity+'%':''}`;
          sm[dl]=(sm[dl]||0)+m;
          const so=smeta[a.name][t]||(smeta[a.name][t]={});
          const mo=so[dl]||(so[dl]={rpes:[]});
          if(l.rpe!=null&&l.rpe!==''&&!mo.rpes.includes(l.rpe))mo.rpes.push(l.rpe);
        });
      }
    });
  });
  return {region,sprint,sprintTypes:[...sprintTypes],detail,sdetail,dmeta,smeta};
}

// ── Exercise progression series (주요 운동 성장 추이) ──
function _exProgression(logs){
  const byEx={};
  logs.filter(l=>l.type==='weight'||l.type==='plyo').forEach(l=>{
    (l.exercises||[]).forEach(e=>{
      if(!e.name)return;
      let top=0;
      if(e.setRows&&e.setRows.length)e.setRows.forEach(r=>{const kg=e.isBodyweight?(parseFloat(r.extraKg)||0):(parseFloat(r.kg)||0);if(kg>top)top=kg;});
      else top=e.isBodyweight?(parseFloat(e.extraKg)||0):(parseFloat(e.weight)||0);
      if(top<=0)return;
      (byEx[e.name]=byEx[e.name]||[]).push({date:l.date,top});
    });
  });
  const out=[];
  Object.entries(byEx).forEach(([name,pts])=>{
    const byDate={};pts.forEach(p=>{if(!byDate[p.date]||p.top>byDate[p.date])byDate[p.date]=p.top;});
    const series=Object.entries(byDate).map(([d,v])=>({d,v})).sort((a,b)=>a.d.localeCompare(b.d));
    if(series.length>=2)out.push({name,series,n:series.length});
  });
  out.sort((a,b)=>b.n-a.n);
  return out.slice(0,6);
}
function _sprintProgression(logs){
  const byDist={};
  logs.filter(l=>l.type==='sprint').forEach(l=>{
    (l.sets||[]).forEach(s=>{
      const dist=parseFloat(s.distance);if(!dist)return;
      let best=parseFloat(s.actualTime)||null;
      (s.repTimes||[]).forEach(t=>{if(t!=null&&(best==null||t<best))best=t;});
      if(best==null)return;
      const key=dist+'m Sprint';
      byDist[key]=byDist[key]||{};
      if(!byDist[key][l.date]||best<byDist[key][l.date])byDist[key][l.date]=best;
    });
  });
  const out=[];
  Object.entries(byDist).forEach(([name,byDate])=>{
    const series=Object.entries(byDate).map(([d,v])=>({d,v})).sort((a,b)=>a.d.localeCompare(b.d));
    if(series.length>=2)out.push({name,series,n:series.length,sprint:true});
  });
  out.sort((a,b)=>b.n-a.n);
  return out.slice(0,3);
}

// alpha='' → 라인(불투명), alpha='2b' → 선 아래 채움(~17%).
function _mesoFillGrad(mcols,base,alpha){
  const a=(alpha==null?'2b':alpha);
  const colOf=i=>((mcols[i]||base)+a);
  return function(c){
    const ch=c.chart,area=ch.chartArea;const N=mcols.length;
    if(!area||!N)return colOf(0);
    const g=ch.ctx.createLinearGradient(area.left,0,area.right,0);
    const clamp=t=>t<0?0:t>1?1:t;
    if(N===1){g.addColorStop(0,colOf(0));g.addColorStop(1,colOf(0));return g;}
    g.addColorStop(0,colOf(0));
    for(let k=1;k<N;k++){if((mcols[k]||base)!==(mcols[k-1]||base)){const t=clamp((k-0.5)/(N-1));g.addColorStop(t,colOf(k-1));g.addColorStop(t,colOf(k));}}
    g.addColorStop(1,colOf(N-1));
    return g;
  };
}

      if(typeof _PDZ!=='undefined'){_PDZ.forEach(([code,d1])=>{const b='Mesocycle '+code.split('-')[0];const dt=new Date(d1+'T00:00:00');for(let k=0;k<7;k++){const ds=dt.toISOString().slice(0,10);pm[ds]=b;dt.setDate(dt.getDate()+1);}});}
      let last=null; const ph=dates.map(d=>{ if(pm[d])last=pm[d]; return last; });
      const first=ph.find(x=>x); for(let k=0;k<ph.length&&!ph[k];k++)ph[k]=first;

        const colOf=p=>{const num=parseInt((String(p).match(/\d+/)||[0])[0],10); return num>0?_mesoColor(p):_MESO_PAL[uniq.indexOf(p)%_MESO_PAL.length];};
        let i2=0;

            if(xE-xS>72){ ctx.fillStyle=c; ctx.font='700 9px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillText(p,(xS+xE)/2,area.bottom-4); ctx.textBaseline='top'; }
          }

      const xStart=i===0?area.left:(xs.getPixelForValue(i-1)+xs.getPixelForValue(i))/2;

        }

      }

    }

  }
};

// 연속(일자별) 분해 막대차트 상단에 메소사이클 그룹 라벨 + 경계선(클릭은 차트 onClick에서 처리)
function _mkMesoLabels(dates){
  const _spans=chart=>{const xs=chart.scales.x,area=chart.chartArea,n=dates.length,names=_mesoNamesFor(dates),out=[];let i=0;
    while(i<n){const p=names[i];let j=i;while(j<n&&names[j]===p)j++;
      const xS=i===0?area.left:(xs.getPixelForValue(i-1)+xs.getPixelForValue(i))/2;
      const xE=j>=n?area.right:(xs.getPixelForValue(j-1)+xs.getPixelForValue(j))/2;
      out.push({p,i,xS,xE});i=j;}
    return out;};

    // 배경 음영(메소별 옅은 풀하이트 틴트 ~9%) — 막대 뒤에 그림
    beforeDatasetsDraw(chart){
      const xs=chart.scales.x;if(!xs||!dates||!dates.length)return;
      const area=chart.chartArea,ctx=chart.ctx;ctx.save();
      _spans(chart).forEach(({p,xS,xE})=>{if(!p)return;ctx.fillStyle=_mesoColor(p)+'17';ctx.fillRect(xS,area.top,xE-xS,area.bottom-area.top);});
      ctx.restore();
    },
    // 경계선 + 상단 라벨 — 막대 위에 그림
    afterDatasetsDraw(chart){

      const area=chart.chartArea,ctx=chart.ctx;ctx.save();
      _spans(chart).forEach(({p,i,xS,xE})=>{if(!p)return;const col=_mesoColor(p);
        if(i>0){ctx.strokeStyle=col+'80';ctx.setLineDash([4,3]);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(xS,area.top);ctx.lineTo(xS,area.bottom);ctx.stroke();ctx.setLineDash([]);}
      });
      ctx.restore();
    }};
}
// ── 주기화 주차 목록: PDF 주기화(시즌 전체) + sessionPlans 메타 병합 → [{label,d1,d2}] ──
function _planWeeks(){
  const map={};
  Object.entries((coachData&&coachData.sessionPlans)||{}).forEach(([d,p])=>{
    if(!p||!p.week)return;
    const m=String(p.week).match(/(\d{2})\.(\d{2})\.(\d{2})\s*~\s*(\d{2})\.(\d{2})\.(\d{2})/);
    if(!m)return;
    const d1='20'+m[1]+'-'+m[2]+'-'+m[3], d2='20'+m[4]+'-'+m[5]+'-'+m[6];
    if(!map[d1])map[d1]={d1,d2,phase:String(p.phase||'').trim()};
    else if(!map[d1].phase&&p.phase)map[d1].phase=String(p.phase).trim();
  });
  _PDZ.forEach(([code,d1])=>{
    const dt=new Date(d1+'T00:00:00'); dt.setDate(dt.getDate()+6);
    const d2=dt.toISOString().slice(0,10);
    map[d1]=Object.assign(map[d1]||{d1,d2},{code,d2:map[d1]?.d2||d2});
  });
  const wks=Object.values(map).sort((a,b)=>a.d1.localeCompare(b.d1));
  const cnt={};
  wks.forEach(w=>{
    const rng='('+w.d1.slice(5).replace('-','.')+'~'+w.d2.slice(5).replace('-','.')+')';
    if(w.code){ w.label=w.code+' '+rng; }
    else { const ph=w.phase||'—'; cnt[ph]=(cnt[ph]||0)+1; w.label=(w.phase?w.phase+' · W'+cnt[ph]:'W?')+' '+rng; }
  });
  return wks;
}
function _planWeekOpts(){
  const wks=_planWeeks().filter(w=>w.code); // _PDZ 주기화 코드(1-1~)가 있는 주만 — 계획 외 pre-season 주 제외
  let html='<option value="">Mesocycle</option>';
  let cur=null;
  wks.forEach(w=>{
    const num=w.code.split('-')[0];
    if(num!==cur){
      cur=num;
      const all=wks.filter(x=>x.code.split('-')[0]===num);
      const allOn=all.length&&all.every(x=>ltWeeks.includes(x.d1+'|'+x.d2));
      html+=`<option value="meso:${num}" ${allOn?'disabled':''}>▸ Mesocycle ${num} (전체)${allOn?' ✓':''}</option>`;
    }
    const on=ltWeeks.includes(w.d1+'|'+w.d2);
    html+=`<option value='${w.d1}|${w.d2}' ${on?'disabled':''}>&nbsp;&nbsp;&nbsp;${w.label}${on?' ✓':''}</option>`;
  });
  return html;
}

function _ltBuild(logs,ath){
  const exMap={},volByDate={},distByDate={},volDetail={},distDetail={},distRpe={},volBreak={sub:{},region:{},type:{},ex:{sub:{},region:{},type:{}}},distBreak={sub:{},disc:{},ex:{sub:{},disc:{}}};
  // pass 1: 세션 총량 + 날짜별 구성 상세(전 종목·BW 포함, 여러 세션 합산)
  (logs||[]).forEach(l=>{
    if(l.type==='weight'||l.type==='plyo'){
      const vv=vol([l]);if(vv>0)volByDate[l.date]=(volByDate[l.date]||0)+vv;
      (l.exercises||[]).forEach(e=>{
        if(!e.name)return;
        const isBW=!!e.isBodyweight;
        const sets=(e.setRows&&e.setRows.length)||parseInt(e.sets)||0;
        const reps=(e.setRows&&e.setRows[0]&&e.setRows[0].reps)||e.reps||0;
        const sl=e.isSL?'SL ':e.isSA?'SA ':'';
        const slM=(e.isSL||e.isSA)?2:1;
        let exVol=0, setLines=[];
        if(e.setRows&&e.setRows.length){
          setLines=e.setRows.map(r=>{const rp=parseFloat(r.reps)||0,ex=parseFloat(r.extraKg)||0,kg=parseFloat(r.kg)||0;if(isBW){const vv2=ex*rp*slM;exVol+=vv2;return ex?`${rp} reps +${ex}kg = ${_fmtKg(vv2)}`:`${rp} reps (BW)`;}const vv2=kg*rp*slM;exVol+=vv2;return `${kg}kg × ${rp} = ${_fmtKg(vv2)}`;});
        } else { exVol=_exVolOne(e); setLines=[isBW?`${sets}×${reps} (BW)`:`${sets}×${reps} @ ${(parseFloat(e.weight)||0)}kg`]; }
        const vk=sl+e.name+(isBW?' (BW)':'');
        const vd=volDetail[l.date]||(volDetail[l.date]={});
        const vo=vd[vk]||(vd[vk]={vol:0,sets:0,reps:reps,lines:[],bw:isBW,eff:null});
        vo.vol+=exVol;vo.sets=sets;vo.reps=reps;vo.lines=vo.lines.concat(setLines);
        vo.reg=e.trainingType==='Power Development'?'Power':(_volRegionOf(_catOf(e))==='Other'?'기타':_volRegionOf(_catOf(e)));
        {const _ef=_dEffNum(e.effort); if(_ef!=null)vo.eff=_ef;}
        // 분해 누적(카테고리/상하체/타입)
        if(exVol>0){
          const _cSub=_catOf(e), _cType=e.trainingType||'Other', _cReg=_chainOf(e);
          (volBreak.sub[l.date]=volBreak.sub[l.date]||{})[_cSub]=(volBreak.sub[l.date][_cSub]||0)+exVol;
          (volBreak.region[l.date]=volBreak.region[l.date]||{})[_cReg]=(volBreak.region[l.date][_cReg]||0)+exVol;
          (volBreak.type[l.date]=volBreak.type[l.date]||{})[_cType]=(volBreak.type[l.date][_cType]||0)+exVol;
          // 카테고리별 운동 상세(볼륨+RPE) — 툴팁 세부 표시용
          const _exLbl=sl+e.name, _exEf=_dEffNum(e.effort);
          [['sub',_cSub],['region',_cReg],['type',_cType]].forEach(gc=>{
            const _D=(volBreak.ex[gc[0]][l.date]=volBreak.ex[gc[0]][l.date]||{});
            const _C=(_D[gc[1]]=_D[gc[1]]||{});
            const _E=(_C[_exLbl]=_C[_exLbl]||{vol:0,eff:null});
            _E.vol+=exVol; if(_exEf!=null)_E.eff=_exEf;
          });
        }
      });
    }
    else if(l.type==='sprint'){
      if(l.totalDistance)distByDate[l.date]=(distByDate[l.date]||0)+(parseFloat(l.totalDistance)||0);
      (l.sets||[]).forEach(s=>{const dist=parseFloat(s.distance);if(!dist)return;const r=parseInt(s.reps)||parseInt(s.sets)||1;const m=dist*(parseInt(s.sets)||1)*(parseInt(s.reps)||1);if(m<=0)return;const dl=_LT_DISC[_ltDisc(s)]||'Flat';const sk=`${r}×${dist}m ${dl}${s.intensity?' @ '+s.intensity+'%':''}`;const sd=distDetail[l.date]||(distDetail[l.date]={});const _dprev=sd[sk]||{dist:0,eff:null};sd[sk]={dist:_dprev.dist+m,eff:_dEffNum(s.effort)!=null?_dEffNum(s.effort):_dprev.eff};if(l.rpe!=null)distRpe[l.date]=l.rpe;
        // 거리 분해 누적: sub=Quality(목적), disc=Method(방법) — 세부 모달리티는 툴팁에서
        const _dSub=_sprintQualOf(s), _dMethod=_sprintMethodOf(s);
        (distBreak.sub[l.date]=distBreak.sub[l.date]||{})[_dSub]=(distBreak.sub[l.date][_dSub]||0)+m;
        (distBreak.disc[l.date]=distBreak.disc[l.date]||{})[_dMethod]=(distBreak.disc[l.date][_dMethod]||0)+m;
        // 세트 상세(거리·RPE·랩타임) — 툴팁용
        const _sSplits=[];(s.repTimes||[]).forEach(t=>{const tv=parseFloat(t);if(t==null||isNaN(tv))return;_sSplits.push(dist+'m → '+tv.toFixed(2)+'s · '+(dist/tv).toFixed(2)+' m/s');});
        const _sEff=_dEffNum(s.effort), _sLbl=(s.name&&s.name.trim())||`${dist}m ${dl}`;
        [['sub',_dSub],['disc',_dMethod]].forEach(gc=>{
          const _D=(distBreak.ex[gc[0]][l.date]=distBreak.ex[gc[0]][l.date]||{});
          const _C=(_D[gc[1]]=_D[gc[1]]||{});
          const _E=(_C[_sLbl]=_C[_sLbl]||{dist:0,eff:null,splits:[]});
          _E.dist+=m; if(_sEff!=null)_E.eff=_sEff; _E.splits=_E.splits.concat(_sSplits);
        });});
    }
  });
  // pass 2: 종목별 포인트 + 메타 (그 운동 로그 정보만: 세션 볼륨/거리 · 기록 · Effort)
  (logs||[]).forEach(l=>{
    if(l.type==='weight'||l.type==='plyo'){
      (l.exercises||[]).forEach(e=>{
        if(!e.name||e.isBodyweight)return;
        const top=e.setRows&&e.setRows.length?Math.max(...e.setRows.map(r=>parseFloat(r.kg)||0)):(parseFloat(e.weight)||0);
        if(top<=0)return;
        const sets=(e.setRows&&e.setRows.length)||parseInt(e.sets)||0;
        const reps=(e.setRows&&e.setRows[0]&&e.setRows[0].reps)||e.reps||0;
        const sl=e.isSL?'SL ':e.isSA?'SA ':'';
        const rec=`${sl}${sets}×${reps} @ ${top}kg`;
        const slM=(e.isSL||e.isSA)?2:1;
        let exVol=0;
        const setLines=(e.setRows&&e.setRows.length)
          ? e.setRows.map(r=>{const kg=parseFloat(r.kg)||0,rp=parseFloat(r.reps)||0,vv=kg*rp*slM;exVol+=vv;return `${kg}kg × ${rp} = ${_fmtKg(vv)}`;})
          : (()=>{exVol=_exVolOne(e);return [rec];})();
        const lines=[(sl?sl.trim()+' · ':'')+'총 부하: '+_fmtKg(exVol)+' · 최고 '+top+'kg'];
        setLines.forEach((s,i)=>lines.push((i+1)+'. '+s));
        {const _en=_dEffNum(e.effort); if(_en!=null)lines.push('종목 RPE: '+_en);}
        const m=exMap[e.name]||(exMap[e.name]={sprint:false,unit:'kg',cat:e.trainingType||'Other',sub:_catOf(e),pts:{}});
        if(!m.pts[l.date]||top>m.pts[l.date].v) m.pts[l.date]={v:top,meta:lines,short:rec};
      });
    } else if(l.type==='sprint'){
      (l.sets||[]).forEach(s=>{
        const dist=parseFloat(s.distance); if(!dist)return;
        let best=parseFloat(s.actualTime)||null;
        (s.repTimes||[]).forEach(t=>{if(t!=null&&(best==null||t<best))best=t;});
        if(best==null)return;
        const disc=_ltDisc(s), dlabel=_LT_DISC[disc]||'Flat';
        const key=_ltSprintKey(dist,disc), reps=s.reps||s.sets||1, inten=s.intensity?` @ ${s.intensity}%`:'';
        const rec=`${reps}×${dist}m ${dlabel}${inten} · best ${best}s`;
        const _totM=dist*(parseInt(s.sets)||1)*(parseInt(s.reps)||1);
        const lines=[rec, '총 거리: '+Math.round(_totM)+'m'];
        const _laps=(s.repTimes||[]);
        if(_laps.some(t=>t!=null&&!isNaN(parseFloat(t)))){
          let _n=0; _laps.forEach(t=>{const tv=parseFloat(t); if(t==null||isNaN(tv))return; _n++; lines.push(_n+'. '+dist+'m → '+tv.toFixed(2)+'s · '+(dist/tv).toFixed(2)+' m/s');});
        }
        {const _en=_dEffNum(s.effort); if(_en!=null)lines.push('종목 RPE: '+_en);}
        const m=exMap[key]||(exMap[key]={sprint:true,unit:'s',cat:'Sprint Training',sub:dlabel,pts:{}});
        if(!m.pts[l.date]||best<m.pts[l.date].v) m.pts[l.date]={v:best,meta:lines,short:rec};
      });
    }
  });
  return {exMap,volByDate,distByDate,volDetail,distDetail,distRpe,volBreak,distBreak};
}

      const arr=Object.entries(dd).sort((x,y)=>y[1]-x[1]).map(([n,v])=>{
        const mo=mm[n]||{};
        const spec=(mo.specs&&mo.specs.length)?' · '+mo.specs.join(', '):'';
        const rpe=(mo.rpes&&mo.rpes.length)?' · RPE '+mo.rpes.join('/'):'';
        return `${n}: ${unit==='kg'?_fmtKg(v):Math.round(v)+'m'}${spec}${rpe}`;
      });
      return arr.length?arr:['기록 없음'];
    };
    // 다중 비교(세로 그룹): 막대 호버 → 그 선수·카테고리 구성 상세
    const _grpOpts=(unit,athArr,keys,detailMap)=>({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'top',labels:{color:'rgba(230,237,243,.6)',font:{size:10},boxWidth:10,padding:8}},tooltip:{enabled:false,external:_ltExtTip,callbacks:{
      title:items=>{const it=items[0];const nm=athArr[it.datasetIndex]?athArr[it.datasetIndex].name.split(' ')[0]:'';return nm+' · '+keys[it.dataIndex]+' · '+(unit==='kg'?_fmtKg(it.parsed.y):Math.round(it.parsed.y)+'m');},
      label:ctx=>_detLines(athArr[ctx.datasetIndex]?athArr[ctx.datasetIndex].name:'',keys[ctx.dataIndex],detailMap,unit)
    }}},scales:{x:{grid:{display:false},ticks:{color:'rgba(230,237,243,.7)',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(230,237,243,.3)',font:{size:9}},beginAtZero:true}}});
    // 그룹/전체(가로 누적): 세그먼트 호버 → 그 선수·카테고리 구성 상세
    const _stackOptsD=(unit,athArr,keys,detailMap)=>({indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,labels:{color:'rgba(230,237,243,.5)',font:{size:10},boxWidth:10}},tooltip:{enabled:false,external:_ltExtTip,callbacks:{
        title:items=>{const it=items[0];const nm=athArr[it.dataIndex]?athArr[it.dataIndex].name.split(' ')[0]:'';return nm+' · '+keys[it.datasetIndex]+' · '+(unit==='kg'?_fmtKg(it.parsed.x):Math.round(it.parsed.x)+'m');},
        label:ctx=>_detLines(athArr[ctx.dataIndex]?athArr[ctx.dataIndex].name:'',keys[ctx.datasetIndex],detailMap,unit)
      }}},
      scales:{x:{stacked:true,grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(230,237,243,.3)',font:{size:9}}},y:{stacked:true,grid:{display:false},ticks:{color:'rgba(230,237,243,.55)',font:{size:10}}}}});
    // 단일 선수: 막대에 마우스 올리면 그 카테고리 구성 운동을 툴팁에 표시
    const _detailTip=(a,keys,detailMap,unit)=>({responsive:true,maintainAspectRatio:false,layout:{padding:{top:18}},plugins:{legend:{display:false},tooltip:{enabled:false,external:_ltExtTip,callbacks:{
      title:items=>keys[items[0].dataIndex]+' · '+(unit==='kg'?_fmtKg(items[0].parsed.y):Math.round(items[0].parsed.y)+'m'),
      label:ctx=>_detLines(a.name,keys[ctx.dataIndex],detailMap,unit)
    }}},scales:{x:{grid:{display:false},ticks:{color:'rgba(230,237,243,.7)',font:{size:11}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(230,237,243,.3)',font:{size:9}},beginAtZero:true}}});
    const cReg=document.getElementById('ch-ld-reg');
    if(cReg&&_regAths.length){
      if(_bdOne){
        const a=_regAths[0], regs=REGION_ORDER.filter(r=>bd.region[a.name][r]);
        charts['ld-reg']=new Chart(cReg,{type:'bar',data:{labels:regs,datasets:[{data:regs.map(r=>Math.round(bd.region[a.name][r]||0)),backgroundColor:regs.map(r=>REGION_COLOR[r]+'cc'),borderRadius:3,maxBarThickness:64}]},options:_detailTip(a,regs,bd.detail,'kg'),plugins:[_valLabel('kg')]});
      } else if(_bdMulti){
        const regs=REGION_ORDER.filter(r=>_regAths.some(a=>bd.region[a.name][r]));
        charts['ld-reg']=new Chart(cReg,{type:'bar',data:{labels:regs,datasets:_regAths.map((a,i)=>({label:a.name.split(' ')[0],data:regs.map(r=>Math.round(bd.region[a.name][r]||0)),backgroundColor:_LT_PAL[i%_LT_PAL.length]+'cc',borderRadius:3}))},options:_grpOpts('kg',_regAths,regs,bd.detail)});
      } else {
        const regs=(loadRegSel?[loadRegSel]:REGION_ORDER).filter(r=>_regAths.some(a=>bd.region[a.name][r]));
        charts['ld-reg']=new Chart(cReg,{type:'bar',data:{
          labels:_regAths.map(a=>a.name.split(' ')[0]),
          datasets:regs.map(r=>({label:r,data:_regAths.map(a=>Math.round(bd.region[a.name][r]||0)),backgroundColor:REGION_COLOR[r]+'cc',borderRadius:2}))
        },options:_stackOptsD('kg',_regAths,regs,bd.detail)});
      }
    }
    const cSpr=document.getElementById('ch-ld-spr');
    if(cSpr&&_sprAths.length){
      if(_bdOne){
        const a=_sprAths[0], types=bd.sprintTypes.filter(t=>bd.sprint[a.name][t]);
        charts['ld-spr']=new Chart(cSpr,{type:'bar',data:{labels:types,datasets:[{data:types.map(t=>Math.round(bd.sprint[a.name][t]||0)),backgroundColor:types.map(t=>(SPRINT_COLOR[t]||'#6b7280')+'cc'),borderRadius:3,maxBarThickness:64}]},options:_detailTip(a,types,bd.sdetail,'m'),plugins:[_valLabel('m')]});
      } else if(_bdMulti){
        const types=bd.sprintTypes.filter(t=>_sprAths.some(a=>bd.sprint[a.name][t]));
        charts['ld-spr']=new Chart(cSpr,{type:'bar',data:{labels:types,datasets:_sprAths.map((a,i)=>({label:a.name.split(' ')[0],data:types.map(t=>Math.round(bd.sprint[a.name][t]||0)),backgroundColor:_LT_PAL[i%_LT_PAL.length]+'cc',borderRadius:3}))},options:_grpOpts('m',_sprAths,types,bd.sdetail)});
      } else {
        const types=loadSprSel?[loadSprSel]:bd.sprintTypes;
        charts['ld-spr']=new Chart(cSpr,{type:'bar',data:{
          labels:_sprAths.map(a=>a.name.split(' ')[0]),
          datasets:types.map(t=>({label:t,data:_sprAths.map(a=>Math.round(bd.sprint[a.name][t]||0)),backgroundColor:(SPRINT_COLOR[t]||'#6b7280')+'cc',borderRadius:2}))
        },options:_stackOptsD('m',_sprAths,types,bd.sdetail)});
      }
    }
  };

  // ── 2. Session Detail — 표에서 선수를 클릭했을 때만 표시 ──
  const selAth=loadAth?fAthletes.find(a=>a.name===loadAth)||athletes.find(a=>a.name===loadAth):null;
  if(!selAth){
    html+=`<div style="font-size:11px;color:var(--hint);padding:6px 2px">아래는 선택 선수 전체의 추이·카테고리 비교입니다 · 표에서 선수를 클릭하면 그 선수 주간 상세로 들어갑니다</div>`;
    // 팀 모드 Trends: 라인지표=선수별 겹쳐보기 · 카테고리 분해=팀 집계 스택
    const _teamLogs=[];fAthletes.forEach(a=>{const l=getLogsByName(a.name);if(l&&l.length)_teamLogs.push(...l);});
    const _trT=_renderTrends(fAthletes, null, _teamLogs, true);
    html+=_trT.html;
    wrap.innerHTML=html;
    ['ld-reg','ld-spr'].forEach(killChart);
    Object.keys(charts).filter(k=>k.startsWith('prog-')||k.startsWith('lt-')).forEach(killChart);
    setTimeout(()=>{ _ldMakeBreakdownCharts(); _trT.jobs.forEach(j=>{const c=document.getElementById(j.id);if(c){killChart(j.id);try{charts[j.id]=new Chart(c,j.cfg);}catch(e){console.warn('lt chart',j.id,e);}}}); },50);
    return;
  }
  const selLogs=getLogsByName(selAth.name);
  const grpColor=selAth.group==='A'?'#58a6ff':'#3ecf8e';

  html+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="width:32px;height:32px;border-radius:8px;background:${selAth.group==='A'?'rgba(88,166,255,.15)':'rgba(62,207,142,.15)'};color:${grpColor};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">${selAth.name[0]}</div>
      <div style="font-weight:700;font-size:14px">${selAth.name}</div>
  </div>`;

  // 7일 세션 카드
  html+=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;min-width:0">`;

  // 접힌 운동 목록 펼치기 헬퍼 — shown개까지 보이고 "+N more" 클릭 시 나머지 표시
  let _mwSeq=0;
  const _moreWrap=(rows,shown,moreLbl)=>{
    if(rows.length<=shown)return rows.join('');
    const mid='mw'+(_mwSeq++);
    const n=rows.length-shown;
    return rows.slice(0,shown).join('')
      +`<div id="${mid}" style="display:none">${rows.slice(shown).join('')}</div>`
      +`<div onclick="event.stopPropagation();var e=document.getElementById('${mid}');var o=e.style.display==='none';e.style.display=o?'block':'none';this.textContent=o?'− weniger':'+${n} ${moreLbl||'more'}';" style="font-size:9px;color:#8b949e;margin-top:3px;cursor:pointer;user-select:none;font-weight:700">+${n} ${moreLbl||'more'}</div>`;
  };

  const DNF=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  wk.forEach(({ds,d},i)=>{
    const isToday=ds===today;
    const trains=selLogs.filter(l=>l.date===ds&&l.type!=='condition');
    const _open=_ldWeekOpen;
    const _dd=_open?'block':'none';
    const chev=trains.length?`<span id="ldchev${i}" style="display:inline-block;font-size:8px;color:#8b949e;transition:transform .15s;${_open?'transform:rotate(90deg)':''}">▶</span>`:'';

    html+=`<div ${trains.length?`onclick="ldDayToggle()" title="클릭: 주 전체 펼치기/접기"`:''} style="background:var(--card);border:1px solid ${isToday?'rgba(88,166,255,.4)':'var(--border)'};border-radius:8px;padding:10px;${isToday?'background:rgba(88,166,255,.04);':''}${trains.length?'cursor:pointer':''}">
      <div style="font-size:10px;font-weight:700;color:#8b949e;display:flex;justify-content:space-between;align-items:center;gap:4px">
        <span style="display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${chev}${DNF[i]}</span>
        <span style="flex-shrink:0;color:${isToday?'var(--blue)':'#484f58'}">${d.getDate()}.${d.getMonth()+1}.${isToday?'<span style="margin-left:3px;font-size:8px;padding:1px 3px;border-radius:2px;background:rgba(88,166,255,.2);color:var(--blue)">TODAY</span>':''}</span>
      </div>`;

    if(!trains.length){
      html+=`<div style="font-size:10px;color:#484f58;padding:4px 0">Rest</div>`;
    }else{
      // 접힘 상태: 그날 세션 대주제만 한 줄로 (펼치면 숨김)
      const _seen=new Set(),_lbls=[];
      trains.forEach(l=>{
        const t=l.type==='mobility'?'Conditioning':l.type==='weight'?'Weight':l.type==='sprint'?'Sprint':l.type==='tabata'?'Tabata':l.type==='plyo'?'Plyo':l.type;
        if(!_seen.has(t)){_seen.add(t);_lbls.push(`<span style="color:${tc(l.type)}">${t}</span>`);}
      });
      html+=`<div class="lddc${i}" style="display:${_open?'none':'block'};font-size:10px;font-weight:600;padding:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85">${_lbls.join('<span style="color:#484f58"> · </span>')}</div>`;
    }

    html+=`<div class="ldd${i}" style="display:${_dd};margin-top:6px">`;
    trains.forEach(l=>{
      const c=tc(l.type);
      const bg=tcBg(l.type);

      if(l.type==='weight'){
        const exs=l.exercises||[];
        const nonBW=exs.filter(e=>!e.isBodyweight);
        const bwExs=exs.filter(e=>e.isBodyweight);
        html+=`<div style="margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
            <span style="font-size:10px;font-weight:600;color:${c};opacity:.85">Weight</span>
            <span style="font-size:11px;font-weight:700">${_fmtKg(vol([l]))}</span>
            ${l.rpe?`<span style="font-size:10px;color:#8b949e;margin-left:auto">RPE ${l.rpe}</span>`:''}
          </div>`;
        // Non-BW exercises
        const _wrows=nonBW.map(ex=>{
          const maxKg=ex.setRows?.length
            ?Math.max(...ex.setRows.map(sr=>parseFloat(sr.kg)||0))
            :(parseFloat(ex.weight)||0);
          const sets=ex.setRows?.length||ex.sets||0;
          const reps=ex.setRows?.[0]?.reps||ex.reps||0;
          const slLabel=ex.isSL?'SL ':ex.isSA?'SA ':'';
          const _efn=_dEffNum(ex.effort), _efc=_dEffCol(_efn);
          const effortDot=_efc
            ?`<span title="Effort: ${_efn}/10" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${_efc};flex-shrink:0"></span>`
            :'';
          const vbt=(ex.meanV?`<span style="font-size:9px;color:#bc8cff;margin-left:4px">v${parseFloat(ex.meanV).toFixed(2)}</span>`:'')
            +(ex.velLoss?`<span style="font-size:9px;color:#bc8cff;margin-left:2px">VL${parseFloat(ex.velLoss).toFixed(0)}%</span>`:'');
          return `<div data-ex="${_esc(ex.name||'')}" onclick="event.stopPropagation();ltAddEx(this.dataset.ex)" title="클릭: View this exercise trend" style="font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:4px;cursor:pointer">
            ${effortDot}<span style="color:#c9d1d9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${slLabel}${ex.name||'?'}</span>
            <span style="color:#8b949e;white-space:nowrap;flex-shrink:0;display:flex;align-items:center">${maxKg>0?maxKg+'kg':''} ${sets}×${reps}${vbt}</span>
          </div>`;
        });
        html+=_wrows.join('');
        // BW exercises (compact)
        if(bwExs.length){
          html+=`<div style="font-size:9px;color:#484f58;margin-top:3px">${bwExs.map(e=>e.name).filter(Boolean).slice(0,3).join(', ')}${bwExs.length>3?` +${bwExs.length-3}`:''} (BW)</div>`;
        }
        html+=`</div>`;

      } else if(l.type==='sprint'){
        const sets=l.sets||[];
        html+=`<div style="margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
            <span style="font-size:10px;font-weight:600;color:${c};opacity:.85">Sprint</span>
            <span style="font-size:11px;font-weight:700">${l.totalDistance||0} m</span>
            ${l.rpe?`<span style="font-size:10px;color:#8b949e;margin-left:auto">RPE ${l.rpe}</span>`:''}
          </div>`;
        const _srows=sets.map(s=>{
          const dist=s.distance||'?';
          const reps=s.reps||s.sets||1;
          const intensity=s.intensity?` @ ${s.intensity}%`:'';
          const rest=s.rest?` / ${s.rest}s rest`:'';
          const _dsc=_ltDisc(s);
          const _key=(parseFloat(dist))?_ltSprintKey(parseFloat(dist),_dsc):(dist+'m Sprint');
          const _dtag=_dsc!=='flat'?` <span style="color:#bc8cff">${_LT_DISC[_dsc]}</span>`:'';
          return `<div data-ex="${_key}" onclick="event.stopPropagation();ltAddEx(this.dataset.ex)" title="클릭: View this exercise trend" style="font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;cursor:pointer">
            <span style="color:#c9d1d9">${dist}m × ${reps}r${_dtag}</span>
            <span style="color:#8b949e">${intensity}${rest}</span>
          </div>`;
        });
        html+=_srows.join('');
        html+=`</div>`;

      } else if(l.type==='tabata'){
        html+=`<div style="margin-bottom:8px">
          <span style="font-size:10px;font-weight:600;color:${c};opacity:.85">Tabata</span>
          <div style="font-size:10px;color:#8b949e;margin-top:4px">8 rounds · 20s/10s${l.rpe?` · RPE ${l.rpe}`:''}</div>
        </div>`;
      } else if(l.type==='plyo'){
        html+=`<div style="margin-bottom:8px">
          <span style="font-size:10px;font-weight:600;color:${c};opacity:.85">Plyo</span>
          <div style="font-size:10px;color:#8b949e;margin-top:4px">${l.totalReps||0} reps${l.rpe?` · RPE ${l.rpe}`:''}</div>
        </div>`;
      } else if(l.type==='mobility'){
        const exs=l.exercises||[];
        const dvs=exs.map(e=>_dEffNum(e.difficulty)).filter(v=>v!=null);
        const avg=dvs.length?(dvs.reduce((s,v)=>s+v,0)/dvs.length):null;
        html+=`<div style="margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
            <span style="font-size:10px;font-weight:600;color:${c};opacity:.85">Conditioning</span>
            <span style="font-size:11px;font-weight:700">${exs.filter(e=>e.done).length}/${exs.length} ✓</span>
            ${avg!=null?`<span style="font-size:10px;color:#8b949e;margin-left:auto">Ø D${avg.toFixed(1)}</span>`:''}
          </div>`;
        const _mrows=exs.map(ex=>{
          const dv=_dEffNum(ex.difficulty);
          const dc=_dEffCol(dv);
          const dot=dc?`<span title="Schwierigkeit: ${dv}/10" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${dc};flex-shrink:0"></span>`:'';
          return `<div style="font-size:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:4px">
            ${dot}<span style="color:#c9d1d9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${ex.done?'':'○ '}${_esc(ex.name||'?')}</span>
            <span style="color:#8b949e;white-space:nowrap;flex-shrink:0">${dv!=null?'D'+dv:''}</span>
          </div>`;
        });
        html+=_mrows.join('');
        html+=`</div>`;
      }
    });
    html+=`</div>`;

    html+=`</div>`;
  });

  html+=`</div>`;

  // ── 3. 추이 분석 & 선수 비교 (Trends) ──
  const _tr=_renderTrends(fAthletes, selAth, selLogs);
  html+=_tr.html;

  wrap.innerHTML=html;

  ['ld-reg','ld-spr'].forEach(killChart);
  setTimeout(_ldMakeBreakdownCharts,50);

  Object.keys(charts).filter(k=>k.startsWith('prog-')||k.startsWith('lt-')).forEach(killChart);
  setTimeout(()=>{
    _tr.jobs.forEach(j=>{const c=document.getElementById(j.id);if(c){killChart(j.id);try{charts[j.id]=new Chart(c,j.cfg);}catch(e){console.warn('lt chart',j.id,e);}}});
  },50);
}

function _renderTrends(fAthletes, selAth, selLogs, teamMode){
  const athletes=coachData.athletes||[];
  let _ltJobs=[];
  const _lt=_ltBuild(selLogs,selAth);
  // 팀 모드: 선택된 선수 각각의 _ltBuild(개인 라인용) — 분해 스택은 합본 _lt(팀 집계) 재사용
  const _teamPer=teamMode?(fAthletes||[]).map((a,i)=>({name:a.name,col:_ATH_PAL[i%_ATH_PAL.length],lt:_ltBuild(getLogsByName(a.name),a)})):[];
  const _ltInPeriod=ds=>{
    if(ltPeriod==='all')return true;
    if(ltPeriod==='custom')return (!ltD1||ds>=ltD1)&&(!ltD2||ds<=ltD2);
    const days={'1d':1,'1w':7,'1m':30,'1y':365}[ltPeriod];
    if(days){const dt=new Date();dt.setDate(dt.getDate()-days+1);return ds>=dsFromDate(dt);}
    return true;
  };
  const _ltTip=(sprint,legend)=>({responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},
    plugins:{legend:{display:!!legend,labels:{color:'rgba(230,237,243,.55)',font:{size:10},boxWidth:10}},
      tooltip:{enabled:false,external:_ltExtTip,
        callbacks:{label:ctx=>{let m=ctx.dataset._metas&&ctx.dataset._metas[ctx.dataIndex];if(m==null||m==='')return ctx.formattedValue;if(Array.isArray(m))return (legend&&ctx.dataset.label)?[ctx.dataset.label].concat(m.map(x=>'  '+x)):m;return((legend&&ctx.dataset.label)?ctx.dataset.label+': ':'')+m;}}}},
    scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(230,237,243,.3)',font:{size:8},autoSkip:false,maxRotation:60,minRotation:45}},
