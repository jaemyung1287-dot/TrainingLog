<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrainLog · Coach Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root{
  --bg:#0d1117;
  --bg2:#161b22;
  --bg3:#1c2128;
  --card:#1c2128;
  --border:#30363d;
  --border2:#21262d;
  --text:#e6edf3;
  --text2:#c9d1d9;
  --muted:#8b949e;
  --hint:#484f58;
  --gold:#f7a94f;
  --gold-dim:rgba(247,169,79,.15);
  --green:#3ecf8e;
  --green-dim:rgba(62,207,142,.12);
  --red:#f85149;
  --red-dim:rgba(248,81,73,.12);
  --blue:#58a6ff;
  --blue-dim:rgba(88,166,255,.12);
  --purple:#bc8cff;
  --sidebar:220px;
  --radius:8px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.5}

/* ── Login ── */
#login-screen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;gap:16px;background:var(--bg);
}
.lg-logo{font-size:44px;filter:drop-shadow(0 4px 12px rgba(247,169,79,.3))}
.lg-title{font-size:22px;font-weight:700;letter-spacing:-.3px}
.lg-sub{font-size:12px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
#google-btn{
  display:flex;align-items:center;gap:10px;padding:11px 24px;
  border-radius:var(--radius);background:#fff;color:#24292f;font-size:13px;font-weight:600;
  border:none;cursor:pointer;margin-top:8px;transition:opacity .15s
}
#google-btn:hover{opacity:.92}
#google-btn img{width:18px}
#auth-err{color:var(--red);font-size:12px}

/* ── App shell ── */
#app{display:none;height:100vh;flex-direction:row}
#app.show{display:flex}

/* ── Sidebar ── */
#sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column
}
.sb-brand{
  padding:16px 16px 14px;
  border-bottom:1px solid var(--border2);
  display:flex;align-items:center;gap:10px
}
.sb-brand-icon{font-size:18px}
.sb-brand-name{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.sb-brand-sub{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:.2px;margin-top:1px}

nav{padding:8px 8px;flex:1;display:flex;flex-direction:column;gap:1px}
.nb{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:7px 10px;border-radius:6px;
  background:none;border:none;border-left:2px solid transparent;
  color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;
  text-align:left;transition:all .1s;font-family:inherit
}
.nb:hover{background:rgba(255,255,255,.05);color:var(--text2)}
.nb.on{
  background:rgba(247,169,79,.1);color:var(--gold);
  border-left-color:var(--gold);font-weight:600
}
.nb .ni{font-size:13px;width:16px;flex-shrink:0;opacity:.8}

.sb-section-label{
  font-size:10px;font-weight:600;color:var(--hint);
  text-transform:uppercase;letter-spacing:.8px;
  padding:10px 12px 4px
}

/* ── Sidebar bottom ── */
.sb-bottom{border-top:1px solid var(--border2)}
.week-nav{padding:10px 12px}
.week-nav-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.week-nav-row{display:flex;align-items:center;gap:4px}
.wn-btn{
  padding:4px 8px;border-radius:5px;
  background:var(--bg3);border:1px solid var(--border);
  color:var(--text2);font-size:13px;cursor:pointer;line-height:1;
  transition:background .1s
}
.wn-btn:hover{background:var(--border)}
.wn-dates{font-size:11px;font-weight:600;color:var(--text);text-align:center;flex:1}
.wn-today{
  width:100%;margin-top:5px;padding:4px;border-radius:5px;
  background:var(--blue-dim);border:1px solid rgba(88,166,255,.25);
  color:var(--blue);font-size:10px;font-weight:600;cursor:pointer;
  font-family:inherit;display:none;transition:background .1s
}
.wn-today:hover{background:rgba(88,166,255,.2)}

.sb-user{
  padding:10px 12px;display:flex;align-items:center;gap:9px;
  border-top:1px solid var(--border2)
}
.sb-av{width:26px;height:26px;border-radius:50%;background:var(--border);overflow:hidden;flex-shrink:0}
.sb-av img{width:100%;height:100%;object-fit:cover}
.sb-user-info{flex:1;min-width:0}
.sb-name{font-size:11px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-status{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--green)}
.sb-status-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.sb-out{
  width:calc(100% - 24px);margin:0 12px 10px;
  padding:6px;border-radius:6px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;
  font-family:inherit;transition:all .1s
}
.sb-out:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}

/* ── Main panel ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

#topbar{
  padding:0 24px;height:52px;
  border-bottom:1px solid var(--border);background:var(--bg2);
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between
}
.tb-left{display:flex;align-items:baseline;gap:8px}
.tb-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.tb-sub{font-size:12px;color:var(--muted)}
.live-badge{
  display:flex;align-items:center;gap:5px;
  font-size:10px;font-weight:600;color:var(--green);
  padding:3px 8px;border-radius:20px;
  background:var(--green-dim);border:1px solid rgba(62,207,142,.2)
}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:blink 2.5s infinite}

/* ── Content ── */
#content{flex:1;overflow-y:auto;padding:20px 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#content::-webkit-scrollbar{width:5px}
#content::-webkit-scrollbar-track{background:transparent}
#content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.tab{display:none}.tab.on{display:block}

/* ── Loading ── */
.page-loading{display:flex;align-items:center;gap:10px;padding:40px;color:var(--muted);font-size:12px}
.spin{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Filter bar ── */
.filter-bar{
  display:flex;align-items:center;gap:6px;
  margin-bottom:20px;padding-bottom:16px;
  border-bottom:1px solid var(--border2);flex-wrap:wrap
}
.filter-group{display:flex;align-items:center;gap:3px}
.flt-btn{
  padding:4px 12px;border-radius:6px;font-size:11px;font-weight:500;
  background:none;border:1px solid var(--border);color:var(--muted);
  cursor:pointer;font-family:inherit;transition:all .1s;white-space:nowrap
}
.flt-btn:hover{border-color:var(--border2);color:var(--text2);background:rgba(255,255,255,.04)}
.flt-btn.on{
  background:rgba(247,169,79,.1);border-color:rgba(247,169,79,.35);
  color:var(--gold);font-weight:600
}
.flt-btn.ath-btn{
  display:flex;align-items:center;gap:5px;
  padding:4px 10px
}
.flt-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.flt-sep{width:1px;height:14px;background:var(--border);margin:0 4px;flex-shrink:0}

/* ── Schedule table (Overview) ── */
.sched-wrap{overflow-x:auto}
.sched-table{width:100%;border-collapse:collapse;min-width:900px}

.sched-table thead th{
  padding:8px 10px;font-size:10px;font-weight:600;
  color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  border-bottom:2px solid var(--border);text-align:center;
  background:var(--bg2);position:sticky;top:0;z-index:2
}
.sched-table thead th.day-today{
  color:var(--blue);border-bottom-color:var(--blue)
}
.sched-table thead th.ath-col{
  text-align:left;min-width:160px;width:160px
}

.sched-table tbody tr{border-bottom:1px solid var(--border2)}
.sched-table tbody tr:last-child{border-bottom:none}
.sched-table tbody tr:hover td{background:rgba(255,255,255,.015)}

.sched-table td{
  padding:10px;vertical-align:top;border-right:1px solid var(--border2)
}
.sched-table td:last-child{border-right:none}

.td-ath{
  min-width:160px;width:160px;padding:12px 10px;
  vertical-align:middle;position:sticky;left:0;
  background:var(--bg);z-index:1
}
.td-ath-inner{display:flex;align-items:center;gap:9px}
.td-av{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700
}
.td-ath-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
.td-ath-meta{font-size:10px;color:var(--muted);margin-top:1px}
.td-ath-badge{
  display:inline-block;padding:1px 5px;border-radius:3px;
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px
}

.td-day{min-width:120px;vertical-align:top}
.td-day.is-today{background:rgba(88,166,255,.04)}

.day-rest{
  color:var(--hint);font-size:10px;padding-top:2px
}

.session-block{
  padding:5px 7px;border-radius:5px;margin-bottom:4px;
  border-left:2px solid transparent
}
.session-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.session-val{font-size:12px;font-weight:700;line-height:1.2}
.session-rpe{font-size:10px;color:var(--muted);margin-top:1px}

.cond-row{
  display:flex;gap:7px;align-items:center;
  padding-top:5px;border-top:1px solid var(--border2);
  margin-top:4px;flex-wrap:wrap
}
.cond-item{font-size:10px;font-weight:500;white-space:nowrap}

.sore-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.sore-tag{
  font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;white-space:nowrap
}

.plan-hint{
  font-size:9px;color:var(--blue);
  padding:3px 6px;border-radius:4px;
  background:var(--blue-dim);display:inline-block;margin-bottom:4px
}

/* ── Section header ── */
.sec{margin:0 0 16px;display:flex;align-items:center;gap:10px}
.sec-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.sec-line{flex:1;height:1px;background:var(--border2)}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card-hd{
  font-size:10px;font-weight:700;color:#c9d1d9;
  text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:12px;display:flex;align-items:center;justify-content:space-between
}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ── Stat chips ── */
.stat-chip{
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:6px;padding:10px 12px;text-align:center
}
.stat-chip .sv{font-size:17px;font-weight:800;line-height:1.2}
.stat-chip .sl{font-size:10px;color:var(--muted);margin-top:2px}

/* ── Load table ── */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{
  padding:8px 10px;text-align:left;font-size:10px;font-weight:600;
  color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2)
}
.data-table td{
  padding:8px 10px;border-bottom:1px solid var(--border2);vertical-align:top
}
.data-table tr:hover td{background:rgba(255,255,255,.02)}
.data-table td:last-child,.data-table th:last-child{text-align:right}

.type-pill{
  display:inline-block;padding:1px 6px;border-radius:3px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px
}

/* ── Heatmap ── */
.heatmap-wrap{overflow-x:auto}
.heatmap{border-collapse:collapse;font-size:11px;width:100%}
.heatmap th{
  padding:6px 8px;font-size:10px;font-weight:600;color:var(--muted);
  text-align:center;white-space:nowrap;border-bottom:1px solid var(--border);background:var(--bg2)
}
.heatmap th.part-col{text-align:left;min-width:120px}
.heatmap td{padding:4px 5px;text-align:center;border:1px solid rgba(255,255,255,.03)}
.heatmap td.part-label{text-align:left;padding-left:8px;white-space:nowrap;font-weight:500}
.hm-cell{
  width:26px;height:22px;border-radius:3px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;width:100%
}

/* ── Charts ── */
.chart-h{position:relative;height:210px}
.chart-sm{position:relative;height:160px}

/* ── Selector bar ── */
.sel-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.seg-btn{
  padding:4px 12px;border-radius:6px;font-size:11px;font-weight:500;
  background:none;border:1px solid var(--border);color:var(--muted);
  cursor:pointer;font-family:inherit;transition:all .1s
}
.seg-btn:hover{color:var(--text2);background:rgba(255,255,255,.04)}
.seg-btn.on{
  background:rgba(247,169,79,.1);border-color:rgba(247,169,79,.35);
  color:var(--gold);font-weight:600
}
.fsel{
  padding:5px 10px;border-radius:6px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text2);font-size:12px;outline:none;cursor:pointer;font-family:inherit
}

/* ── Condition bars ── */
.cb-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.cb-lbl{font-size:10px;color:#8b949e;min-width:56px;flex-shrink:0}
.cb-track{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.cb-fill{height:100%;border-radius:2px}
.cb-val{font-size:10px;font-weight:700;min-width:20px;text-align:right;flex-shrink:0}

/* ── Log rows ── */
.lr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border2);font-size:12px}
.lr:last-child{border-bottom:none}
.lr .ld{color:var(--muted);min-width:50px;flex-shrink:0;font-size:11px}
.lr .lt{font-weight:600;min-width:52px;flex-shrink:0}
.lr .lv{flex:1;color:var(--text2)}
.lr .lrpe{color:var(--muted);font-size:10px;flex-shrink:0}
.lr .ldel{
  padding:1px 6px;border-radius:4px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);font-size:10px;cursor:pointer;opacity:0;
  transition:all .1s;flex-shrink:0
}
.lr:hover .ldel{opacity:1}
.lr:hover .ldel:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}

/* ── Export ── */
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.exp-btn{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px;border-radius:var(--radius);cursor:pointer;
  font-family:inherit;text-align:left;border:1px solid var(--border);
  background:var(--card);transition:all .12s
}
.exp-btn:hover{border-color:var(--gold);background:rgba(247,169,79,.05)}
.exp-btn.blue:hover{border-color:var(--blue);background:rgba(88,166,255,.05)}
.exp-btn.green:hover{border-color:var(--green);background:rgba(62,207,142,.05)}
.exp-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.exp-label{font-size:12px;font-weight:600;color:var(--text);margin-bottom:3px}
.exp-desc{font-size:11px;color:var(--muted);line-height:1.4}

/* ── Compare ── */
.compare-panel{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:16px;overflow-x:auto
}
.compare-panel-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.compare-table{width:100%;border-collapse:collapse;font-size:12px;min-width:400px}
.compare-table th{
  padding:8px 12px;font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;text-align:right;
  border-bottom:1px solid var(--border);background:var(--bg3)
}
.compare-table th.metric-col{text-align:left;min-width:120px}
.compare-table td{
  padding:8px 12px;border-bottom:1px solid var(--border2);text-align:right;
  font-weight:600;font-size:12px
}
.compare-table td.metric-col{text-align:left;font-weight:500;color:var(--muted)}
.compare-table tr:last-child td{border-bottom:none}
.compare-table tr:hover td{background:rgba(255,255,255,.02)}
.compare-best{color:var(--green)}
.compare-worst{color:var(--red)}

.ath-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:border-color .15s;cursor:default;position:relative
}
.ath-card.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(247,169,79,.3)}
.cmp-toggle{
  position:absolute;top:10px;right:10px;
  width:20px;height:20px;border-radius:5px;
  border:1.5px solid var(--border);background:var(--bg3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:10px;transition:all .12s;color:transparent;z-index:2
}
.cmp-toggle:hover{border-color:var(--gold);background:var(--gold-dim)}
.ath-card.selected .cmp-toggle{
  border-color:var(--gold);background:var(--gold);color:#000;font-weight:800
}

/* ── Tooltip ── */
#g-tip{
  display:none;position:fixed;z-index:9999;pointer-events:none;
  background:#1c2128;border:1px solid #30363d;border-radius:8px;
  padding:10px 13px;font-size:12px;color:#e6edf3;
  box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:280px;min-width:160px
}
#g-tip .tip-date{font-size:10px;color:#8b949e;margin-bottom:7px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
#g-tip .tip-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-weight:600}
#g-tip .tip-rest{color:#484f58;font-size:11px}
#g-tip .tip-sore{margin-top:7px;padding-top:7px;border-top:1px solid #21262d;font-size:11px;color:#f85149}
.heatmap td{cursor:default}
.heatmap td:hover{background:rgba(255,255,255,.04)}

/* ── Empty ── */
.empty{color:var(--muted);font-size:12px;padding:32px;text-align:center}

@media(max-width:1000px){#sidebar{width:180px}.g2{grid-template-columns:1fr}.exp-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="lg-logo">🏋️</div>
  <div class="lg-title">TrainLog</div>
  <div class="lg-sub">Bayern Skeleton · Coach Dashboard</div>
  <button id="google-btn" onclick="doLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
    Continue with Google
  </button>
  <div id="auth-err"></div>
</div>

<!-- APP -->
<div id="app">
  <aside id="sidebar">
    <div class="sb-brand">
      <span class="sb-brand-icon">🏋️</span>
      <div>
        <div class="sb-brand-name">TrainLog</div>
        <div class="sb-brand-sub">Bayern Skeleton</div>
      </div>
    </div>
    <nav>
      <div class="sb-section-label">Views</div>
      <button class="nb on" onclick="switchTab('overview',this)"><span class="ni">📋</span>Overview</button>
      <button class="nb" onclick="switchTab('load',this)"><span class="ni">📊</span>Load</button>
      <button class="nb" onclick="switchTab('soreness',this)"><span class="ni">🔴</span>Soreness</button>
      <button class="nb" onclick="switchTab('condition',this)"><span class="ni">😴</span>Condition</button>

<div id="g-tip"></div>
<script>
// ══ FIREBASE ══
firebase.initializeApp({apiKey:"AIzaSyBF_F7ANEj4n9E5O5-x9YWn9mOBunl8Ze8",authDomain:"traininglogskeleton.firebaseapp.com",projectId:"traininglogskeleton",storageBucket:"traininglogskeleton.firebasestorage.app",messagingSenderId:"467243804287",appId:"1:467243804287:web:8808291abb44de59b7c1a4"});
const db=firebase.firestore(), auth=firebase.auth();
const ALLOWED='jaemyung1287@gmail.com';

// ══ STATE ══
let coachData=null, athLogs={}, unsubs=[], athUnsubs=[], curTab='overview';
let weekOffset=0, loadPeriod=7, loadAth=null, condAth=null, soreAth=null;
let overviewFilter='all';
let athletesFilter='all';
let compareSet=new Set();
const charts={};

// ══ AUTH ══
function doLogin(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>showErr(e.message));}
function showErr(m){const el=document.getElementById('auth-err');el.textContent=m;el.style.display='block';}

auth.onAuthStateChanged(u=>{
  if(u){
    if(u.email!==ALLOWED){auth.signOut();showErr('Access denied: '+u.email);return;}
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').classList.add('show');
    document.getElementById('user-name').textContent=u.displayName||u.email;
    if(u.photoURL)document.getElementById('user-photo').src=u.photoURL;
    startListen();
  }else{
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app').classList.remove('show');
    unsubs.forEach(u=>u());athUnsubs.forEach(u=>u());unsubs=[];athUnsubs=[];
  }
});

// ══ LISTENERS ══
function startListen(){
  unsubs.forEach(u=>u());unsubs=[];
  showTabLoading();
  unsubs.push(db.collection('trainlog').doc('coach').onSnapshot(snap=>{
    if(!snap.exists){renderCurrent();return;}
    const prev=coachData; coachData=snap.data();
    if(!loadAth&&coachData.athletes?.length){loadAth=coachData.athletes[0].name;condAth=loadAth;soreAth=loadAth;}
    const ids=(coachData.athletes||[]).map(a=>a.id).filter(Boolean);
    const prevIds=(prev?.athletes||[]).map(a=>a.id).filter(Boolean);
    if(JSON.stringify(ids)!==JSON.stringify(prevIds)){setupAthListeners(ids);setTimeout(renderCurrent,1500);}
    else renderCurrent();
  }));
}
function showTabLoading(){
  const w=document.getElementById('tab-'+curTab);
  if(w&&!w.innerHTML.trim())w.innerHTML='<div class="page-loading"><div class="spin"></div>Loading data…</div>';
}
function setupAthListeners(ids){
  athUnsubs.forEach(u=>u());athUnsubs=[];
  if(!ids.length){renderCurrent();return;}
  ids.forEach(id=>{
    athUnsubs.push(db.collection('trainlog').doc('athlete_'+id).onSnapshot(
      snap=>{athLogs[id]=snap.exists?(snap.data().logs||[]):[];renderCurrent();},
      err=>{console.warn('[dash] snapshot err:',id,err);renderCurrent();}
    ));
  });
}

// ══ HELPERS ══
function todayStr(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function p2(n){return String(n).padStart(2,'0');}
function dsFromDate(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function getLast(n){const a=[];for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);a.push(dsFromDate(d));}return a;}
function getWeekDates(off=0){
  const now=new Date(),dow=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1)+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return{ds:dsFromDate(d),d};});
}
function fmt(ds){if(!ds)return'—';const p=ds.split('-');return`${p[2]}.${p[1]}.`;}
function fmtFull(ds){if(!ds)return'—';const p=ds.split('-');return`${p[2]}.${p[1]}.${p[0]}`;}
function fmtShort(dt){return`${dt.toLocaleString('de',{month:'short'})} ${dt.getDate()}`;}
function getLogsByName(name){
  const ath=(coachData?.athletes||[]).find(a=>a.name===name);
  if(ath?.id&&athLogs[ath.id])return athLogs[ath.id];
  for(const[,logs]of Object.entries(athLogs)){if(logs.some(l=>l.athleteName===name))return logs;}
  return[];
}
function getAllLogs(){return Object.values(athLogs).flat();}
function vol(logs){
  return logs.filter(l=>l.type==='weight'||l.type==='plyo').reduce((s,log)=>s+(log.exercises||[]).reduce((ss,e)=>{
    if(e.isBodyweight)return ss;
    if(e.setRows?.length)return ss+e.setRows.reduce((r,sr)=>r+(parseFloat(sr.kg)||0)*(parseFloat(sr.reps)||0),0);
    return ss+(parseFloat(e.weight)||0)*(parseInt(e.sets)||0)*(parseInt(e.reps)||0);
  },0),0);
}
function iCol(v,hg){
  if(v==null)return'var(--muted)';
  if(hg)return v>=7?'var(--green)':v>=4?'var(--gold)':'var(--red)';
  return v>=7?'var(--red)':v>=4?'var(--gold)':'var(--green)';
}
function tc(t){return{weight:'#f7a94f',sprint:'#3ecf8e',plyo:'#f7a94f',condition:'#bc8cff',tabata:'#f85149'}[t]||'var(--muted)';}
function tcBg(t){return{weight:'rgba(247,169,79,.1)',sprint:'rgba(62,207,142,.1)',plyo:'rgba(247,169,79,.1)',tabata:'rgba(248,81,73,.1)'}[t]||'rgba(255,255,255,.04)';}
function planGrp(plan,ath){if(!plan)return null;return plan.groups?.[ath.group]||(!plan.groups?plan:null);}
function sessExs(gd,s){if(!gd)return[];if(gd[s]?.exercises)return gd[s].exercises;if(s==='am'&&gd.exercises)return gd.exercises;return[];}
function killChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

// ══ WEEK NAV ══
function shiftWeek(delta,reset=false){
  if(reset)weekOffset=0;else weekOffset+=delta;
  updateWeekLabel();renderCurrent();
}
function updateWeekLabel(){
  const wk=getWeekDates(weekOffset);
  document.getElementById('wn-dates').textContent=`${fmtShort(wk[0].d)} – ${fmtShort(wk[6].d)}`;
  const btn=document.getElementById('wn-today-btn');
  if(btn)btn.style.display=weekOffset!==0?'block':'none';
}

// ══ NAV ══
const TITLES={overview:'Overview',load:'Training Load',soreness:'Soreness',condition:'Condition',athletes:'Athletes',export:'Export'};
function switchTab(id,btn){
  curTab=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('tab-'+id).classList.add('on');
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  document.getElementById('tb-title').textContent=TITLES[id]||id;
  if(!coachData){showTabLoading();return;}
  renderCurrent();
}
function renderCurrent(){
  if(!coachData)return;
  updateWeekLabel();
  ({overview:renderOverview,load:renderLoad,soreness:renderSoreness,condition:renderCondition,athletes:renderAthletes,export:renderExport})[curTab]?.();
}

// ══════════════════════════════════════
//  OVERVIEW — Schedule table
// ══════════════════════════════════════
function setOverviewFilter(f){overviewFilter=f;renderOverview();}

function renderOverview(){
  const wrap=document.getElementById('tab-overview');
  const wk=getWeekDates(weekOffset);
  const today=todayStr();
  const mon=wk[0].d, sun=wk[6].d;
  document.getElementById('tb-sub').textContent=`${fmtShort(mon)} – ${fmtShort(sun)}`;

  const allAthletes=coachData.athletes||[];
  if(!allAthletes.length){wrap.innerHTML='<div class="empty">No athletes found</div>';return;}

  const groups=[...new Set(allAthletes.map(a=>a.group))].sort();
  const isGrp=f=>groups.includes(f);

  // Filter bar
  let fb=`<div class="filter-bar">
    <div class="filter-group">
      <button class="flt-btn ${overviewFilter==='all'?'on':''}" onclick="setOverviewFilter('all')">All Athletes</button>`;
  groups.forEach(g=>{
    const c=g==='A'?'#58a6ff':'#3ecf8e';
    fb+=`<button class="flt-btn ${overviewFilter===g?'on':''}" onclick="setOverviewFilter('${g}')">Group ${g}</button>`;
  });
  fb+=`</div><div class="flt-sep"></div><div class="filter-group">`;
  allAthletes.forEach(a=>{
    const c=a.group==='A'?'#58a6ff':'#3ecf8e';
    const short=a.name.split(' ').map((p,i)=>i===0?p:p[0]+'.').join(' ');
    fb+=`<button class="flt-btn ath-btn ${overviewFilter===a.name?'on':''}" onclick="setOverviewFilter('${a.name.replace(/'/g,"\\'")}')">
      <span class="flt-dot" style="background:${c}"></span>${short}
    </button>`;
  });
  fb+=`</div></div>`;

  // Filtered athletes
  let athletes = overviewFilter==='all' ? allAthletes
    : isGrp(overviewFilter) ? allAthletes.filter(a=>a.group===overviewFilter)
    : allAthletes.filter(a=>a.name===overviewFilter);

  const DN_DE=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const DN_EN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  // Table header
  let table=`<div class="sched-wrap"><table class="sched-table">
    <thead><tr>
      <th class="ath-col">Athlete</th>`;
  wk.forEach(({ds,d},i)=>{
    const isToday=ds===today;
    table+=`<th class="${isToday?'day-today':''}">
      ${DN_DE[i]} · ${DN_EN[i]}<br>
      <span style="font-size:11px;font-weight:400;text-transform:none;letter-spacing:0">${d.getDate()}.${d.getMonth()+1}.</span>
      ${isToday?'<span style="margin-left:3px;font-size:9px;padding:1px 4px;border-radius:2px;background:var(--blue-dim);color:var(--blue);font-weight:700">TODAY</span>':''}
    </th>`;
  });
  table+=`</tr></thead><tbody>`;

  athletes.forEach(ath=>{
    const logs=getLogsByName(ath.name);
    const grpColor=ath.group==='A'?'#58a6ff':'#3ecf8e';
    const grpBg=ath.group==='A'?'rgba(88,166,255,.15)':'rgba(62,207,142,.15)';

    table+=`<tr>
      <td class="td-ath">
        <div class="td-ath-inner">
          <div class="td-av" style="background:${grpBg};color:${grpColor}">${ath.name[0]}</div>
          <div>
            <div class="td-ath-name">${ath.name}</div>
            <div class="td-ath-meta">
              <span class="td-ath-badge" style="background:${grpBg};color:${grpColor}">Group ${ath.group}</span>
              ${ath.dob?`<span style="margin-left:4px;font-size:9px;color:var(--hint)">${ath.dob}</span>`:''}
            </div>
          </div>
        </div>
      </td>`;

    wk.forEach(({ds,d},i)=>{
      const isToday=ds===today;
      const dayLogs=logs.filter(l=>l.date===ds);
      const trainLogs=dayLogs.filter(l=>l.type!=='condition');
      const condLog=dayLogs.find(l=>l.type==='condition');
      const plan=coachData.sessionPlans?.[ds];
      const gd=planGrp(plan,ath);
      const hasPlan=(sessExs(gd,'am').length+sessExs(gd,'pm').length)>0;

      table+=`<td class="td-day${isToday?' is-today':''}">`;

      if(hasPlan&&!trainLogs.length){
        const cnt=sessExs(gd,'am').length+sessExs(gd,'pm').length;
        table+=`<div class="plan-hint">📋 ${cnt} planned</div>`;
      }

      if(trainLogs.length){
        trainLogs.forEach(l=>{
          const c=tc(l.type);
          const bg=tcBg(l.type);
          const typeLabel=l.type==='weight'?'Weight':l.type==='sprint'?'Sprint':l.type==='plyo'?'Plyo':l.type==='tabata'?'Tabata':l.type;
          const val=l.type==='weight'?`${vol([l]).toLocaleString()} kg`
            :l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()} m`
            :l.type==='plyo'?`${l.totalReps||0} reps`
            :l.type==='tabata'?'8 rounds':'—';
          table+=`<div class="session-block" style="background:${bg};border-left-color:${c}">
            <div class="session-type" style="color:${c}">${typeLabel}</div>
            <div class="session-val">${val}</div>
            ${l.rpe?`<div class="session-rpe">RPE ${l.rpe}</div>`:''}
          </div>`;
        });
      } else if(!hasPlan){
        table+=`<div class="day-rest">—</div>`;
      }

      if(condLog){
        const fc=iCol(condLog.fatigue,false), mc=iCol(condLog.mood,true);
        table+=`<div class="cond-row">
          <span class="cond-item">😴 ${condLog.sleepHours||'—'}h</span>
          <span class="cond-item" style="color:${fc}">⚡${condLog.fatigue||'—'}</span>
          <span class="cond-item" style="color:${mc}">😊${condLog.mood||'—'}</span>
        </div>`;
      }
      if(condLog&&(condLog.soreness||[]).length){
        table+=`<div class="sore-row">`;
        condLog.soreness.forEach(s=>{
          const n=s.intensity;
          const c=n>=7?'248,81,73':n>=4?'247,169,79':'62,207,142';
          table+=`<span class="sore-tag" style="background:rgba(${c},.15);color:rgba(${c},1)">${s.part} ${s.intensity}</span>`;
        });
        table+=`</div>`;
      }

      table+=`</td>`;
    });
    table+=`</tr>`;
  });

  table+=`</tbody></table></div>`;
  wrap.innerHTML=fb+table;
}

// ══════════════════════════════════════
//  LOAD
// ══════════════════════════════════════
function renderLoad(){
  const wrap=document.getElementById('tab-load');
  const wk=getWeekDates(weekOffset);
  const athletes=coachData.athletes||[];
  if(!athletes.length){wrap.innerHTML='<div class="empty">No athletes</div>';return;}
  document.getElementById('tb-sub').textContent=`${fmtShort(wk[0].d)} – ${fmtShort(wk[6].d)}`;

  const DN=['Mo','Di','Mi','Do','Fr','Sa','So'];

  let html=`<div class="card" style="margin-bottom:16px;overflow-x:auto">
    <div class="card-hd">Weekly Load Summary</div>
    <table class="data-table">
      <tr><th>Athlete</th>${DN.map((d,i)=>`<th style="text-align:center">${d} ${wk[i].d.getDate()}.</th>`).join('')}<th>Volume</th><th>Distance</th></tr>`;

  athletes.forEach(ath=>{
    const logs=getLogsByName(ath.name);
    let weekVol=0, weekDist=0;
    const cells=wk.map(({ds})=>{
      const dayLogs=logs.filter(l=>l.date===ds);
      const trains=dayLogs.filter(l=>l.type!=='condition');
      const cond=dayLogs.find(l=>l.type==='condition');
      if(!trains.length&&!cond)return`<td style="text-align:center"><span style="color:var(--hint)">—</span></td>`;
      let cell='<td style="text-align:center">';
      trains.forEach(l=>{
        const c=tc(l.type);
        const val=l.type==='weight'?`${vol([l]).toLocaleString()}kg`:l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()}m`:l.type==='tabata'?'Tabata':'—';
        if(l.type==='weight'||l.type==='plyo')weekVol+=vol([l]);
        if(l.type==='sprint')weekDist+=(l.totalDistance||0);
        cell+=`<div><span class="type-pill" style="background:${tcBg(l.type)};color:${c}">${l.type==='weight'?'W':l.type==='sprint'?'S':l.type==='plyo'?'P':'T'}</span> <span style="font-weight:700;font-size:12px">${val}</span>${l.rpe?`<span style="font-size:10px;color:var(--muted)"> ·${l.rpe}</span>`:''}</div>`;
      });
      if(cond){
        const fc=iCol(cond.fatigue,false),mc=iCol(cond.mood,true);
        cell+=`<div style="font-size:10px;margin-top:3px"><span style="color:${fc}">⚡${cond.fatigue||'—'}</span> <span style="color:${mc}">😊${cond.mood||'—'}</span></div>`;
      }
      return cell+'</td>';
    });
    const grpColor=ath.group==='A'?'#58a6ff':'#3ecf8e';
    html+=`<tr>
      <td style="font-weight:600;white-space:nowrap">
        ${ath.name}
        <span class="type-pill" style="margin-left:4px;background:${ath.group==='A'?'rgba(88,166,255,.12)':'rgba(62,207,142,.12)'};color:${grpColor}">Grp ${ath.group}</span>
      </td>
      ${cells.join('')}
      <td style="font-weight:700;color:var(--gold)">${weekVol>0?(weekVol>=1000?(weekVol/1000).toFixed(1)+'t':weekVol.toLocaleString()+'kg'):'—'}</td>
      <td style="font-weight:700;color:var(--green)">${weekDist>0?weekDist.toLocaleString()+'m':'—'}</td>
    </tr>`;
  });
  html+=`</table></div>`;

  if(!loadAth)loadAth=athletes[0].name;
  const athOpts=athletes.map(a=>`<option value="${a.name}" ${loadAth===a.name?'selected':''}>${a.name}</option>`).join('');
  html+=`<div class="sel-bar">
    <select class="fsel" onchange="loadAth=this.value;renderLoad()">${athOpts}</select>
    <button class="seg-btn ${loadPeriod===7?'on':''}" onclick="loadPeriod=7;renderLoad()">7 Days</button>
    <button class="seg-btn ${loadPeriod===30?'on':''}" onclick="loadPeriod=30;renderLoad()">30 Days</button>
    <button class="seg-btn ${loadPeriod===90?'on':''}" onclick="loadPeriod=90;renderLoad()">90 Days</button>
  </div>
  <div class="g2">
    <div class="card"><div class="card-hd">🏋️ Weight Volume</div><div class="chart-sm"><canvas id="ch-vol"></canvas></div></div>
    <div class="card"><div class="card-hd">⚡ Sprint Distance</div><div class="chart-sm"><canvas id="ch-spr"></canvas></div></div>
  </div>`;

  wrap.innerHTML=html;
  const logs=getLogsByName(loadAth);
  const dates=getLast(loadPeriod).reverse();
  const ds=new Set(dates);
  const myLogs=logs.filter(l=>ds.has(l.date));
  setTimeout(()=>{
    buildBarChart('vol',dates,dates.map(d=>vol(myLogs.filter(l=>l.date===d))),'rgba(247,169,79,.45)','#f7a94f');
    buildBarChart('spr',dates,dates.map(d=>myLogs.filter(l=>l.date===d&&l.type==='sprint').reduce((s,l)=>s+(l.totalDistance||0),0)),'rgba(62,207,142,.45)','#3ecf8e');
  },50);
}

function buildBarChart(id,dates,data,bg,border){
  killChart(id);
  const c=document.getElementById('ch-'+id);if(!c)return;
  charts[id]=new Chart(c,{type:'bar',data:{labels:dates.map(d=>fmt(d)),datasets:[{data,backgroundColor:bg,borderColor:border,borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#8b949e',font:{size:9},maxTicksLimit:14}},y:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#8b949e',font:{size:9}},beginAtZero:true}}}});
}

// ══════════════════════════════════════
//  SORENESS
// ══════════════════════════════════════
const BODY_PARTS=['Neck','Shoulder','Chest','Back','Lower Back','Abs','Oblique','Hip','Quad','Glute','Hamstring','Adductor','Calf','Ankle','Foot','Arm'];

function renderSoreness(){
  const wrap=document.getElementById('tab-soreness');
  const athletes=coachData.athletes||[];
  if(!athletes.length){wrap.innerHTML='<div class="empty">No athletes</div>';return;}
  if(!soreAth)soreAth=athletes[0].name;
  document.getElementById('tb-sub').textContent=soreAth+' · Last 14 days';

  const athOpts=athletes.map(a=>`<option value="${a.name}" ${soreAth===a.name?'selected':''}>${a.name}</option>`).join('');
  const dates=getLast(14).reverse();
  const logs=getLogsByName(soreAth);
  const map={};
  logs.filter(l=>l.type==='condition'&&(l.soreness||[]).length).forEach(l=>{
    if(!dates.includes(l.date))return;
    if(!map[l.date])map[l.date]={};
    (l.soreness||[]).forEach(s=>{if(!map[l.date][s.part]||map[l.date][s.part]<s.intensity)map[l.date][s.part]=s.intensity;});
  });
  // 툴팁 데이터: 날짜별 훈련 내용
  const trainMap={};
  logs.filter(l=>l.type!=='condition').forEach(l=>{
    if(!trainMap[l.date])trainMap[l.date]=[];
    trainMap[l.date].push(l);
  });
  dates.forEach(d=>{
    const soreToday=map[d]?Object.entries(map[d]).map(([p,v])=>`${p}(${v})`).join(' · '):null;
    _td[d]={trains:trainMap[d]||[],soreLabel:soreToday};
  });

  let html=`<div class="sel-bar"><select class="fsel" onchange="soreAth=this.value;renderSoreness()">${athOpts}</select></div>
  <div class="card">

        <span style="color:var(--gold)">●</span> moderate (4–6) &nbsp;
        <span style="color:var(--red)">●</span> severe (7–10)
      </span>
    </div>
    <div class="heatmap-wrap"><table class="heatmap">
      <tr><th class="part-col">Body Part</th>${dates.map(d=>`<th>${fmt(d)}</th>`).join('')}</tr>`;

  BODY_PARTS.forEach(part=>{
    const hasData=dates.some(d=>map[d]?.[part]);
    html+=`<tr ${!hasData?'style="opacity:.3"':''}><td class="part-label">${part}</td>`;
    dates.forEach(d=>{
      const v=map[d]?.[part];
      const tipAttr=`onmouseenter="showTip(event,'${d}')" onmouseleave="hideTip()"`;
      if(!v){html+=`<td ${tipAttr}></td>`;return;}
      const c=v>=7?'248,81,73':v>=4?'247,169,79':'62,207,142';
      const a=.15+((v-1)/9)*.6;
      html+=`<td ${tipAttr}><div class="hm-cell" style="background:rgba(${c},${a.toFixed(2)});color:rgba(${c},1)">${v}</div></td>`;
    });
    html+=`</tr>`;
  });
  html+=`</table></div></div>`;
  wrap.innerHTML=html;
}

function cBar2(label,val,max,hg){
  if(val==null)return`<div class="cb-row"><span class="cb-lbl">${label}</span><span style="color:var(--hint)">—</span></div>`;
  const pct=Math.min(100,Math.round((parseFloat(val)/max)*100));
  const c=iCol(parseFloat(val),hg);
  return`<div class="cb-row"><span class="cb-lbl">${label}</span><div class="cb-track"><div class="cb-fill" style="width:${pct}%;background:${c}"></div></div><span class="cb-val" style="color:${c}">${val}</span></div>`;
}

function setAthletesFilter(f){athletesFilter=f;renderAthletes();}
function toggleCompare(name){
  if(compareSet.has(name))compareSet.delete(name);else compareSet.add(name);
  renderAthletes();
}

function _athStats(ath,days=7){
  const logs=getLogsByName(ath.name);
  const dateSet=new Set(getLast(days));
  const my=logs.filter(l=>dateSet.has(l.date));
  const wVol=vol(my.filter(l=>l.type==='weight'||l.type==='plyo'));
  const sDist=my.filter(l=>l.type==='sprint').reduce((s,l)=>s+(l.totalDistance||0),0);
  const cL=my.filter(l=>l.type==='condition');
  const avgF=cL.length?(cL.reduce((s,l)=>s+(l.fatigue||0),0)/cL.length):null;
  const avgM=cL.length?(cL.reduce((s,l)=>s+(l.mood||0),0)/cL.length):null;
  const avgSQ=cL.length?(cL.reduce((s,l)=>s+(l.sleepQuality||0),0)/cL.length):null;
  const avgSH=cL.length?(cL.reduce((s,l)=>s+(l.sleepHours||0),0)/cL.length):null;
  const sess=my.filter(l=>l.type!=='condition').length;
  return {wVol,sDist,avgF,avgM,avgSQ,avgSH,sess};
}

function renderAthletes(){
  const wrap=document.getElementById('tab-athletes');

  if(!allAthletes.length){wrap.innerHTML='<div class="empty">No athletes</div>';return;}

  // ── Filter bar ──

    <div class="filter-group">
      <button class="flt-btn ${athletesFilter==='all'?'on':''}" onclick="setAthletesFilter('all')">All Athletes</button>`;

    fb+=`<button class="flt-btn ${athletesFilter===g?'on':''}" onclick="setAthletesFilter('${g}')">Group ${g}</button>`;
  });

  allAthletes.forEach(a=>{
    const c=a.group==='A'?'#58a6ff':'#3ecf8e';
    const short=a.name.split(' ').map((p,i)=>i===0?p:p[0]+'.').join(' ');

      <span class="flt-dot" style="background:${c}"></span>${short}

  });
  fb+=`</div></div>`;

  // ── Filtered list ──
  let athletes = athletesFilter==='all' ? allAthletes
    : isGrp(athletesFilter) ? allAthletes.filter(a=>a.group===athletesFilter)
    : allAthletes.filter(a=>a.name===athletesFilter);

  document.getElementById('tb-sub').textContent=
    compareSet.size>=2?`${compareSet.size} athletes selected · Click cards to compare`:'Last 7 days';

  // ── Compare panel ──
  let comparePanelHtml='';
  if(compareSet.size>=2){
    const cAthletes=allAthletes.filter(a=>compareSet.has(a.name));
    const stats=cAthletes.map(a=>({ath:a,..._athStats(a,7)}));

    // Helper: highlight best/worst value in a row
    const highlight=(vals,hgIdx,higher=true)=>{
      const nums=vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
      if(!nums.length)return vals.map(v=>`<td class="compare-table-td">${v||'—'}</td>`);
      const best=higher?Math.max(...nums):Math.min(...nums);
      const worst=higher?Math.min(...nums):Math.max(...nums);
      return vals.map((v,i)=>{
        const n=parseFloat(v);
        const cls=isNaN(n)?'':(n===best&&nums.filter(x=>x===best).length<nums.length)?'compare-best':(n===worst&&nums.filter(x=>x===worst).length<nums.length)?'compare-worst':'';
        return`<td class="compare-table-td" style="text-align:right;padding:8px 12px;border-bottom:1px solid var(--border2);font-weight:600" ${cls?`class="${cls}"`:''}>${v||'—'}</td>`;
      });
    };

    const fmtV=v=>v>0?(v>=1000?(v/1000).toFixed(1)+'t':v.toLocaleString()+'kg'):'—';
    const fmtD=v=>v>0?v.toLocaleString()+'m':'—';
    const fmtN=(v,d=1)=>v!=null?parseFloat(v).toFixed(d):'—';

    const rows=[
      ['Sessions (7d)', stats.map(s=>s.sess), true],
      ['Volume (7d)', stats.map(s=>s.wVol>0?s.wVol:null), true, s=>fmtV(s.wVol)],
      ['Sprint (7d)', stats.map(s=>s.sDist>0?s.sDist:null), true, s=>fmtD(s.sDist)],
      ['Ø Fatigue', stats.map(s=>s.avgF), false, s=>fmtN(s.avgF)],
      ['Ø Mood', stats.map(s=>s.avgM), true, s=>fmtN(s.avgM)],
      ['Ø Sleep Q', stats.map(s=>s.avgSQ), true, s=>fmtN(s.avgSQ)],
      ['Ø Sleep h', stats.map(s=>s.avgSH), true, s=>fmtN(s.avgSH)],
    ];

    comparePanelHtml=`<div class="compare-panel">
      <div class="compare-panel-title">Comparison · Last 7 Days</div>
      <table class="compare-table">
        <thead><tr>
          <th class="metric-col">Metric</th>
          ${cAthletes.map(a=>{const gc=a.group==='A'?'#58a6ff':'#3ecf8e';return`<th style="text-align:right"><span style="color:${gc}">${a.name.split(' ')[0]}</span></th>`;}).join('')}
        </tr></thead>
        <tbody>`;

    rows.forEach(([label, rawVals, higher, fmtFn])=>{
      const displayVals=fmtFn?stats.map(fmtFn):rawVals.map(v=>v!=null?String(v):'—');
      const nums=rawVals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
      const best=higher?Math.max(...nums):Math.min(...nums);
      const worst=higher?Math.min(...nums):Math.max(...nums);
      comparePanelHtml+=`<tr>
        <td class="metric-col" style="padding:8px 12px;border-bottom:1px solid var(--border2);color:var(--muted)">${label}</td>
        ${displayVals.map((dv,i)=>{
          const n=parseFloat(rawVals[i]);
          const cls=isNaN(n)||nums.length<2?'':(n===best&&nums.filter(x=>x===best).length<nums.length)?'compare-best':(n===worst&&nums.filter(x=>x===worst).length<nums.length)?'compare-worst':'';
          return`<td style="text-align:right;padding:8px 12px;border-bottom:1px solid var(--border2);font-weight:600" ${cls?`class="${cls}"`:''}>${dv}</td>`;
        }).join('')}
      </tr>`;
    });
    comparePanelHtml+=`</tbody></table>
      <div style="margin-top:10px;font-size:11px;color:var(--muted)">
        <span style="color:var(--green)">●</span> Best &nbsp;

  }

  // ── Athlete cards ──
  const gridCols=athletes.length===1?'1fr':athletes.length===2?'1fr 1fr':'1fr 1fr';
  let cardsHtml=`<div class="g2">`;
  athletes.forEach(ath=>{
    const athId=ath.id;
    const logs=getLogsByName(ath.name);
    const {wVol,sDist,avgF,avgM,sess}=_athStats(ath,7);
    const recent=logs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);
    const sore=logs.filter(l=>l.type==='condition'&&(l.soreness||[]).length).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
    const grpColor=ath.group==='A'?'#58a6ff':'#3ecf8e';
    const grpBg=ath.group==='A'?'rgba(88,166,255,.12)':'rgba(62,207,142,.12)';
    const isSel=compareSet.has(ath.name);

    cardsHtml+=`<div class="ath-card ${isSel?'selected':''}">
      <button class="cmp-toggle" onclick="toggleCompare('${ath.name.replace(/'/g,"\\'")}')" title="Compare">✓</button>
      <div style="padding:14px 16px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:10px">

        <div>
          <div style="font-size:13px;font-weight:700">${ath.name}</div>
          <div style="margin-top:2px">
            <span class="type-pill" style="background:${grpBg};color:${grpColor}">Group ${ath.group}</span>
            ${ath.dob?`<span style="font-size:10px;color:var(--muted);margin-left:6px">${ath.dob}</span>`:''}
          </div>
        </div>
      </div>
      <div style="padding:14px 16px">
        <div class="g3" style="margin-bottom:12px">
          <div class="stat-chip"><div class="sv" style="color:var(--gold)">${sess}</div><div class="sl">Sessions</div></div>
          <div class="stat-chip"><div class="sv" style="color:var(--gold)">${wVol>0?(wVol>=1000?(wVol/1000).toFixed(1)+'t':wVol.toLocaleString()+'kg'):'—'}</div><div class="sl">Volume</div></div>
          <div class="stat-chip"><div class="sv" style="color:var(--green)">${sDist>0?sDist.toLocaleString()+'m':'—'}</div><div class="sl">Sprint</div></div>
        </div>
        ${avgF!=null?`<div style="margin-bottom:12px">${cBar2('Ø Fatigue',avgF.toFixed(1),10,false)}${cBar2('Ø Mood',avgM!=null?avgM.toFixed(1):null,10,true)}</div>`:''}
        <div class="sec"><span class="sec-title">Recent Logs</span><div class="sec-line"></div></div>
        ${recent.length?recent.map(l=>{
          const c=tc(l.type);
          const v=l.type==='weight'?`${vol([l]).toLocaleString()} kg`:l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()} m`:l.type==='condition'?`F${l.fatigue||'—'} M${l.mood||'—'}`:l.type==='plyo'?`${l.totalReps||0} reps`:'—';
          return`<div class="lr">
            <span class="ld">${fmt(l.date)}</span>
            <span class="lt" style="color:${c}">${l.type}</span>

        }).join(''):'<div style="color:var(--muted);font-size:11px;padding:8px 0">No logs</div>'}

function genWeeklyReport(){
  const athletes=coachData?.athletes||[];
  const wk=getWeekDates(weekOffset);
  const today=todayStr();
  const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let rows='';
  athletes.forEach(ath=>{
    const logs=getLogsByName(ath.name);
    let weekVol=0,weekDist=0,sessCount=0;
    const cells=wk.map(({ds,d},i)=>{
      const dayLogs=logs.filter(l=>l.date===ds);
      const trains=dayLogs.filter(l=>l.type!=='condition');
      const cond=dayLogs.find(l=>l.type==='condition');
      const isT=ds===today;
      let cell=`<td style="padding:8px;border:1px solid #e5e7eb;vertical-align:top;min-width:80px;${isT?'background:#fefce8':''}">`;
      if(!trains.length&&!cond){cell+='<span style="color:#9ca3af;font-size:10px">Rest</span>';}
      trains.forEach(l=>{
        const c={weight:'#d97706',sprint:'#059669',plyo:'#7c3aed',tabata:'#dc2626'}[l.type]||'#64748b';
        const val=l.type==='weight'?`${vol([l]).toLocaleString()}kg`:l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()}m`:'—';
        if(l.type==='weight'||l.type==='plyo')weekVol+=vol([l]);
        if(l.type==='sprint')weekDist+=(l.totalDistance||0);
        sessCount++;
        cell+=`<div style="font-size:10px;font-weight:700;color:${c};margin-bottom:1px">${l.type==='weight'?'Weight':l.type==='sprint'?'Sprint':l.type==='plyo'?'Plyo':'Tabata'} ${val}</div>`;
        if(l.rpe)cell+=`<div style="font-size:9px;color:#9ca3af">RPE ${l.rpe}</div>`;
      });
      if(cond){
        const fc=cond.fatigue>=7?'#dc2626':cond.fatigue>=4?'#d97706':'#059669';
        const mc=cond.mood>=7?'#059669':cond.mood>=4?'#d97706':'#dc2626';
        cell+=`<div style="font-size:9px;margin-top:3px;border-top:1px solid #f3f4f6;padding-top:2px">
          <span style="color:${fc}">⚡${cond.fatigue||'—'}</span>
          <span style="color:${mc};margin-left:3px">😊${cond.mood||'—'}</span>
          <span style="color:#9ca3af;margin-left:3px">😴${cond.sleepHours||'—'}h</span>
        </div>`;
        if((cond.soreness||[]).length)cell+=`<div style="font-size:8px;color:#dc2626;margin-top:2px">${cond.soreness.map(s=>s.part+'('+s.intensity+')').join(', ')}</div>`;
      }
      return cell+'</td>';
    }).join('');
    const gc=ath.group==='A'?'#1d4ed8':'#065f46';
    const gb=ath.group==='A'?'#eff6ff':'#f0fdf4';

function genFullReport(){
  const athletes=coachData?.athletes||[];
  const today=todayStr();
  let body='';
  athletes.forEach(ath=>{
    const logs=getLogsByName(ath.name).slice().sort((a,b)=>b.date.localeCompare(a.date));
    const tLogs=logs.filter(l=>l.type!=='condition');
    const cLogs=logs.filter(l=>l.type==='condition');
    const tVol=vol(tLogs);const tDist=tLogs.filter(l=>l.type==='sprint').reduce((s,l)=>s+(l.totalDistance||0),0);
    const avgF=cLogs.length?(cLogs.reduce((s,l)=>s+(l.fatigue||0),0)/cLogs.length).toFixed(1):null;
    const avgM=cLogs.length?(cLogs.reduce((s,l)=>s+(l.mood||0),0)/cLogs.length).toFixed(1):null;
    const rows=tLogs.slice(0,20).map(l=>{
      const c={weight:'#d97706',sprint:'#059669',plyo:'#7c3aed',tabata:'#dc2626'}[l.type]||'#64748b';
      const v=l.type==='weight'?`${vol([l]).toLocaleString()} kg`:l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()} m`:l.type==='plyo'?`${l.totalReps||0} reps`:'—';
      return`<tr><td style="padding:5px 8px;border:1px solid #e5e7eb">${fmtFull(l.date)}</td><td style="padding:5px 8px;border:1px solid #e5e7eb;font-weight:700;color:${c}">${l.type}</td><td style="padding:5px 8px;border:1px solid #e5e7eb">${v}</td><td style="padding:5px 8px;border:1px solid #e5e7eb;color:#64748b">${l.rpe||'—'}</td><td style="padding:5px 8px;border:1px solid #e5e7eb;font-size:10px;color:#64748b">${l.notes||''}</td></tr>`;
    }).join('');
    const gc=ath.group==='A'?'#1d4ed8':'#065f46';
    body+=`<div style="margin-bottom:28px;page-break-inside:avoid">
      <div style="background:${gc};color:#fff;padding:12px 16px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-size:15px;font-weight:800">${ath.name}</div><div style="font-size:10px;opacity:.75">Group ${ath.group}${ath.dob?' · '+ath.dob:''}</div></div>
        <div style="font-size:11px;opacity:.8">${tLogs.length} sessions · ${cLogs.length} condition logs</div>
      </div>
      <div style="border:1px solid #e5e7eb;border-top:none;border-radius:0 0 6px 6px;padding:14px 16px">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px">
          ${[['Volume',tVol>=1000?(tVol/1000).toFixed(1)+'t':tVol.toLocaleString()+'kg','#d97706'],['Sprint',tDist>=1000?(tDist/1000).toFixed(1)+'km':tDist.toLocaleString()+'m','#059669'],['Ø Fatigue',avgF||'—','#dc2626'],['Ø Mood',avgM||'—','#059669']].map(([l,v,c])=>`<div style="text-align:center;padding:8px;background:#f8fafc;border-radius:6px"><div style="font-size:17px;font-weight:800;color:${c}">${v}</div><div style="font-size:10px;color:#94a3b8">${l}</div></div>`).join('')}
        </div>
        ${rows?`<table style="width:100%;border-collapse:collapse;font-size:11px"><tr>${['Date','Type','Value','RPE','Notes'].map(h=>`<th style="padding:5px 8px;background:#f1f5f9;text-align:left;border:1px solid #e5e7eb;font-size:10px">${h}</th>`).join('')}</tr>${rows}</table>`:'<div style="color:#94a3b8;font-size:11px">No training data</div>'}
      </div>
    </div>`;
  });
  const html=`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>TrainLog Full Report</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;padding:24px 28px;color:#1e293b;font-size:12px}
h1{font-size:20px;font-weight:800;margin-bottom:3px}.sub{font-size:11px;color:#64748b;margin-bottom:22px}
.footer{margin-top:20px;font-size:10px;color:#94a3b8;text-align:right;border-top:1px solid #e5e7eb;padding-top:10px}
@media print{@page{size:A4;margin:12mm}}</style></head><body>
<h1>🏋️ Bayern Skeleton TrainLog — Full Report</h1>
<div class="sub">출력일: ${fmtFull(today)} · ${athletes.length} athletes</div>
${body}<div class="footer">TrainLog Coach Dashboard · ${new Date().toLocaleString('ko-KR')}</div>
</body></html>`;
  const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),400);
}

function downloadCSV(type='all'){
  const athletes=coachData?.athletes||[];
  let rows=[],filename='';
  if(type==='condition'){
    filename=`trainlog_condition_${todayStr()}.csv`;
    rows.push(['날짜','선수','그룹','수면시간','수면질','피로도','기분','근육통']);
    athletes.forEach(ath=>{
      getLogsByName(ath.name).filter(l=>l.type==='condition').sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
        rows.push([l.date,ath.name,ath.group,l.sleepHours||'',l.sleepQuality||'',l.fatigue||'',l.mood||'',(l.soreness||[]).map(s=>s.part+'('+s.intensity+')').join(' / ')]);
      });
    });
  }else{
    filename=`trainlog_training_${todayStr()}.csv`;
    rows.push(['날짜','선수','그룹','종류','볼륨(kg)','거리(m)','총렙','RPE','Phase','Week','메모']);
    athletes.forEach(ath=>{
      getLogsByName(ath.name).filter(l=>l.type!=='condition').sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
        rows.push([l.date,ath.name,ath.group,l.type,l.type==='weight'?(l.totalVolume||vol([l])):0,l.type==='sprint'?(l.totalDistance||0):0,l.type==='plyo'?(l.totalReps||0):0,l.rpe||'',l.phase||'',l.week||'',l.notes||'']);
      });
    });
  }
  const blob=new Blob(['﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}

function downloadJSON(){
  const data={exportedAt:new Date().toISOString(),athletes:(coachData?.athletes||[]).map(ath=>({...ath,logs:getLogsByName(ath.name)}))};

  const a=document.createElement('a');a.href=url;a.download=`trainlog_backup_${todayStr()}.json`;a.click();URL.revokeObjectURL(url);

// ══ TOOLTIP ══
const _td={};
const ICON={weight:'🏋️',sprint:'⚡',tabata:'🔥',plyo:'🦘',circuit:'🔄'};
const LABEL={weight:'Weight',sprint:'Sprint',tabata:'Tabata',plyo:'Plyo',circuit:'Circuit'};

function _prevDate(ds){
  const d=new Date(ds);d.setDate(d.getDate()-1);return dsFromDate(d);
}
function _trainBlock(trains,dayLabel){
  if(!trains||!trains.length)return'';
  let html=`<div style="font-size:9px;font-weight:700;color:#484f58;text-transform:uppercase;letter-spacing:.5px;margin:6px 0 3px">${dayLabel}</div>`;
  trains.forEach(tr=>{
    const c=tc(tr.type);
    const v=tr.type==='weight'?`${vol([tr]).toLocaleString()} kg`
      :tr.type==='sprint'?`${(tr.totalDistance||0).toLocaleString()} m`
      :tr.type==='tabata'?'8 rounds'
      :tr.type==='plyo'?`${tr.totalReps||0} reps`:'';
    html+=`<div class="tip-row">
      <span>${ICON[tr.type]||'•'}</span>
      <span style="color:${c};font-weight:700">${LABEL[tr.type]||tr.type} ${v}</span>
      ${tr.rpe?`<span style="color:#8b949e;font-size:10px">RPE ${tr.rpe}</span>`:''}
    </div>`;
    // 운동 종목 목록 (weight는 최대 4개)
    if(tr.type==='weight'&&(tr.exercises||[]).length){
      const exs=tr.exercises.filter(e=>!e.isBodyweight).slice(0,4);
      const bwExs=tr.exercises.filter(e=>e.isBodyweight).slice(0,2);
      const all=[...exs,...bwExs].slice(0,4);
      if(all.length){
        html+=`<div style="margin:3px 0 3px 20px;display:flex;flex-direction:column;gap:1px">`;
        all.forEach(ex=>{
          const w=ex.isBodyweight?'BW':(ex.weight>0?ex.weight+'kg':'BW');
          html+=`<div style="font-size:10px;color:#8b949e">${ex.name||''} <span style="color:#c9d1d9">${w}</span></div>`;
        });
        if(tr.exercises.length>4)html+=`<div style="font-size:9px;color:#484f58">+${tr.exercises.length-4} more</div>`;
        html+=`</div>`;
      }
    }
    // sprint sets
    if(tr.type==='sprint'&&(tr.sets||[]).length){
      const sets=tr.sets.slice(0,3);
      html+=`<div style="margin:3px 0 3px 20px;display:flex;flex-direction:column;gap:1px">`;
      sets.forEach(s=>{
        html+=`<div style="font-size:10px;color:#8b949e">${s.distance||'?'}m × ${s.reps||1}r${s.intensity?' @ '+s.intensity+'%':''}</div>`;
      });
      html+=`</div>`;
    }
  });
  return html;
}

function showTip(e,dateKey){
  const t=document.getElementById('g-tip');
  const d=_td[dateKey];if(!d)return;
  const prevKey=_prevDate(dateKey);
  const prevD=_td[prevKey];

  let html=`<div class="tip-date">${fmtFull(dateKey)}</div>`;

  const prevTrains=prevD?.trains||[];
  const sameTrains=d.trains||[];

  if(!prevTrains.length&&!sameTrains.length){
    html+=`<div class="tip-rest">운동 기록 없음</div>`;
  } else {
    if(prevTrains.length)html+=_trainBlock(prevTrains,`📅 전날 (${fmtFull(prevKey)})`);
    if(sameTrains.length)html+=_trainBlock(sameTrains,`📅 당일 (${fmtFull(dateKey)})`);
  }
  if(d.soreLabel){
    html+=`<div class="tip-sore">🔴 ${d.soreLabel}</div>`;
  }
  t.innerHTML=html;
  t.style.display='block';
  _moveTip(e);
}
function hideTip(){document.getElementById('g-tip').style.display='none';}
function _moveTip(e){
  const t=document.getElementById('g-tip');
  if(!t||t.style.display==='none')return;
  const x=e.clientX+14,y=e.clientY-8;
  const tw=t.offsetWidth||260,th=t.offsetHeight||200;
  t.style.left=(x+tw>window.innerWidth?e.clientX-tw-10:x)+'px';
  t.style.top=(y+th>window.innerHeight?e.clientY-th-8:y)+'px';
}
document.addEventListener('mousemove',_moveTip);

// ══ DELETE ══
async function delLog(logId,athId,event){
  event?.stopPropagation();
  if(!confirm('Delete this log?'))return;
  try{
    const ref=db.collection('trainlog').doc('athlete_'+athId);
    const snap=await ref.get();if(!snap.exists)return;
    await ref.update({logs:(snap.data().logs||[]).filter(l=>l.id!==logId)});
    athLogs[athId]=(athLogs[athId]||[]).filter(l=>l.id!==logId);
    renderCurrent();
  }catch(e){alert('Error: '+e.message);}
}
