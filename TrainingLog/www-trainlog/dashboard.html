<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrainLog · Coach Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
:root{
  --bg:#0d1117;--bg2:#13151c;--card:#161b22;--border:#21262d;
  --text:#e6edf3;--muted:rgba(230,237,243,.42);--hint:rgba(230,237,243,.18);
  --gold:#f7a94f;--green:#3ecf8e;--red:#e94560;--purple:#a78bfa;--blue:#4f8ef7;
  --sidebar:210px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;height:100vh;overflow:hidden}

/* ── Login ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:18px}
.lg-logo{font-size:50px}.lg-title{font-size:24px;font-weight:800}.lg-sub{font-size:13px;color:var(--muted)}
#google-btn{display:flex;align-items:center;gap:12px;padding:13px 28px;border-radius:12px;background:#fff;color:#222;font-size:14px;font-weight:600;border:none;cursor:pointer;margin-top:6px}
#google-btn:hover{opacity:.9}
#google-btn img{width:20px}
#auth-err{color:var(--red);font-size:12px;display:none}

/* ── App ── */
#app{display:none;height:100vh}
#app.show{display:flex}

/* ── Sidebar ── */
#sidebar{width:var(--sidebar);flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:18px 18px 14px;font-size:15px;font-weight:800;color:var(--gold);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
nav{padding:6px 0;flex:1}
.nb{display:flex;align-items:center;gap:9px;width:100%;padding:9px 16px;background:none;border:none;border-left:3px solid transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;text-align:left;transition:all .12s;font-family:inherit}
.nb:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nb.on{background:rgba(247,169,79,.08);color:var(--gold);border-left-color:var(--gold)}
.nb .ni{font-size:14px;width:18px;flex-shrink:0}
.sb-foot{padding:12px 16px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sb-av{width:28px;height:28px;border-radius:50%;background:var(--border);overflow:hidden;flex-shrink:0}
.sb-av img{width:100%;height:100%;object-fit:cover}
.sb-name{font-size:11px;font-weight:600;color:var(--text)}
.sb-live{font-size:10px;color:var(--green)}
.sb-out{width:100%;padding:6px;border-radius:7px;background:rgba(233,69,96,.1);border:1px solid rgba(233,69,96,.22);color:var(--red);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}

/* ── Week nav in sidebar ── */
.week-nav{padding:10px 16px 6px;border-top:1px solid var(--border);margin-top:6px}
.week-nav-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.week-nav-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wn-btn{padding:4px 10px;border-radius:6px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:14px;cursor:pointer;line-height:1}
.wn-dates{font-size:11px;font-weight:600;color:var(--text);text-align:center;flex:1}
.wn-today{width:100%;margin-top:6px;padding:4px;border-radius:6px;background:rgba(79,142,247,.12);border:1px solid rgba(79,142,247,.28);color:var(--blue);font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;display:none}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{padding:12px 24px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.tb-left .tb-title{font-size:17px;font-weight:800}
.tb-left .tb-sub{font-size:11px;color:var(--muted);margin-top:1px}
.live{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--green);font-weight:700}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Content ── */
#content{flex:1;overflow-y:auto;padding:20px 24px}
.tab{display:none}.tab.on{display:block}

/* ── Loading state ── */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;gap:12px}
.loading-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:var(--muted)}

/* ── Timeline (Übersicht) ── */
.timeline-ath{margin-bottom:28px}
.ath-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ath-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0}
.ath-nm{font-size:15px;font-weight:800}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700}
.ba{background:rgba(79,142,247,.2);color:var(--blue)}
.bb{background:rgba(62,207,142,.2);color:var(--green)}

.tl-grid{display:grid;gap:6px;overflow-x:auto}
.tl-day{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 11px;min-height:110px;display:flex;flex-direction:column;gap:5px;min-width:0}
.tl-day.today{border-color:rgba(79,142,247,.45);background:rgba(79,142,247,.05)}
.tl-day-hdr{font-size:10px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.tl-day-name{color:var(--text)}
.tl-day-date{color:var(--muted)}
.today-tag{font-size:8px;padding:1px 5px;border-radius:3px;background:rgba(79,142,247,.25);color:var(--blue);font-weight:800}
.tl-train{padding:4px 7px;border-radius:6px;margin-bottom:2px}
.tl-train-name{font-size:10px;font-weight:700}
.tl-train-val{font-size:11px;font-weight:800;margin-top:1px}
.tl-train-rpe{font-size:9px;color:var(--muted);margin-top:1px}
.tl-cond{display:flex;gap:6px;align-items:center;padding:3px 0;border-top:1px solid rgba(255,255,255,.05);margin-top:2px;flex-wrap:wrap}
.tl-cond-item{font-size:10px;font-weight:700}
.tl-sore{display:flex;flex-wrap:wrap;gap:2px;padding-top:3px;border-top:1px solid rgba(255,255,255,.05)}
.sore-chip{font-size:9px;font-weight:700;padding:2px 5px;border-radius:8px;white-space:nowrap}
.tl-rest{font-size:10px;color:var(--hint);padding-top:4px}
.tl-plan-badge{font-size:9px;padding:2px 6px;border-radius:4px;display:inline-block;margin-bottom:3px;font-weight:700}

/* ── Load table ── */
.load-table{width:100%;border-collapse:collapse;font-size:12px}
.load-table th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.load-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
.load-table tr:hover td{background:rgba(255,255,255,.02)}
.load-cell{display:flex;flex-direction:column;gap:2px}
.lc-type{font-size:10px;font-weight:700}
.lc-val{font-size:12px;font-weight:800}
.lc-rpe{font-size:10px;color:var(--muted)}
.rest-cell{font-size:10px;color:var(--hint)}

/* ── Soreness heatmap ── */
.heatmap-wrap{overflow-x:auto}
.heatmap{border-collapse:collapse;font-size:11px}
.heatmap th{padding:6px 8px;font-size:10px;font-weight:700;color:var(--muted);text-align:center;white-space:nowrap;border-bottom:1px solid var(--border)}
.heatmap th.part-hdr{text-align:left;min-width:110px}
.heatmap td{padding:4px 6px;text-align:center;border:1px solid rgba(255,255,255,.04)}
.heatmap td.part-label{text-align:left;font-size:11px;color:var(--text);font-weight:600;padding-left:8px;white-space:nowrap}
.hm-cell{width:28px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;min-width:28px}

/* ── Charts ── */
.chart-wrap{position:relative;height:220px}
.chart-sm{position:relative;height:170px}

/* ── Cards / layout ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.card-t{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sh{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px;margin:16px 0 10px}
.sh::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Stat mini ── */
.sm{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;padding:10px 12px;text-align:center}
.sm .sv{font-size:18px;font-weight:800;line-height:1.2}
.sm .sl{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.3px}

/* ── Period / group selector ── */
.sel-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pb{padding:4px 11px;border-radius:7px;font-size:11px;font-weight:600;background:none;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:inherit}
.pb.on{background:rgba(247,169,79,.12);border-color:rgba(247,169,79,.4);color:var(--gold)}
.fsel{padding:6px 10px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:12px;outline:none;cursor:pointer;font-family:inherit}

/* ── Log rows ── */
.lr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}
.lr:last-child{border-bottom:none}
.lr .ld{color:var(--muted);min-width:46px;flex-shrink:0;font-size:11px}
.lr .lt{font-weight:700;min-width:54px;flex-shrink:0}
.lr .lv{flex:1}
.lr .lrpe{color:var(--muted);font-size:10px;flex-shrink:0}
.lr .ldel{padding:1px 6px;border-radius:4px;background:rgba(233,69,96,.1);border:1px solid rgba(233,69,96,.2);color:var(--red);font-size:10px;cursor:pointer;opacity:0;transition:opacity .12s;flex-shrink:0}
.lr:hover .ldel{opacity:1}

/* ── Condition bar ── */
.cb-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.cb-lbl{font-size:10px;color:var(--muted);min-width:52px;flex-shrink:0}
.cb-track{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.cb-fill{height:100%;border-radius:2px}
.cb-val{font-size:10px;font-weight:700;min-width:18px;text-align:right;flex-shrink:0}

/* ── Export tab ── */
.exp-section{margin-bottom:16px}
.exp-btn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 18px;background:rgba(247,169,79,.08);border:1px solid rgba(247,169,79,.25);border-radius:10px;color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;transition:all .12s}
.exp-btn:hover{background:rgba(247,169,79,.14);border-color:rgba(247,169,79,.45)}
.exp-btn .exp-icon{font-size:20px;width:28px;flex-shrink:0}
.exp-btn .exp-desc{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.exp-btn-blue{background:rgba(79,142,247,.08);border-color:rgba(79,142,247,.25);color:var(--blue)}
.exp-btn-blue:hover{background:rgba(79,142,247,.14);border-color:rgba(79,142,247,.45)}
.exp-btn-green{background:rgba(62,207,142,.08);border-color:rgba(62,207,142,.25);color:var(--green)}
.exp-btn-green:hover{background:rgba(62,207,142,.14);border-color:rgba(62,207,142,.45)}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

/* ── Empty / loading ── */
.empty{color:var(--muted);font-size:12px;padding:24px;text-align:center}
.loading{color:var(--muted);font-size:13px;padding:36px;text-align:center}

@media(max-width:900px){.g2{grid-template-columns:1fr}#sidebar{width:180px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="lg-logo">🏋️</div>
  <div class="lg-title">TrainLog Coach</div>
  <div class="lg-sub">Bayern Skeleton · Coach Dashboard</div>
  <button id="google-btn" onclick="doLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
    Mit Google anmelden
  </button>
  <div id="auth-err"></div>
</div>

<!-- APP -->
<div id="app">
  <aside id="sidebar">
    <div class="sb-logo"><span style="font-size:20px">🏋️</span>TrainLog</div>
    <nav>
      <button class="nb on" onclick="switchTab('overview',this)"><span class="ni">📋</span>Overview</button>
      <button class="nb" onclick="switchTab('load',this)"><span class="ni">📊</span>Load</button>
      <button class="nb" onclick="switchTab('soreness',this)"><span class="ni">🔴</span>Soreness</button>
      <button class="nb" onclick="switchTab('condition',this)"><span class="ni">😴</span>Condition</button>
      <button class="nb" onclick="switchTab('athletes',this)"><span class="ni">👥</span>Athletes</button>
      <button class="nb" onclick="switchTab('export',this)"><span class="ni">⬇️</span>Export</button>
    </nav>
    <!-- Week navigation -->
    <div class="week-nav">
      <div class="week-nav-label">Week · Woche</div>
      <div class="week-nav-row">
        <button class="wn-btn" onclick="shiftWeek(-1)">‹</button>
        <div class="wn-dates" id="wn-dates">—</div>
        <button class="wn-btn" onclick="shiftWeek(1)">›</button>
      </div>
      <button class="wn-today" id="wn-today-btn" onclick="shiftWeek(0,true)">← This Week</button>
    </div>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="sb-av"><img id="user-photo" src="" alt=""></div>
        <div>
          <div class="sb-name" id="user-name">—</div>
          <div class="sb-live">● Live sync</div>
        </div>
      </div>
      <button class="sb-out" onclick="firebase.auth().signOut()">Sign out</button>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="tb-left">
        <div class="tb-title" id="tb-title">Overview</div>
        <div class="tb-sub" id="tb-sub"></div>
      </div>
      <div class="live"><div class="live-dot"></div>Live</div>
    </div>
    <div id="content">
      <div class="tab on" id="tab-overview"></div>
      <div class="tab" id="tab-load"></div>
      <div class="tab" id="tab-soreness"></div>
      <div class="tab" id="tab-condition"></div>
      <div class="tab" id="tab-athletes"></div>
      <div class="tab" id="tab-export"></div>
    </div>
  </div>
</div>

<script>
// ══ FIREBASE ══
firebase.initializeApp({apiKey:"AIzaSyBF_F7ANEj4n9E5O5-x9YWn9mOBunl8Ze8",authDomain:"traininglogskeleton.firebaseapp.com",projectId:"traininglogskeleton",storageBucket:"traininglogskeleton.firebasestorage.app",messagingSenderId:"467243804287",appId:"1:467243804287:web:8808291abb44de59b7c1a4"});
const db=firebase.firestore(), auth=firebase.auth();
const ALLOWED='jaemyung1287@gmail.com';

// ══ STATE ══
let coachData=null, athLogs={}, unsubs=[], athUnsubs=[], curTab='overview';
let weekOffset=0, loadPeriod=7, loadAth=null, condAth=null, soreAth=null;
let overviewFilter='all'; // 'all' | 'A' | 'B' | athlete name
const charts={};

// ══ AUTH ══
function doLogin(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{showErr(e.message)});}
function showErr(m){const el=document.getElementById('auth-err');el.textContent=m;el.style.display='block';}

auth.onAuthStateChanged(u=>{
  if(u){
    if(u.email!==ALLOWED){auth.signOut();showErr('No access: '+u.email);return;}
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').classList.add('show');
    document.getElementById('user-name').textContent=u.displayName||u.email;
    if(u.photoURL)document.getElementById('user-photo').src=u.photoURL;
    startListen();
  }else{
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app').classList.remove('show');
    unsubs.forEach(u=>u());athUnsubs.forEach(u=>u());unsubs=[];athUnsubs=[];
  }
});

// ══ LISTENERS ══
function startListen(){
  unsubs.forEach(u=>u());unsubs=[];
  // Show loading state on current tab while Firebase loads
  showTabLoading();
  unsubs.push(db.collection('trainlog').doc('coach').onSnapshot(snap=>{
    if(!snap.exists){renderCurrent();return;}
    const prev=coachData; coachData=snap.data();
    if(!loadAth&&coachData.athletes?.length){loadAth=coachData.athletes[0].name;condAth=loadAth;soreAth=loadAth;}
    const ids=(coachData.athletes||[]).map(a=>a.id).filter(Boolean);
    const prevIds=(prev?.athletes||[]).map(a=>a.id).filter(Boolean);
    if(JSON.stringify(ids)!==JSON.stringify(prevIds)){
      setupAthListeners(ids);
      // Fallback: render after 1.5s even if athlete snapshots haven't fired
      setTimeout(renderCurrent, 1500);
    } else {
      renderCurrent();
    }
  }));
}

function showTabLoading(){
  const wrap=document.getElementById('tab-'+curTab);
  if(wrap&&!wrap.innerHTML.trim()){
    wrap.innerHTML=`<div class="loading-state"><div class="loading-spinner"></div><div class="loading-text">데이터 불러오는 중…</div></div>`;
  }
}

function setupAthListeners(ids){
  athUnsubs.forEach(u=>u());athUnsubs=[];
  if(!ids.length){renderCurrent();return;}
  ids.forEach(id=>{
    athUnsubs.push(db.collection('trainlog').doc('athlete_'+id).onSnapshot(snap=>{
      athLogs[id]=snap.exists?(snap.data().logs||[]):[];
      renderCurrent();
    },err=>{
      // Permission denied or other error — still render with available data
      console.warn('[dashboard] athlete snapshot error:',id,err);
      renderCurrent();
    }));
  });
}

// ══ HELPERS ══
function todayStr(){const d=new Date();return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function p2(n){return String(n).padStart(2,'0');}
function dsFromDate(d){return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function getLast(n){const a=[];for(let i=0;i<n;i++){const d=new Date();d.setDate(d.getDate()-i);a.push(dsFromDate(d));}return a;}
function getWeekDates(off=0){
  const now=new Date(),dow=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1)+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return{ds:dsFromDate(d),d};});
}
function fmt(ds){if(!ds)return'—';const p=ds.split('-');return`${p[2]}.${p[1]}.`;}
function fmtFull(ds){if(!ds)return'—';const p=ds.split('-');return`${p[2]}.${p[1]}.${p[0]}`;}
function fmtShort(dt){return`${dt.toLocaleString('de',{month:'short'})} ${dt.getDate()}`;}
function getLogsByName(name){
  const ath=(coachData?.athletes||[]).find(a=>a.name===name);
  if(ath?.id&&athLogs[ath.id])return athLogs[ath.id];
  for(const[,logs]of Object.entries(athLogs)){if(logs.some(l=>l.athleteName===name))return logs;}
  return[];
}
function getAllLogs(){return Object.values(athLogs).flat();}
function vol(logs){
  return logs.filter(l=>l.type==='weight'||l.type==='plyo').reduce((s,log)=>s+(log.exercises||[]).reduce((ss,e)=>{
    if(e.isBodyweight)return ss;
    if(e.setRows?.length)return ss+e.setRows.reduce((r,sr)=>r+(parseFloat(sr.kg)||0)*(parseFloat(sr.reps)||0),0);
    return ss+(parseFloat(e.weight)||0)*(parseInt(e.sets)||0)*(parseInt(e.reps)||0);
  },0),0);
}
function iCol(v,hg){
  if(v==null)return'var(--muted)';
  if(hg)return v>=7?'var(--green)':v>=4?'var(--gold)':'var(--red)';
  return v>=7?'var(--red)':v>=4?'var(--gold)':'var(--green)';
}
function tc(t){return{weight:'#f7a94f',sprint:'#3ecf8e',plyo:'#f7a94f',condition:'#a78bfa',tabata:'#e94560'}[t]||'var(--muted)';}
function planGrp(plan,ath){if(!plan)return null;return plan.groups?.[ath.group]||(!plan.groups?plan:null);}
function sessExs(gd,s){if(!gd)return[];if(gd[s]?.exercises)return gd[s].exercises;if(s==='am'&&gd.exercises)return gd.exercises;return[];}
function killChart(id){if(charts[id]){charts[id].destroy();delete charts[id];}}

// ══ WEEK NAV ══
function shiftWeek(delta,reset=false){
  if(reset)weekOffset=0;else weekOffset+=delta;
  updateWeekLabel();renderCurrent();
}
function updateWeekLabel(){
  const wk=getWeekDates(weekOffset);
  const mon=wk[0].d,sun=wk[6].d;
  document.getElementById('wn-dates').textContent=`${fmtShort(mon)} – ${fmtShort(sun)}`;
  const btn=document.getElementById('wn-today-btn');
  if(btn)btn.style.display=weekOffset!==0?'block':'none';
}

// ══ NAV ══
const TITLES={overview:'Overview · Woche',load:'Training Load',soreness:'Soreness Heatmap',condition:'Condition Trend',athletes:'Athletes · Detail',export:'Export & Download'};
function switchTab(id,btn){
  curTab=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('tab-'+id).classList.add('on');
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  if(btn)btn.classList.add('on');
  document.getElementById('tb-title').textContent=TITLES[id]||id;
  if(!coachData){showTabLoading();return;}
  renderCurrent();
}
function renderCurrent(){
  if(!coachData)return;
  updateWeekLabel();
  if(curTab==='overview')renderOverview();
  else if(curTab==='load')renderLoad();
  else if(curTab==='soreness')renderSoreness();
  else if(curTab==='condition')renderCondition();
  else if(curTab==='athletes')renderAthletes();
  else if(curTab==='export')renderExport();
}

function setOverviewFilter(f){overviewFilter=f;renderOverview();}

function renderOverview(){
  const wrap=document.getElementById('tab-overview');
  const wk=getWeekDates(weekOffset);
  const today=todayStr();
  const mon=wk[0].d,sun=wk[6].d;
  document.getElementById('tb-sub').textContent=`${fmtShort(mon)} – ${fmtShort(sun)}`;

  const allAthletes=coachData.athletes||[];
  if(!allAthletes.length){wrap.innerHTML='<div class="empty">Keine Athleten</div>';return;}

  // ── Filter bar ──
  const groups=[...new Set(allAthletes.map(a=>a.group))].sort();
  const isGrp=f=>f==='A'||f==='B';
  const isAth=f=>f!=='all'&&!isGrp(f);

  let filterBar=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap">`;
  // Group buttons
  filterBar+=`<button class="pb ${overviewFilter==='all'?'on':''}" onclick="setOverviewFilter('all')">전체 선수</button>`;
  groups.forEach(g=>{
    filterBar+=`<button class="pb ${overviewFilter===g?'on':''}" onclick="setOverviewFilter('${g}')">Group ${g}</button>`;
  });
  // Divider
  filterBar+=`<span style="width:1px;height:18px;background:var(--border);margin:0 4px;flex-shrink:0"></span>`;
  // Individual athlete buttons
  allAthletes.forEach(a=>{
    const short=a.name.split(' ').map((p,i)=>i===0?p:p[0]+'.').join(' ');
    filterBar+=`<button class="pb ${overviewFilter===a.name?'on':''}" onclick="setOverviewFilter('${a.name.replace(/'/g,"\\'")}')">
      <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${a.group==='A'?'rgba(79,142,247,.5)':'rgba(62,207,142,.5)'};margin-right:4px;vertical-align:middle"></span>${short}
    </button>`;
  });
  filterBar+=`</div>`;

  // ── Filtered athletes ──
  let athletes;
  if(overviewFilter==='all') athletes=allAthletes;
  else if(isGrp(overviewFilter)) athletes=allAthletes.filter(a=>a.group===overviewFilter);
  else athletes=allAthletes.filter(a=>a.name===overviewFilter);

  const DN_DE=['Mo','Di','Mi','Do','Fr','Sa','So'];
  const DN_EN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const isSingle=athletes.length===1;

  let html=filterBar;
  athletes.forEach(ath=>{
    const logs=getLogsByName(ath.name);

    html+=`<div class="timeline-ath">
      <div class="ath-hdr">
        <div class="ath-av" style="background:${ath.group==='A'?'rgba(79,142,247,.2)':'rgba(62,207,142,.2)'}">${ath.name[0]}</div>
        <div>
          <div class="ath-nm">${ath.name}</div>
          <span class="badge b${ath.group.toLowerCase()}">Group ${ath.group}</span>
          ${ath.dob?`<span style="font-size:10px;color:var(--muted);margin-left:6px">${ath.dob}</span>`:''}
        </div>
      </div>
      <div class="tl-grid" style="grid-template-columns:repeat(7,minmax(${isSingle?'150':'120'}px,1fr))">`;

    wk.forEach(({ds,d},i)=>{
      const isToday=ds===today;
      const dayLogs=logs.filter(l=>l.date===ds);
      const trainLogs=dayLogs.filter(l=>l.type!=='condition');
      const condLog=dayLogs.find(l=>l.type==='condition');
      const plan=coachData.sessionPlans?.[ds];
      const gd=planGrp(plan,ath);
      const amExs=sessExs(gd,'am'); const pmExs=sessExs(gd,'pm');
      const hasPlan=amExs.length>0||pmExs.length>0;

      html+=`<div class="tl-day ${isToday?'today':''}" style="${isSingle?'min-height:130px':''}">
        <div class="tl-day-hdr">
          <span class="tl-day-name">${DN_DE[i]}·${DN_EN[i]}</span>
          <span class="tl-day-date">${d.getDate()}.${d.getMonth()+1}.${isToday?'&nbsp;<span class="today-tag">TODAY</span>':''}</span>
        </div>`;

      if(hasPlan&&!trainLogs.length){
        const planExCount=amExs.length+pmExs.length;
        html+=`<div class="tl-plan-badge" style="background:rgba(79,142,247,.12);color:var(--blue);border:1px solid rgba(79,142,247,.25)">📋 Plan: ${planExCount}개</div>`;
      }

      if(trainLogs.length){
        trainLogs.forEach(l=>{
          const c=tc(l.type);
          const val=l.type==='weight'?`${(l.totalVolume||0).toLocaleString()} kg`
            :l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()} m`
            :l.type==='plyo'?`${l.totalReps||0} reps`
            :l.type==='tabata'?'8 rounds':'—';
          html+=`<div class="tl-train" style="background:${c}18;border:1px solid ${c}33">
            <div class="tl-train-name" style="color:${c}">${l.type==='weight'?'Weight':l.type==='sprint'?'Sprint':l.type==='plyo'?'Plyo':l.type==='tabata'?'Tabata':l.type}</div>
            <div class="tl-train-val" style="color:${c}">${val}</div>
            ${l.rpe?`<div class="tl-train-rpe">RPE ${l.rpe}</div>`:''}
          </div>`;
        });
      } else if(!hasPlan){
        html+=`<div class="tl-rest">Rest</div>`;
      }

      if(condLog){
        const fc=iCol(condLog.fatigue,false), mc=iCol(condLog.mood,true);
        html+=`<div class="tl-cond">
          <span class="tl-cond-item">😴 ${condLog.sleepHours||'—'}h</span>
          <span class="tl-cond-item" style="color:${fc}">⚡${condLog.fatigue||'—'}</span>
          <span class="tl-cond-item" style="color:${mc}">😊${condLog.mood||'—'}</span>
        </div>`;
      }

      if(condLog&&(condLog.soreness||[]).length){
        html+=`<div class="tl-sore">`;
        condLog.soreness.forEach(s=>{
          const n=s.intensity;
          const c=n>=7?'var(--red)':n>=4?'var(--gold)':'var(--green)';
          html+=`<span class="sore-chip" style="background:${c}22;border:1px solid ${c}44;color:${c}">${s.part} ${s.intensity}</span>`;
        });
        html+=`</div>`;
      }

      html+=`</div>`;
    });

    html+=`</div></div>`;
  });

  wrap.innerHTML=html||'<div class="empty">Keine Daten</div>';
}

function buildBarChart(id,dates,data,bg,border){
  killChart(id);
  const c=document.getElementById('ch-'+id);if(!c)return;
  charts[id]=new Chart(c,{type:'bar',data:{labels:dates.map(d=>fmt(d)),datasets:[{data,backgroundColor:bg,borderColor:border,borderWidth:1,borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(230,237,243,.3)',font:{size:9},maxTicksLimit:14}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'rgba(230,237,243,.3)',font:{size:9}},beginAtZero:true}}}});
}

const BODY_PARTS=['Neck','Shoulder','Chest','Back','Lower Back','Abs','Oblique','Hip','Quad','Glute','Hamstring','Adductor','Calf','Ankle','Foot','Arm'];

function renderSoreness(){
  const wrap=document.getElementById('tab-soreness');
  const athletes=coachData.athletes||[];
  if(!athletes.length){wrap.innerHTML='<div class="empty">Keine Athleten</div>';return;}
  if(!soreAth)soreAth=athletes[0].name;
  document.getElementById('tb-sub').textContent=soreAth+' · last 14 days';

  const athOpts=athletes.map(a=>`<option value="${a.name}" ${soreAth===a.name?'selected':''}>${a.name}</option>`).join('');
  const dates=getLast(14).reverse();
  const logs=getLogsByName(soreAth);

  const map={};
  logs.filter(l=>l.type==='condition'&&(l.soreness||[]).length).forEach(l=>{
    if(!dates.includes(l.date))return;
    if(!map[l.date])map[l.date]={};
    (l.soreness||[]).forEach(s=>{ if(!map[l.date][s.part]||map[l.date][s.part]<s.intensity) map[l.date][s.part]=s.intensity; });
  });

  let tableHtml=`<div class="sel-bar"><select class="fsel" onchange="soreAth=this.value;renderSoreness()">${athOpts}</select></div>
    <div class="card"><div class="card-t">🔴 Soreness Heatmap<span style="font-size:10px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">
      &nbsp;&nbsp;<span style="color:var(--green)">●</span> mild (1–3)
      &nbsp;<span style="color:var(--gold)">●</span> moderate (4–6)
      &nbsp;<span style="color:var(--red)">●</span> severe (7–10)
    </span></div>
    <div class="heatmap-wrap"><table class="heatmap">
      <tr><th class="part-hdr">Body Part</th>${dates.map(d=>`<th>${fmt(d)}</th>`).join('')}</tr>`;

  BODY_PARTS.forEach(part=>{
    const hasData=dates.some(d=>map[d]?.[part]);
    tableHtml+=`<tr ${!hasData?'style="opacity:.35"':''}><td class="part-label">${part}</td>`;
    dates.forEach(d=>{
      const v=map[d]?.[part];
      if(!v){tableHtml+=`<td></td>`;return;}
      const c=v>=7?'233,69,96':v>=4?'247,169,79':'62,207,142';
      const alpha=0.15+((v-1)/9)*0.6;
      tableHtml+=`<td><div class="hm-cell" style="background:rgba(${c},${alpha.toFixed(2)});color:rgba(${c},1);width:100%">${v}</div></td>`;
    });
    tableHtml+=`</tr>`;
  });

  tableHtml+=`</table></div></div>`;
  wrap.innerHTML=tableHtml;
}

function cBar2(label,val,max,hg){
  if(val==null)return`<div class="cb-row"><span class="cb-lbl">${label}</span><span style="font-size:11px;color:var(--hint)">—</span></div>`;
  const pct=Math.min(100,Math.round((val/max)*100));
  const c=iCol(parseFloat(val),hg);
  return`<div class="cb-row"><span class="cb-lbl">${label}</span><div class="cb-track"><div class="cb-fill" style="width:${pct}%;background:${c}"></div></div><span class="cb-val" style="color:${c}">${val}</span></div>`;
}

// ── 주간 리포트 (PDF) ──
function genWeeklyReport(){
  const athletes=coachData?.athletes||[];
  const wk=getWeekDates(weekOffset);
  const mon=wk[0].d, sun=wk[6].d;
  const DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const today=todayStr();

  let rows='';
  athletes.forEach(ath=>{
    const logs=getLogsByName(ath.name);
    let weekVol=0, weekDist=0, sessCount=0;

    const dayCells=wk.map(({ds},i)=>{
      const dayLogs=logs.filter(l=>l.date===ds);
      const trains=dayLogs.filter(l=>l.type!=='condition');
      const cond=dayLogs.find(l=>l.type==='condition');
      const isToday=ds===today;
      let cell=`<td style="padding:8px 6px;border:1px solid #e2e8f0;vertical-align:top;min-width:80px;${isToday?'background:#fffbeb':''}">`;
      if(!trains.length&&!cond){cell+='<span style="color:#94a3b8;font-size:10px">—</span>';}
      trains.forEach(l=>{
        const typeColors={weight:'#f59e0b',sprint:'#10b981',plyo:'#8b5cf6',tabata:'#ef4444'};
        const c=typeColors[l.type]||'#64748b';
        const val=l.type==='weight'?`${(l.totalVolume||0).toLocaleString()}kg`
          :l.type==='sprint'?`${(l.totalDistance||0).toLocaleString()}m`
          :l.type==='plyo'?`${l.totalReps||0}r`:'—';
        if(l.type==='weight'||l.type==='plyo')weekVol+=vol([l]);
        if(l.type==='sprint')weekDist+=(l.totalDistance||0);
        sessCount++;
        cell+=`<div style="font-size:10px;font-weight:700;color:${c}">${l.type==='weight'?'W':l.type==='sprint'?'S':l.type==='plyo'?'P':'T'} ${val}</div>`;
        if(l.rpe)cell+=`<div style="font-size:9px;color:#64748b">RPE ${l.rpe}</div>`;

<style>

</style>
</head><body>
<h1>🏋️ Bayern Skeleton TrainLog</h1>
<div class="sub">📅 Weekly Report &nbsp;·&nbsp; ${fmtFull(mon)} ~ ${fmtFull(sun)} &nbsp;·&nbsp; 출력일: ${fmtFull(todayStr())}</div>

// ── CSV 다운로드 ──
function downloadCSV(type='all'){
  const athletes=coachData?.athletes||[];
  let rows=[], filename='';

  if(type==='condition'){
    filename=`trainlog_condition_${todayStr()}.csv`;
    rows.push(['날짜','선수','그룹','수면시간','수면질','피로도','기분','근육통']);
    athletes.forEach(ath=>{
      const logs=getLogsByName(ath.name).filter(l=>l.type==='condition').sort((a,b)=>a.date.localeCompare(b.date));
      logs.forEach(l=>{
        const sore=(l.soreness||[]).map(s=>s.part+'('+s.intensity+')').join(' / ');
        rows.push([l.date,ath.name,ath.group,l.sleepHours||'',l.sleepQuality||'',l.fatigue||'',l.mood||'',sore]);
      });
    });
  } else {
    filename=`trainlog_training_${todayStr()}.csv`;
    rows.push(['날짜','선수','그룹','종류','볼륨(kg)','거리(m)','총_렙','RPE','Phase','Week','메모']);
    athletes.forEach(ath=>{
      const logs=getLogsByName(ath.name).filter(l=>l.type!=='condition').sort((a,b)=>a.date.localeCompare(b.date));
      logs.forEach(l=>{
        const wv=l.type==='weight'?(l.totalVolume||vol([l])):0;
        const dist=l.type==='sprint'?(l.totalDistance||0):0;
        const reps=l.type==='plyo'?(l.totalReps||0):0;
        rows.push([l.date,ath.name,ath.group,l.type,wv||'',dist||'',reps||'',l.rpe||'',l.phase||'',l.week||'',l.notes||'']);
      });
    });
  }

  const bom='﻿'; // UTF-8 BOM for Excel
  const csv=bom+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

// ── JSON 백업 다운로드 ──
function downloadJSON(){
  const athletes=coachData?.athletes||[];
  const data={
    exportedAt:new Date().toISOString(),
    athletes:athletes.map(ath=>({
      ...ath,
      logs:getLogsByName(ath.name)
    }))
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`trainlog_backup_${todayStr()}.json`;a.click();
  URL.revokeObjectURL(url);
}

// ══ DELETE LOG ══
async function delLog(logId,athId,event){
  event?.stopPropagation();
  if(!confirm('Delete this log?'))return;
  try{
    const ref=db.collection('trainlog').doc('athlete_'+athId);
    const snap=await ref.get();if(!snap.exists)return;
    const newLogs=(snap.data().logs||[]).filter(l=>l.id!==logId);
    await ref.update({logs:newLogs});
    athLogs[athId]=(athLogs[athId]||[]).filter(l=>l.id!==logId);
    renderCurrent();
  }catch(e){alert('Fehler: '+e.message);}
}

// ══ INIT ══
updateWeekLabel();
document.getElementById('tb-sub').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
</script>
