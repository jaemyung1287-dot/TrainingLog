        </span>
        <button class="m-btn ghost" title="지난 기록 보기/숨기기" style="padding:4px;${e._showPrev?'background:rgba(198,168,90,.15);border:1px solid rgba(198,168,90,.4);border-radius:7px;color:#c6a85a':''}" onclick="_pe.exs[${i}]._showPrev=!_pe.exs[${i}]._showPrev;_renderPlanEditor()">📈</button>
        <button class="m-btn ghost" style="padding:4px" onclick="_pe.exs.splice(${i},1);_renderPlanEditor()">✕</button>
      </div>
      <div class="pe-opts">
        <span class="pe-olbl">훈련 모드</span>
        ${_modeChip(i,'isBW','BW','#3ecf8e')}${_modeChip(i,'isSL','SL','#4f8ef7')}${_modeChip(i,'isSA','SA','#a78bfa')}
        <span class="pe-osep"></span>
        <span class="pe-olbl">Rest</span>
        <span style="font-size:10px;color:var(--muted)">S</span>
        <input class="m-in" type="number" placeholder="—" style="width:50px;padding:5px 6px" value="${_esc(e.restS)}" oninput="_pe.exs[${i}].restS=this.value">${_unitSeg(i,'restSU',e.restSU)}
        <span style="font-size:10px;color:var(--muted)">R</span>
        <input class="m-in" type="number" placeholder="—" style="width:50px;padding:5px 6px" value="${_esc(e.restR)}" oninput="_pe.exs[${i}].restR=this.value">${_unitSeg(i,'restRU',e.restRU)}
        <span class="pe-osep"></span>
        <select class="m-in" style="width:150px;padding:5px 6px;font-size:11px" onchange="_pe.exs[${i}].ctype=this.value;_renderPlanEditor()">${ctypeOpts}</select>
        ${cvalField}
        ${esysField}
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
        <span style="font-size:9px;font-weight:700;color:rgba(255,60,60,.7);letter-spacing:.3px;flex-shrink:0">▶ YT</span>
        <input type="url" class="m-in" placeholder="영상 링크" value="${_esc(e.yt)}"
          style="flex:1;min-width:0;padding:5px 9px;font-size:11px;border-color:rgba(255,60,60,.2)"
          onchange="_pe.exs[${i}].yt=this.value;_renderPlanEditor()">
        ${e.yt?`<a href="${_esc(e.yt)}" target="_blank" style="flex-shrink:0;padding:4px 10px;border-radius:8px;background:rgba(255,0,0,.15);border:1px solid rgba(255,0,0,.3);color:#ff4444;font-size:11px;font-weight:800;text-decoration:none">▶</a>`:''}
        <span style="font-size:9px;font-weight:700;color:rgba(198,168,90,.8);letter-spacing:.3px;flex-shrink:0;margin-left:4px">💬</span>
        <input class="m-in" placeholder="코치 코멘트 (선수 화면에 표시)" value="${_esc(e.cmt)}"
          style="flex:1;min-width:0;padding:5px 9px;font-size:11px;border-color:rgba(198,168,90,.25)"
          oninput="_pe.exs[${i}].cmt=this.value">
      </div>
      ${e._showPrev&&e.name&&e.name.trim()?_pePrevPanel(e.name):''}
    </div>`;
  }).join('');

  _mkModal(`
    <div class="modal-hd">
      <div class="modal-title">📝 Session Plan · ${fmtFull(_pe.day)} (${wd})</div>
      <button class="m-btn ghost" onclick="_tryCloseModal()">✕</button>
    </div>
    <div class="modal-bd">
      ${dl}
      <div style="margin-bottom:12px">
        <span class="m-lbl">Target — 여러 명 선택 가능 (선택된 전원에게 동일 플랜 저장)</span>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px">${grpChips}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">${athChips}</div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
        <div><span class="m-lbl">Session</span>
          <button class="m-btn" style="${_pe.sess==='am'?'background:rgba(247,169,79,.15);border-color:rgba(247,169,79,.5);color:#f7a94f':''}" onclick="_peSwitch('sess','am')">🌅 AM</button>
          <button class="m-btn" style="${_pe.sess==='pm'?'background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.5);color:#a78bfa':''}" onclick="_peSwitch('sess','pm')">🌇 PM</button>
        </div>

      ${(()=>{ const srcs=_peCopySources(); if(!srcs.length) return '';
        const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const opts=srcs.map(s=>{
          const dt=new Date(s.day+'T12:00:00'); const wd=isNaN(dt)?'':dn[dt.getDay()];
          return `<option value='${JSON.stringify([s.day,s.key,s.sess]).replace(/'/g,"&#39;")}'>${s.day.slice(5).replace('-','.')} ${wd} · ${_esc(s.label)} · ${s.sess.toUpperCase()} (${s.n})</option>`;
        }).join('');
        return `<div style="margin-bottom:12px"><span class="m-lbl">📋 Copy from existing session</span>
          <select class="m-in" style="width:100%" onchange="_peCopyFrom(this.value);this.value=''">
            <option value="">— select a session to copy —</option>${opts}
          </select></div>`; })()}
      ${(()=>{
        const mode=_pe.warmupMode==='detail'?'detail':'text';
        const items=Array.isArray(_pe.warmupItems)?_pe.warmupItems:[];
        const tb=(m,l)=>`<button class="m-btn" style="${mode===m?'background:rgba(247,169,79,.15);border-color:rgba(247,169,79,.5);color:#f7a94f':''}" onclick="_peWuMode('${m}')">${l}</button>`;
        let h=`<div style="margin-bottom:12px"><span class="m-lbl">🔆 Warm-up</span>
          <div style="display:flex;gap:6px;margin:4px 0 8px">${tb('text','Text')}${tb('detail','Detailed')}</div>`;
        if(mode==='text'){
          h+=`<textarea class="m-in" style="width:100%;min-height:48px;resize:vertical" placeholder="e.g. 10 min dynamic stretching…" oninput="_pe.warmup=this.value">${_esc(_pe.warmup||'')}</textarea>`;
        } else {
          items.forEach((it,idx)=>{ it=it||{};
            h+=`<div style="border:1px solid var(--border);border-radius:10px;padding:9px;margin-bottom:8px;background:rgba(255,255,255,.02)">
              <div style="display:flex;gap:6px;margin-bottom:6px">
                <input class="m-in" style="flex:1" value="${_esc(it.name||'')}" placeholder="Exercise (e.g. A-Skip)" oninput="_peWuUpd(${idx},'name',this.value)">

              <input class="m-in" style="width:100%" value="${_esc(it.comment||'')}" placeholder="Comment (optional)" oninput="_peWuUpd(${idx},'comment',this.value)">
            </div>`;
          });
          h+=`<button class="m-btn" style="width:100%;border-style:dashed" onclick="_peWuAdd()">＋ Add warm-up item</button>`;
        }
        return h+`</div>`;
      })()}
      <div class="pe-row" style="margin-bottom:6px;grid-template-columns:${gridCols};padding:0 11px">
        <span class="pe-hdr">Exercise</span><span class="pe-hdr">Category</span><span class="pe-hdr">Int%</span>${hasSprint?'<span class="pe-hdr">Dist</span>':''}<span class="pe-hdr">Sets</span><span class="pe-hdr">Reps</span><span class="pe-hdr">Order</span><span></span><span></span>
      </div>
      ${rows||''}
      <button class="m-btn" style="width:100%;margin-top:4px;border-style:dashed" onclick="_pe.exs.push(_peNewRow());_renderPlanEditor()">＋ Add exercise</button>
    </div>
    <div class="modal-ft">
      <button class="m-btn del" onclick="clearPlanSess()">🗑 Clear session</button>
      <span style="flex:1"></span>
      <button class="m-btn" onclick="_tryCloseModal()">Cancel</button>
      <button class="m-btn save" onclick="savePlanEditor()">💾 Save plan${_pe.keys.size>1?` (${_pe.keys.size} targets)`:''}</button>
    </div>`,true);
  _modalGuard=()=>_pe&&_pe._sig0!==undefined&&_peSig()!==_pe._sig0;
}
// ── Previous performance per athlete (플랜 짤 때 지난 기록 참고) ──
function _peTargetAths(){
  const aths=coachData?.athletes||[];
  const out=[];const seen=new Set();
  [..._pe.keys].forEach(k=>{
    let list=[];
    if(k==='all')list=aths;
    else if(k==='A'||k==='B')list=aths.filter(a=>a.group===k);
    else if(k.startsWith('ath_')){const a=aths.find(x=>'ath_'+x.id===k);if(a)list=[a];}
    list.forEach(a=>{if(!seen.has(a.id)){seen.add(a.id);out.push(a);}});
  });
  return out;
}
function _dashPrevPerf(a,exName,beforeDay){
  // weight/plyo: latest log of same exercise
  const wl=(athLogs[a.id]||[])
    .filter(l=>(l.type==='weight'||l.type==='plyo')&&l.date<beforeDay&&(l.exercises||[]).some(e=>e.name===exName))
    .sort((x,y)=>y.date.localeCompare(x.date));
  if(wl.length){
    const e=wl[0].exercises.find(x=>x.name===exName);
    let det;
    if(e.setRows&&e.setRows.length)det=e.setRows.map(r=>`${e.isBodyweight?('BW'+(r.extraKg?'+'+r.extraKg:'')):(r.kg||'—')}×${r.reps||'—'}`).join(' · ');
    else det=`${e.isBodyweight?'BW':(e.weight||'—')+'kg'} ${e.sets||'—'}×${e.reps||'—'}`;
    return {date:wl[0].date,det};
  }
  // sprint: latest set with same name
  const sl=(athLogs[a.id]||[]).filter(l=>l.type==='sprint'&&l.date<beforeDay).sort((x,y)=>y.date.localeCompare(x.date));
  for(const l of sl){
    const st=(l.sets||[]).find(s=>s.name===exName);
    if(st){
      const parts=[];
      if(st.actualTime)parts.push('best '+st.actualTime+'s');
      const laps=(st.repTimes||[]).filter(t=>t!=null);
      if(laps.length)parts.push('laps '+laps.join('/'));
      if(!parts.length&&st.distance)parts.push(st.distance+'m ×'+(st.sets||1)+'×'+(st.reps||1));
      return {date:l.date,det:parts.join(' · ')};
    }
  }
  return null;
}
// Vertical previous-performance panel — opened per exercise via the 📈 toggle
function _pePrevPanel(exName){
  const aths=_peTargetAths();
  const withRec=[],noRec=[];
  aths.forEach(a=>{
    const p=_dashPrevPerf(a,exName.trim(),_pe.day);
    if(p)withRec.push({a,p});else noRec.push(a);
  });
  if(!withRec.length)
    return `<div style="margin-top:7px;padding:8px 12px;background:rgba(198,168,90,.05);border:1px solid rgba(198,168,90,.15);border-radius:8px;font-size:11px;color:var(--muted)">📈 선택된 선수들의 이전 기록 없음</div>`;
  const rows=withRec.map(({a,p})=>`<tr>
    <td style="padding:3px 0;width:92px;font-weight:700;color:${a.group==='A'?'#58a6ff':'#3ecf8e'};white-space:nowrap">${_esc(a.name.split(' ')[0])}</td>
    <td style="padding:3px 6px;color:rgba(198,168,90,.95)">${_esc(p.det)}</td>
    <td style="padding:3px 0;text-align:right;color:var(--hint);white-space:nowrap;width:46px">${p.date.slice(5).replace('-','.')}</td>
  </tr>`).join('');
  const noRow=noRec.length?`<tr><td colspan="3" style="padding:4px 0;color:var(--hint);font-size:10px">${_esc(noRec.map(a=>a.name.split(' ')[0]).join(', '))} — 기록 없음</td></tr>`:'';
  return `<div style="margin-top:7px;padding:8px 12px;background:rgba(198,168,90,.05);border:1px solid rgba(198,168,90,.15);border-radius:8px">
    <table style="width:100%;border-collapse:collapse;font-size:11px">${rows}${noRow}</table>
  </div>`;
}
function _peName(i,val){
  _pe.exs[i].name=val;
  const sub=EX2SUB[val];
  if(sub)_pe.exs[i].sub=sub;
  else if(val&&val.trim()&&!_pe.exs[i].sub)_pe.exs[i].sub='Other'; // 새 운동 → 미분류 (앱과 동일하게 자유 추가)
  _renderPlanEditor();
}
function _peMove(i,dir){
  const j=i+dir;
  if(j<0||j>=_pe.exs.length)return;
  const t=_pe.exs[i];_pe.exs[i]=_pe.exs[j];_pe.exs[j]=t;
  _renderPlanEditor();
}
function _peBuildSession(){
  const exercises=_pe.exs.filter(e=>e.name&&e.name.trim()).map(e=>{
    const sub=e.sub||EX2SUB[e.name]||'Other';
    const tType=SUB2TYPE[sub]||'Resistance Training';
    const base=e._orig?JSON.parse(JSON.stringify(e._orig)):{};
    return Object.assign(base,{
      name:e.name.trim(),trainingType:tType,subCategory:sub,
      planIntensity:e.int||'',planDistance:e.dist||'',planSets:e.sets||'',planReps:e.reps||'',
      isBW:!!e.isBW,isSL:!!e.isSL,isSA:!!e.isSA,
      planRestTime:e.restS||'',planRestUnit:e.restSU||'m',
      planRestTimeReps:e.restR||'',planRestUnitReps:e.restRU||'m',
      planContractionType:e.ctype||'',planContractionValue:e.cval||'',
      planEnergySystem:e.esys||'',ytUrl:(e.yt||'').trim(),coachComment:(e.cmt||'').trim(),
      planLegMode:e.isSL?'SL':e.isSA?'SA':(base.planLegMode==='SL'||base.planLegMode==='SA'?'DL':base.planLegMode||'DL')
    });
  });
  return {warmup:_pe.warmup||'',warmupMode:_pe.warmupMode||'text',warmupItems:Array.isArray(_pe.warmupItems)?_pe.warmupItems.filter(it=>it&&((it.name||'').trim()||(it.ytUrl||'').trim()||(it.comment||'').trim())):[],cooldown:'',exercises};
}
async function savePlanEditor(){
  try{
    const dayPlan=JSON.parse(JSON.stringify(coachData?.sessionPlans?.[_pe.day]||{}));
    const sessObj=_peBuildSession();
    // Write the same session to EVERY selected target
    [..._pe.keys].forEach(key=>{
      if(!dayPlan[key])dayPlan[key]={};
      const copy=JSON.parse(JSON.stringify(sessObj));
      const prev=dayPlan[key][_pe.sess];
      if(prev){copy.cooldown=prev.cooldown||'';if(prev.conditioningText)copy.conditioningText=prev.conditioningText;}
      dayPlan[key][_pe.sess]=copy;
    });
    await db.collection('trainlog').doc('coach').update({['sessionPlans.'+_pe.day]:dayPlan,_lastUpdated:Date.now()});
    if(!coachData.sessionPlans)coachData.sessionPlans={};
    coachData.sessionPlans[_pe.day]=dayPlan;
    _rmModal();renderCurrent();
  }catch(e){alert('Save error: '+e.message);}
}
async function clearPlanSess(){
  const n=_pe.keys.size;
  if(!confirm(`Clear ${_pe.sess.toUpperCase()} plan on ${_pe.day} for ${n} selected target${n>1?'s':''}?`))return;
  try{
    const dayPlan=JSON.parse(JSON.stringify(coachData?.sessionPlans?.[_pe.day]||{}));
    [..._pe.keys].forEach(key=>{
      if(dayPlan[key]){
        delete dayPlan[key][_pe.sess];
        if(_pe.sess==='am'&&Array.isArray(dayPlan[key].exercises))delete dayPlan[key].exercises; // legacy flat
        if(!Object.keys(dayPlan[key]).length)delete dayPlan[key];
      }
    });
    await db.collection('trainlog').doc('coach').update({['sessionPlans.'+_pe.day]:dayPlan,_lastUpdated:Date.now()});
    coachData.sessionPlans[_pe.day]=dayPlan;
    _rmModal();renderCurrent();
  }catch(e){alert('Error: '+e.message);}
}

// ══ COMMENT TRANSLATION (hover → EN, online) ══
(function(){
  if(window.__tlInit)return; window.__tlInit=true;
  const cache={}; let tipEl=null, curTarget=null, seq=0;
  function removeTip(){ if(tipEl){tipEl.remove();tipEl=null;} curTarget=null; }
  async function translate(text){
    if(cache[text])return cache[text];
    try{
      const u="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(text);
      const r=await fetch(u); const j=await r.json();
      const o=j[0].map(s=>s[0]).join(""); cache[text]=o; return o;
    }catch(e){
      try{ const r2=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(text)+"&langpair=de|en"); const j2=await r2.json(); const o2=j2.responseData.translatedText; cache[text]=o2; return o2; }
      catch(e2){ return null; }
    }
  }
  function showTip(target,content){
    removeTip();
    const r=target.getBoundingClientRect();
    tipEl=document.createElement('div'); tipEl.className='tl-tip';
    tipEl.innerHTML='<div class="tl-h">🌐 English</div><div class="tl-b"></div>';
    tipEl.querySelector('.tl-b').textContent=content;
    document.body.appendChild(tipEl);
    tipEl.style.left=Math.max(8,Math.min(r.left,window.innerWidth-310))+'px';
    tipEl.style.top=(r.bottom+6)+'px';
    curTarget=target;
  }
  document.addEventListener('mouseover', async (ev)=>{
    const t=ev.target.closest && ev.target.closest('.cmt-text');
    if(!t || t===curTarget) return;
    const text=(t.textContent||'').trim(); if(!text) return;
    const my=t, mySeq=++seq;
    showTip(t,'translating…');
    const tr=await translate(text);
    if(curTarget===my && tipEl && mySeq===seq){ tipEl.querySelector('.tl-b').textContent = tr||'translation unavailable (offline?)'; }
  });
  document.addEventListener('mouseout', (ev)=>{
    const t=ev.target.closest && ev.target.closest('.cmt-text');
    if(t && !t.contains(ev.relatedTarget)) removeTip();
  });
})();
